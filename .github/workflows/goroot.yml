name: R4 focused crypto diagnostics

on:
  workflow_dispatch:
    inputs:
      mode:
        description: CPU sampling or unchanged full-package verification
        type: choice
        default: profile
        options: [profile, verify]

permissions:
  contents: read

jobs:
  profile:
    if: github.repository_owner == 'cpunion' && inputs.mode == 'profile'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOMAXPROCS: '2'
      BINARYEN_CORES: '2'
      GOFLAGS: -tags=llvm22
      LLGO_BUILD_CACHE: 'on'
      LLGO_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-deps
        with:
          llvm-version: 22
      - uses: emscripten-core/setup-emsdk@v15
        with:
          version: '4.0.21'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: ./.github/actions/setup-go
      - name: Build compiler
        run: |
          mkdir "$RUNNER_TEMP/evidence"
          go build -o "$RUNNER_TEMP/llgo" ./cmd/llgo
      - name: Original Go wasm reference
        run: |
          set -o pipefail
          goroot="$(go env GOROOT)"
          GOOS=js GOARCH=wasm CGO_ENABLED=0 GOMAXPROCS=1 timeout 3m \
            go test -v -count=1 -timeout=45s '-run=^TestGenerateParameters$' \
            -exec="$goroot/lib/wasm/go_js_wasm_exec" ./test/std/crypto/dsa \
            2>&1 | tee "$RUNNER_TEMP/evidence/reference.log"
      - name: Build release-optimized LLGo sampling binary
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          timeout --kill-after=10s 5m "$RUNNER_TEMP/llgo" test -c \
            -target emscripten \
            "-ldflags=-extldflags '--profiling-funcs -sSTACK_OVERFLOW_CHECK=2'" \
            -o "$RUNNER_TEMP/evidence/dsa.mjs" ./test/std/crypto/dsa \
            2>&1 | tee "$RUNNER_TEMP/evidence/build.log"
          test -s "$RUNNER_TEMP/evidence/dsa.wasm"
      - name: Sample the original parameter generation workload
        run: |
          set -o pipefail
          status=0
          GOGC=100 timeout --kill-after=5s 60s node --cpu-prof --cpu-prof-interval=1000 \
            --cpu-prof-dir="$RUNNER_TEMP/evidence" --cpu-prof-name=dsa.cpuprofile \
            targets/emscripten-runner.mjs "$RUNNER_TEMP/evidence/dsa.mjs" \
            -test.v '-test.run=^TestGenerateParameters$' -test.count=1 -test.timeout=45s \
            2>&1 | tee "$RUNNER_TEMP/evidence/run.log" || status=$?
          printf 'Diagnostic sampling exit status: %s (not a full-package acceptance result)\n' "$status" \
            | tee "$RUNNER_TEMP/evidence/status.txt"
          test -s "$RUNNER_TEMP/evidence/dsa.cpuprofile"
          node <<'NODE' | tee "$RUNNER_TEMP/evidence/hotspots.json"
          const fs = require('node:fs');
          const path = require('node:path');
          const p = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'evidence/dsa.cpuprofile')));
          const nodes = new Map(p.nodes.map(n => [n.id, n]));
          const hits = new Map();
          let total = 0;
          for (let i = 0; i < (p.samples || []).length; i++) {
            const name = nodes.get(p.samples[i]).callFrame.functionName;
            const delta = p.timeDeltas[i] || 0;
            hits.set(name, (hits.get(name) || 0) + delta);
            total += delta;
          }
          const hot = [...hits].sort((a,b) => b[1]-a[1]).slice(0,40)
            .map(([name,us]) => ({name,ms:us/1000,self_percent:100*us/total}));
          console.log(JSON.stringify({sampled_ms:total/1000,hot}, null, 2));
          NODE
          exit "$status"
      - name: Preserve sample and executable
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: r4-crypto-profile
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error

  verify:
    if: github.repository_owner == 'cpunion' && inputs.mode == 'verify'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        profile: [EC32, EC64, WC32, GJS, GWASI]
    env:
      GOMAXPROCS: '2'
      BINARYEN_CORES: '2'
      GOFLAGS: -tags=llvm22
      LLGO_BUILD_CACHE: 'on'
      LLGO_ROOT: ${{ github.workspace }}
      PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-deps
        with:
          llvm-version: 22
      - uses: emscripten-core/setup-emsdk@v15
        if: matrix.profile == 'EC32' || matrix.profile == 'EC64' || matrix.profile == 'GJS'
        with:
          version: '4.0.21'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: ./.github/actions/setup-binaryen
      - uses: bytecodealliance/actions/wasmtime/setup@v1
        if: matrix.profile == 'WC32' || matrix.profile == 'GWASI'
        with:
          version: '39.0.1'
      - uses: ./.github/actions/setup-go
      - name: Build compiler
        run: |
          mkdir "$RUNNER_TEMP/evidence"
          go build -o "$RUNNER_TEMP/llgo" ./cmd/llgo
      - name: Execute unchanged crypto packages with acceptance limits
        run: |
          set -o pipefail
          args=()
          case "$PROFILE" in
            EC32) args=(-target emscripten -emulator) ;;
            EC64) args=(-target emscripten-memory64 -emulator) ;;
            WC32) args=(-target wasi -emulator) ;;
            GJS) export GOOS=js GOARCH=wasm CGO_ENABLED=0 ;;
            GWASI) export GOOS=wasip1 GOARCH=wasm CGO_ENABLED=0 ;;
          esac
          case "$PROFILE" in
            EC32|EC64|GJS) args+=(-ldflags=-extldflags=-sSTACK_OVERFLOW_CHECK=2) ;;
          esac
          failed=0
          for package in dsa ecdsa rsa tls; do
            test_timeout=60s
            case "$package" in dsa|rsa) test_timeout=3m ;; esac
            status=0
            timeout --kill-after=10s 5m "$RUNNER_TEMP/llgo" test -v -count=1 \
              "-timeout=$test_timeout" "${args[@]}" "./test/std/crypto/$package" \
              2>&1 | tee "$RUNNER_TEMP/evidence/$package.log" || status=$?
            printf '%s %s exit=%s\n' "$PROFILE" "$package" "$status" \
              | tee -a "$RUNNER_TEMP/evidence/status.txt"
            if [[ "$status" != 0 ]]; then failed=1; fi
          done
          exit "$failed"
      - name: Preserve complete package logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: r4-crypto-verify-${{ matrix.profile }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
