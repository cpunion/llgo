name: R4 GC scan-volume diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  volume:
    if: github.repository_owner == 'cpunion'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GOMAXPROCS: '2'
      BINARYEN_CORES: '2'
      GOFLAGS: -tags=llvm22
      LLGO_BUILD_CACHE: 'on'
      LLGO_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-deps
        with:
          llvm-version: 22
      - uses: ./.github/actions/setup-binaryen
      - uses: bytecodealliance/actions/wasmtime/setup@v1
        with:
          version: '39.0.1'
      - uses: ./.github/actions/setup-go
      - name: Build unchanged original program with collector counters
        run: |
          go build -o "$RUNNER_TEMP/llgo" ./cmd/llgo
          mkdir "$RUNNER_TEMP/volume"
          GOOS=wasip1 GOARCH=wasm CGO_ENABLED=0 timeout 5m "$RUNNER_TEMP/llgo" build \
            -ldflags=-w=false -o "$RUNNER_TEMP/volume/gcgort.wasm" \
            "$(go env GOROOT)/test/gcgort.go"
      - name: Sample bounded collection volumes, not acceptance verdicts
        run: |
          for duration in 20s 55s; do
            probe_status=0
            WASMTIME_BACKTRACE_DETAILS=1 timeout 60s wasmtime run \
              --dir=/ --env PWD --env PATH --env GOMAXPROCS=1 \
              -W exceptions=y -W multi-memory=y -W max-wasm-stack=8388608 \
              -W "timeout=$duration" "$RUNNER_TEMP/volume/gcgort.wasm" \
              > "$RUNNER_TEMP/volume/$duration.bin" \
              2> "$RUNNER_TEMP/volume/$duration-stack.log" || probe_status=$?
            printf 'diagnostic duration=%s status=%s\n' "$duration" "$probe_status"
            python3 - "$RUNNER_TEMP/volume/$duration.bin" <<'PY'
          import json, struct, sys
          from pathlib import Path
          data = Path(sys.argv[1]).read_bytes()
          if not data or len(data) % 72:
              raise SystemExit(f"incomplete GC records: {len(data)} bytes")
          names = ('cycle', 'heap_bytes', 'live_bytes', 'root_words', 'object_scans',
                   'object_words', 'large_object_words', 'overflow_events')
          for row in struct.iter_unpack('<9Q', data):
              if row[0] != 0x52344743564f4c31:
                  raise SystemExit('invalid GC record magic')
              print(json.dumps(dict(zip(names, row[1:]))))
          PY
            head -45 "$RUNNER_TEMP/volume/$duration-stack.log"
            if [[ "$probe_status" == 124 ]]; then exit 1; fi
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: r4-gc-volume-${{ github.run_id }}
          path: ${{ runner.temp }}/volume
          if-no-files-found: error
          retention-days: 3
