name: R4 focused crypto diagnostics

on:
  workflow_dispatch:
    inputs:
      mode:
        description: CPU sampling or unchanged full-package verification
        type: choice
        default: profile
        options: [profile, verify, unit, coverage-auth, build-trace, base-coverage, reuse-base-coverage, opt-trace, complex-verify, promote-trace]

permissions:
  contents: read

jobs:
  reuse-base-coverage:
    if: github.repository_owner == 'cpunion' && inputs.mode == 'reuse-base-coverage'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Verify exact report extraction and failure handling
        run: python3 -m unittest discover -s dev -p r4_extract_coverage_test.py -v
      - name: Restore original upstream reports for the exact PR baseline
        id: reports
        run: |
          set -euo pipefail
          command -v curl zstd sha256sum awk
          root="$RUNNER_TEMP/upstream-baseline"
          mkdir -p "$root/raw" "$root/reports"
          base=49bc1b5afde370e89341461844889171a52d4ecb
          # Original main CI: https://github.com/xgo-dev/llgo/actions/runs/34326568339
          # Four native Go jobs (3 reports each), plus the 4-report LTO job.
          # Hashes bind these public Codecov archives to the inspected uploads.
          while read -r upload hash count; do
            url="https://api.codecov.io/upload/gh/xgo-dev/llgo/download?path=shelter/github/xgo-dev::::llgo/$base/$upload.txt"
            curl --fail --location --retry 2 --max-time 60 --silent --show-error \
              "$url" --output "$root/raw/$upload.zst"
            printf '%s  %s\n' "$hash" "$root/raw/$upload.zst" | sha256sum --check
            zstd -dc "$root/raw/$upload.zst" \
              | bash dev/r4_extract_coverage.sh "$root/reports/$upload" "$count"
            printf '%s %s %s\n' "$upload" "$hash" "$count" >> "$root/provenance.txt"
          done <<'REPORTS'
          a79c5cc8-2122-4f29-a500-e77d2b52540d e129f85cb5235f933be457b90dd00b81da21a49a12302a656b0b3c59a9e39fc6 3
          6f850ab3-cbb8-46f9-bccf-f27f9d6d5408 85d3667e0c8e483810822179c7d592fec88e55efe42ed55684a6317b75ba9f97 3
          6f78939e-02df-41e7-a292-d6a45f359d90 cb588407eb0eee52043bafb14ce00ee27595a1aa2b744a4531f81472fe67dc97 3
          dec52694-1eb6-448a-846f-618efd645fa5 f110d6c9e6fa7f9a2847fc57cc29b12c92d88949a3ade2350ddd02194517ec12 3
          f009c492-da61-4c15-a3e8-589c169355e5 c1c36bf6ceb3726d09f70bd0cfbefb20e0046e712b69c0ead3b0cd1436dc00ea 4
          REPORTS
          reports=("$root"/reports/*/coverage-*.txt)
          test "${#reports[@]}" -eq 16
          files=$(printf '%s,' "${reports[@]}")
          printf 'files=%s\n' "${files%,}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: 49bc1b5afde370e89341461844889171a52d4ecb
          fetch-depth: 0
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: r4-restored-upstream-baseline-49bc1b5af
          path: ${{ runner.temp }}/upstream-baseline
          if-no-files-found: error
      - uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          fail_ci_if_error: true
          disable_search: true
          files: ${{ steps.reports.outputs.files }}
          flags: restored-upstream-baseline
          override_commit: 49bc1b5afde370e89341461844889171a52d4ecb
          override_branch: codex/wasm-r4-main-base-20260907

  promote-trace:
    if: github.repository_owner == 'cpunion' && inputs.mode == 'promote-trace'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-deps
        with:
          llvm-version: 22
      - name: Prepare source-pinned LLVM promotion counters
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/input" "$RUNNER_TEMP/evidence" "$RUNNER_TEMP/llvm-trace"
          gh run download 34358466593 --repo cpunion/llgo \
            -n r4-cmplxdivide-GWASI-build-trace --dir "$RUNNER_TEMP/input"
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/llvm/llvm-project/llvmorg-22.1.8/llvm/lib/Transforms/Utils/PromoteMemoryToRegister.cpp \
            --output "$RUNNER_TEMP/llvm-trace/PromoteMemoryToRegister.cpp"
          patch -p1 --directory="$RUNNER_TEMP/llvm-trace" < dev/r4_promote_trace.patch
          read -r -a compile_flags <<< "$(llvm-config --cxxflags)"
          read -r -a link_flags <<< "$(llvm-config --ldflags) $(llvm-config --libs) $(llvm-config --system-libs)"
          clang++ "${compile_flags[@]}" -O2 -DPromoteMemToReg=TracePromoteMemToReg \
            -DisAllocaPromotable=TraceIsAllocaPromotable \
            -c "$RUNNER_TEMP/llvm-trace/PromoteMemoryToRegister.cpp" \
            -o "$RUNNER_TEMP/llvm-trace/PromoteMemoryToRegister.o"
          clang++ "${compile_flags[@]}" -O2 dev/r4_promote_trace.cpp \
            "$RUNNER_TEMP/llvm-trace/PromoteMemoryToRegister.o" "${link_flags[@]}" \
            -o "$RUNNER_TEMP/promote-trace"
      - name: Count full-block rescans on the exact failing module
        run: |
          set -o pipefail
          /usr/bin/time -v timeout --kill-after=5s 5m "$RUNNER_TEMP/promote-trace" \
            "$RUNNER_TEMP/input/before-opt.ll" \
            2>&1 | tee "$RUNNER_TEMP/evidence/promotion.log"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: r4-llvm-promotion-counters
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error

  opt-trace:
    if: github.repository_owner == 'cpunion' && inputs.mode == 'opt-trace'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: baseline
            passes: default<Os>
            skip_mem2reg: 'false'
          - name: early-mem2reg
            passes: function(mem2reg),default<Os>
            skip_mem2reg: 'false'
          - name: diagnostic-sroa-no-mem2reg
            passes: default<Os>
            skip_mem2reg: 'true'
    name: opt-trace (${{ matrix.name }})
    env:
      OPT_PIPELINE: ${{ matrix.passes }}
      SKIP_MEM2REG: ${{ matrix.skip_mem2reg }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-deps
        with:
          llvm-version: 22
      - name: Fetch the exact failing pre-optimization module
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir "$RUNNER_TEMP/input" "$RUNNER_TEMP/evidence"
          gh run download 34358466593 --repo cpunion/llgo \
            -n r4-cmplxdivide-GWASI-build-trace --dir "$RUNNER_TEMP/input"
          test -s "$RUNNER_TEMP/input/before-opt.ll"
      - name: Identify the expensive LLVM pass without rebuilding Go sources
        run: |
          set -o pipefail
          opt --version
          /usr/bin/time -v timeout --kill-after=5s 5m opt \
            "-passes=$OPT_PIPELINE" "-sroa-skip-mem2reg=$SKIP_MEM2REG" \
            -debug-pass-manager -time-passes -time-passes-per-run \
            -mtriple=wasm32-unknown-wasip1 -S "$RUNNER_TEMP/input/before-opt.ll" \
            -o "$RUNNER_TEMP/evidence/optimized.ll" \
            2>&1 | tee "$RUNNER_TEMP/evidence/passes.log"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: r4-exact-module-opt-trace-${{ matrix.name }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error

  base-coverage:
    if: github.repository_owner == 'cpunion' && inputs.mode == 'base-coverage'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      GOMAXPROCS: '2'
      GOFLAGS: -tags=llvm22
      LLGO_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 49bc1b5afde370e89341461844889171a52d4ecb
          fetch-depth: 0
      - uses: ./.github/actions/setup-deps
        with:
          llvm-version: 22
      - uses: ./.github/actions/setup-embed-deps
      - uses: ./.github/actions/setup-go
      - uses: ./.github/actions/setup-demo-deps
      - name: Generate baseline reports with the regular Linux coverage suites
        run: |
          set -euo pipefail
          go list ./... \
            | grep -v '^github.com/xgo-dev/llgo/test/go$' \
            | grep -v '^github.com/xgo-dev/llgo/cl$' \
            | xargs go test -timeout 45m -coverprofile=coverage-main.txt -covermode=atomic \
                -bench '^BenchmarkGo126' -benchtime=1x
          go test -timeout 45m -coverpkg=github.com/xgo-dev/llgo/cl,github.com/xgo-dev/llgo/ssa \
            -coverprofile=coverage-compiler.txt -covermode=atomic \
            -bench '^BenchmarkGo126' -benchtime=1x ./cl
          go test -timeout 45m -coverprofile=coverage-test-go.txt -covermode=atomic ./test/go
          for report in coverage-main.txt coverage-compiler.txt coverage-test-go.txt; do
            test -s "$report"
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: r4-main-baseline-linux-coverage
          path: coverage-*.txt
          if-no-files-found: error
      - uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          fail_ci_if_error: true
          disable_search: true
          files: coverage-main.txt,coverage-compiler.txt,coverage-test-go.txt
          override_commit: 49bc1b5afde370e89341461844889171a52d4ecb
          override_branch: codex/wasm-r4-main-base-20260907

  build-trace:
    if: github.repository_owner == 'cpunion' && (inputs.mode == 'build-trace' || inputs.mode == 'complex-verify')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(inputs.mode == 'complex-verify' && '["EC32","EC64","WC32","GJS","GWASI"]' || '["EC64"]') }}
    env:
      GOMAXPROCS: '2'
      BINARYEN_CORES: '2'
      GOFLAGS: -tags=llvm22
      LLGO_BUILD_CACHE: 'on'
      LLGO_ROOT: ${{ github.workspace }}
      PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-deps
        with:
          llvm-version: 22
      - uses: emscripten-core/setup-emsdk@v15
        if: matrix.profile == 'EC32' || matrix.profile == 'EC64' || matrix.profile == 'GJS'
        with:
          version: '4.0.21'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: ./.github/actions/setup-binaryen
      - uses: bytecodealliance/actions/wasmtime/setup@v1
        if: matrix.profile == 'WC32' || matrix.profile == 'GWASI'
        with:
          version: '39.0.1'
      - uses: ./.github/actions/setup-go
      - name: Build compiler and unchanged GOROOT runner
        env:
          R4_TRACE_LLGO: ${{ runner.temp }}/llgo
          R4_TRACE_DIR: ${{ runner.temp }}/evidence
        run: |
          mkdir "$R4_TRACE_DIR"
          go build -o "$R4_TRACE_LLGO" ./cmd/llgo
          go test -c -o "$RUNNER_TEMP/goroot-runner" ./test/goroot
      - name: Trace the original complex table within its existing budget
        env:
          R4_TRACE_LLGO: ${{ runner.temp }}/llgo
          R4_TRACE_DIR: ${{ runner.temp }}/evidence
          LLGO_R4_BACKEND_TRACE: ${{ runner.temp }}/evidence
        run: |
          set -o pipefail
          command -v ps awk date
          target_goroot="$(go env GOROOT)"
          (
            cd test/goroot
            "$RUNNER_TEMP/goroot-runner" -test.v -test.run '^TestGoRootRunCases$' \
              -test.count=1 -test.timeout=10m -goroot "$target_goroot" \
              -llgo "$GITHUB_WORKSPACE/dev/r4_cmplxdivide_trace.sh" \
              -wasm-profile "$PROFILE" -directive-mode ci -case '^cmplxdivide\.go$' \
              -report "$R4_TRACE_DIR/goroot.json" -progress 30s \
              -max-rss-mib 4096 -rss-warn-mib 1024 \
              -min-memory-free-percent 15 -min-swap-free-mib 512
          ) 2>&1 | tee "$R4_TRACE_DIR/runner.log" &
          trace_job=$!
          while kill -0 "$trace_job" 2>/dev/null; do
            date -u >> "$R4_TRACE_DIR/processes.log"
            ps -eo pid,ppid,pcpu,rss,etime,comm \
              | awk 'NR == 1 || /llgo|clang|wasm|opt|node|python/' >> "$R4_TRACE_DIR/processes.log"
            sleep 10
          done
          wait "$trace_job"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: r4-cmplxdivide-${{ matrix.profile }}-build-trace
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error

  coverage-auth:
    if: github.repository_owner == 'cpunion' && inputs.mode == 'coverage-auth'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 8daf581e7be00531bcf288c68cc58e2c44f114b0
      - uses: ./.github/actions/setup-go
      - name: Reproduce final-head runtime helper coverage
        working-directory: runtime
        run: |
          go test -count=1 -coverprofile="$RUNNER_TEMP/gjs-storage.cover" \
            ./internal/wasmcontext ./internal/gcroot ./internal/runtime/tinygogc
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: final-head-runtime-helper-coverage
          path: ${{ runner.temp }}/gjs-storage.cover
          if-no-files-found: error
      - name: Authenticate coverage with the workflow identity
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          fail_ci_if_error: true
          disable_search: true
          files: ${{ runner.temp }}/gjs-storage.cover
          flags: wasm-runtime-helpers
          override_commit: 8daf581e7be00531bcf288c68cc58e2c44f114b0
          override_branch: codex/wasm-r4-stdlib-text-io-20260905
          override_pr: 235

  unit:
    if: github.repository_owner == 'cpunion' && inputs.mode == 'unit'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOFLAGS: -tags=llvm22
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-deps
        with:
          llvm-version: 22
      - uses: ./.github/actions/setup-go
      - name: Compiler attribution regressions with shared coverage
        run: |
          mkdir "$RUNNER_TEMP/evidence"
          go test ./cl ./ssa -run 'Caller|Panic|Nil|Bounds|MemProfile|Safepoint|Guard|WasmScalarLeaf|WasmTypedLocalZero' \
            -timeout=3m -count=1 -coverpkg=./cl,./ssa -coverprofile="$RUNNER_TEMP/evidence/compiler.cover"
          go tool cover -func="$RUNNER_TEMP/evidence/compiler.cover" \
            | tee "$RUNNER_TEMP/evidence/coverage.txt"
          go test ./internal/build/testdata/wasm-test -run '^TestGuardPanicLocations$' -count=1
          go test ./internal/build -run '^TestWasmCallerStoreUpdates$' -v -count=1 -timeout=2m
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: r4-crypto-compiler-coverage
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error

  profile:
    if: github.repository_owner == 'cpunion' && inputs.mode == 'profile'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOMAXPROCS: '2'
      BINARYEN_CORES: '2'
      GOFLAGS: -tags=llvm22
      LLGO_BUILD_CACHE: 'on'
      LLGO_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-deps
        with:
          llvm-version: 22
      - uses: emscripten-core/setup-emsdk@v15
        with:
          version: '4.0.21'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: ./.github/actions/setup-go
      - name: Build compiler
        run: |
          mkdir "$RUNNER_TEMP/evidence"
          go build -o "$RUNNER_TEMP/llgo" ./cmd/llgo
      - name: Original Go wasm reference
        run: |
          set -o pipefail
          goroot="$(go env GOROOT)"
          GOOS=js GOARCH=wasm CGO_ENABLED=0 GOMAXPROCS=1 timeout 3m \
            go test -v -count=1 -timeout=45s '-run=^TestGenerateParameters$' \
            -exec="$goroot/lib/wasm/go_js_wasm_exec" ./test/std/crypto/dsa \
            2>&1 | tee "$RUNNER_TEMP/evidence/reference.log"
      - name: Build release-optimized LLGo sampling binary
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          timeout --kill-after=10s 5m "$RUNNER_TEMP/llgo" test -c \
            -target emscripten \
            "-ldflags=-extldflags '--profiling-funcs -sSTACK_OVERFLOW_CHECK=2'" \
            -o "$RUNNER_TEMP/evidence/dsa.mjs" ./test/std/crypto/dsa \
            2>&1 | tee "$RUNNER_TEMP/evidence/build.log"
          test -s "$RUNNER_TEMP/evidence/dsa.wasm"
      - name: Sample the original parameter generation workload
        run: |
          set -o pipefail
          status=0
          GOGC=100 timeout --kill-after=5s 60s node --cpu-prof --cpu-prof-interval=1000 \
            --cpu-prof-dir="$RUNNER_TEMP/evidence" --cpu-prof-name=dsa.cpuprofile \
            targets/emscripten-runner.mjs "$RUNNER_TEMP/evidence/dsa.mjs" \
            -test.v '-test.run=^TestGenerateParameters$' -test.count=1 -test.timeout=45s \
            2>&1 | tee "$RUNNER_TEMP/evidence/run.log" || status=$?
          printf 'Diagnostic sampling exit status: %s (not a full-package acceptance result)\n' "$status" \
            | tee "$RUNNER_TEMP/evidence/status.txt"
          test -s "$RUNNER_TEMP/evidence/dsa.cpuprofile"
          node <<'NODE' | tee "$RUNNER_TEMP/evidence/hotspots.json"
          const fs = require('node:fs');
          const path = require('node:path');
          const p = JSON.parse(fs.readFileSync(path.join(process.env.RUNNER_TEMP, 'evidence/dsa.cpuprofile')));
          const nodes = new Map(p.nodes.map(n => [n.id, n]));
          const hits = new Map();
          let total = 0;
          for (let i = 0; i < (p.samples || []).length; i++) {
            const name = nodes.get(p.samples[i]).callFrame.functionName;
            const delta = p.timeDeltas[i] || 0;
            hits.set(name, (hits.get(name) || 0) + delta);
            total += delta;
          }
          const hot = [...hits].sort((a,b) => b[1]-a[1]).slice(0,40)
            .map(([name,us]) => ({name,ms:us/1000,self_percent:100*us/total}));
          console.log(JSON.stringify({sampled_ms:total/1000,hot}, null, 2));
          NODE
          exit "$status"
      - name: Preserve sample and executable
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: r4-crypto-profile
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error

  verify:
    if: github.repository_owner == 'cpunion' && inputs.mode == 'verify'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        profile: [EC32, EC64, WC32, GJS, GWASI]
    env:
      GOMAXPROCS: '2'
      BINARYEN_CORES: '2'
      GOFLAGS: -tags=llvm22
      LLGO_BUILD_CACHE: 'on'
      LLGO_ROOT: ${{ github.workspace }}
      PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-deps
        with:
          llvm-version: 22
      - uses: emscripten-core/setup-emsdk@v15
        if: matrix.profile == 'EC32' || matrix.profile == 'EC64' || matrix.profile == 'GJS'
        with:
          version: '4.0.21'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: ./.github/actions/setup-binaryen
      - uses: bytecodealliance/actions/wasmtime/setup@v1
        if: matrix.profile == 'WC32' || matrix.profile == 'GWASI'
        with:
          version: '39.0.1'
      - uses: ./.github/actions/setup-go
      - name: Build compiler
        run: |
          mkdir "$RUNNER_TEMP/evidence"
          go build -o "$RUNNER_TEMP/llgo" ./cmd/llgo
      - name: Execute unchanged crypto packages with acceptance limits
        run: |
          set -o pipefail
          args=()
          case "$PROFILE" in
            EC32) args=(-target emscripten -emulator) ;;
            EC64) args=(-target emscripten-memory64 -emulator) ;;
            WC32) args=(-target wasi -emulator) ;;
            GJS) export GOOS=js GOARCH=wasm CGO_ENABLED=0 ;;
            GWASI) export GOOS=wasip1 GOARCH=wasm CGO_ENABLED=0 ;;
          esac
          case "$PROFILE" in
            EC32|EC64|GJS) args+=(-ldflags=-extldflags=-sSTACK_OVERFLOW_CHECK=2) ;;
          esac
          failed=0
          status=0
          timeout --kill-after=10s 5m "$RUNNER_TEMP/llgo" test -v -count=1 -timeout=60s \
            "${args[@]}" '-run=Test.*(Nil|Panic|Caller|Guard)' ./internal/build/testdata/wasm-test \
            2>&1 | tee "$RUNNER_TEMP/evidence/guards.log" || status=$?
          printf '%s guards exit=%s\n' "$PROFILE" "$status" \
            | tee -a "$RUNNER_TEMP/evidence/status.txt"
          if [[ "$status" != 0 ]]; then failed=1; fi
          # Separate processes retain the original per-package deadline and
          # independent random inputs; one lucky DSA generation is not enough.
          for workload in dsa-1 dsa-2 dsa-3 ecdsa rsa tls; do
            package="${workload%-*}"
            test_timeout=60s
            case "$package" in dsa|rsa) test_timeout=3m ;; esac
            status=0
            timeout --kill-after=10s 5m "$RUNNER_TEMP/llgo" test -v -count=1 \
              "-timeout=$test_timeout" "${args[@]}" "./test/std/crypto/$package" \
              2>&1 | tee "$RUNNER_TEMP/evidence/$workload.log" || status=$?
            printf '%s %s exit=%s\n' "$PROFILE" "$workload" "$status" \
              | tee -a "$RUNNER_TEMP/evidence/status.txt"
            if [[ "$status" != 0 ]]; then failed=1; fi
          done
          exit "$failed"
      - name: Preserve complete package logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: r4-crypto-verify-${{ matrix.profile }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
