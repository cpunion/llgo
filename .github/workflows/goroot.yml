name: GOROOT

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Focused correctness or bounded resource diagnostics
        type: choice
        default: correctness
        options:
          - correctness
          - resource-probes

permissions:
  contents: read

jobs:
  diagnose:
    if: github.repository_owner == 'cpunion' && inputs.mode != 'resource-probes'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        profile: [EC64, GWASI]
    env:
      GOMAXPROCS: '2'
      BINARYEN_CORES: '2'
      GOFLAGS: -tags=llvm22
      LLGO_BUILD_CACHE: 'on'
      LLGO_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-deps
        with:
          llvm-version: 22
      - uses: emscripten-core/setup-emsdk@v15
        if: matrix.profile == 'EC64'
        with:
          version: '4.0.21'
      - uses: actions/setup-node@v7
        if: matrix.profile == 'EC64'
        with:
          node-version: '24'
      - uses: ./.github/actions/setup-binaryen
      - uses: bytecodealliance/actions/wasmtime/setup@v1
        if: matrix.profile == 'GWASI'
        with:
          version: '39.0.1'
      - uses: ./.github/actions/setup-go
      - name: Build compiler
        run: |
          go build -o "$RUNNER_TEMP/llgo" ./cmd/llgo
          mkdir "$RUNNER_TEMP/evidence"
      - name: Check late-allocation root lowering
        if: matrix.profile == 'EC64'
        run: |
          go test ./internal/abi ./ssa ./cl \
            -run 'Test(LowerLarge|LargeAggregate|Compile.*GCRoot|GCSafepoint|.*GCRoot.*)' \
            -count=1 -coverprofile="$RUNNER_TEMP/evidence/compiler.cover"
          go test ./internal/build -run '^Test(CoalesceWasmPanicLocations|LowerLargeAggregatesGCPolicy)' \
            -count=1 -coverprofile="$RUNNER_TEMP/evidence/build-policy.cover"
      - name: Exercise aggregate snapshots and iterators across GC
        if: matrix.profile == 'EC64'
        run: |
          set -o pipefail
          timeout 5m "$RUNNER_TEMP/llgo" test -c -target emscripten-memory64 \
            -o "$RUNNER_TEMP/evidence/aggregate.mjs" ./internal/build/testdata/wasm-test
          test -s "$RUNNER_TEMP/evidence/aggregate.wasm"
          GOGC=1 timeout 60s node targets/emscripten-memory64-runner.mjs \
            "$RUNNER_TEMP/evidence/aggregate.mjs" \
            -test.v '-test.run=^Test((Large(Aggregate|Struct)|RangeIterator)GCRoots|Caller.*|PanicRecoverAndCaller|NilPointerAndFunctionRecovery|NilStoreOperandOrder)$' -test.count=3 -test.timeout=45s \
            2>&1 | tee "$RUNNER_TEMP/evidence/aggregate.log"
      - name: Preserve and run original EC64 index program
        if: matrix.profile == 'EC64'
        run: |
          set -o pipefail
          evidence="$RUNNER_TEMP/evidence"
          goroot="$(go env GOROOT)"
          go run "$goroot/test/index0.go" "$goroot/test/index.go" > "$evidence/index-generated.go"
          failed=0
          for mode in original checked; do
            extra=()
            if [[ "$mode" == checked ]]; then
              extra=(-ldflags=-extldflags=-sSTACK_OVERFLOW_CHECK=2)
            fi
            timeout 5m "$RUNNER_TEMP/llgo" build -target emscripten-memory64 \
              "${extra[@]}" -o "$evidence/index-$mode.mjs" "$evidence/index-generated.go" \
              > "$evidence/build-$mode.log" 2>&1 || { cat "$evidence/build-$mode.log"; exit 1; }
            test -s "$evidence/index-$mode.mjs"
            test -s "$evidence/index-$mode.wasm"
            for policy in 100 off; do
              status=0
              GOGC="$policy" timeout 60s node targets/emscripten-memory64-runner.mjs \
                "$evidence/index-$mode.mjs" > "$evidence/run-$mode-$policy.log" 2>&1 || status=$?
              printf '%s GOGC=%s status=%s\n' "$mode" "$policy" "$status" | tee -a "$evidence/verdict.txt"
              cat "$evidence/run-$mode-$policy.log"
              if [[ "$status" != 0 || -s "$evidence/run-$mode-$policy.log" ]]; then failed=1; fi
            done
          done
          exit "$failed"
      - name: Preserve GWASI exit-status binary and compare GC settings
        if: matrix.profile == 'GWASI'
        run: |
          set -o pipefail
          evidence="$RUNNER_TEMP/evidence"
          GOOS=wasip1 GOARCH=wasm CGO_ENABLED=0 timeout 5m "$RUNNER_TEMP/llgo" test \
            -c -o "$evidence/exit.wasm" ./internal/build/testdata/wasm-test \
            > "$evidence/build.log" 2>&1 || { cat "$evidence/build.log"; exit 1; }
          test -s "$evidence/exit.wasm"
          failed=0
          GOGC=1 timeout 60s wasmtime run --dir=/ --env PWD --env PATH --env GOGC \
            -W exceptions=y -W multi-memory=y -W max-wasm-stack=8388608 "$evidence/exit.wasm" \
            -test.v -test.count=3 -test.timeout=45s '-test.run=^Test((Large(Aggregate|Struct)|RangeIterator)GCRoots|Caller.*|PanicRecoverAndCaller|NilPointerAndFunctionRecovery|NilStoreOperandOrder)$' \
            2>&1 | tee "$evidence/aggregate.log" || failed=1
          for iteration in {1..10}; do
          for policy in 100 off 1; do
            log="$evidence/run-$policy-$iteration.log"
            status=0
            timeout 60s wasmtime run --dir=/ --env PWD --env PATH --env "GOGC=$policy" \
              -W exceptions=y -W multi-memory=y -W max-wasm-stack=8388608 "$evidence/exit.wasm" \
              -test.v -test.count=1 -test.timeout=30s \
              '-test.run=^Test(IntentionalHostExitFailure|NilStoreOperandOrder|NilPointerAndFunctionRecovery)$' \
              -llgo.intentional-exit-failure > "$log" 2>&1 || status=$?
            printf 'iteration=%s GOGC=%s status=%s\n' "$iteration" "$policy" "$status" | tee -a "$evidence/verdict.txt"
            cat "$log"
            if [[ "$status" != 1 ]] ||
              ! grep -Fq 'intentional wasm exit-status probe' "$log" ||
              ! grep -Eq '^--- FAIL: TestIntentionalHostExitFailure' "$log" ||
              ! grep -Eq '^--- PASS: TestNilStoreOperandOrder' "$log" ||
              ! grep -Eq '^--- PASS: TestNilPointerAndFunctionRecovery' "$log"; then failed=1; fi
          done
          done
          exit "$failed"
      - name: Check cold synthetic-PC registry with allocation profiling
        if: ${{ !cancelled() }}
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -o pipefail
          evidence="$RUNNER_TEMP/evidence"
          args=()
          if [[ "$PROFILE" == EC64 ]]; then
            args=(-target emscripten-memory64)
            module="$evidence/profile.mjs"
          else
            export GOOS=wasip1 GOARCH=wasm CGO_ENABLED=0
            module="$evidence/profile.wasm"
          fi
          timeout 5m "$RUNNER_TEMP/llgo" build "${args[@]}" -o "$module" \
            ./internal/build/testdata/wasm-profile-reentry > "$evidence/profile-build.log" 2>&1 || {
              cat "$evidence/profile-build.log"; exit 1;
            }
          for policy in 100 off 1; do
            for mode in on off; do
              log="$evidence/profile-$policy-$mode.log"
              if [[ "$PROFILE" == EC64 ]]; then
                command=(node targets/emscripten-memory64-runner.mjs "$module")
              else
                command=(wasmtime run --dir=/ --env PWD --env PATH --env GOGC
                  -W exceptions=y -W multi-memory=y -W max-wasm-stack=8388608 "$module")
              fi
              GOGC="$policy" timeout 60s "${command[@]}" "$mode" > "$log" 2>&1 || {
                cat "$log"; exit 1;
              }
              printf 'cold registry GOGC=%s profiling=%s PASS\n' "$policy" "$mode"
            done
          done
      - name: Compile and execute the original complex-division table
        if: ${{ !cancelled() }}
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          evidence="$RUNNER_TEMP/evidence"
          goroot="$(go env GOROOT)"
          args=()
          if [[ "$PROFILE" == EC64 ]]; then
            args=(-target emscripten-memory64)
            module="$evidence/cmplxdivide.mjs"
          else
            export GOOS=wasip1 GOARCH=wasm CGO_ENABLED=0
            module="$evidence/cmplxdivide.wasm"
          fi
          /usr/bin/time -v timeout 5m "$RUNNER_TEMP/llgo" build "${args[@]}" -o "$module" \
            "$goroot/test/cmplxdivide.go" "$goroot/test/cmplxdivide1.go" \
            > "$evidence/cmplxdivide-build.log" 2>&1 || {
              cat "$evidence/cmplxdivide-build.log"; exit 1;
            }
          for policy in 100 1; do
            log="$evidence/cmplxdivide-$policy.log"
            if [[ "$PROFILE" == EC64 ]]; then
              command=(node targets/emscripten-memory64-runner.mjs "$module")
            else
              command=(wasmtime run --dir=/ --env PWD --env PATH --env GOGC
                -W exceptions=y -W multi-memory=y -W max-wasm-stack=8388608 "$module")
            fi
            GOGC="$policy" /usr/bin/time -v -o "$evidence/cmplxdivide-$policy-time.txt" \
              timeout 60s "${command[@]}" > "$log" 2>&1 || {
                cat "$log"; exit 1;
              }
            test ! -s "$log" || { cat "$log"; exit 1; }
            printf 'original cmplxdivide GOGC=%s PASS\n' "$policy"
          done
      - name: Preserve source, modules, and bounded execution evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: r4-runtime-${{ matrix.profile }}-${{ github.run_id }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
          retention-days: 3

  resource-probes:
    if: github.repository_owner == 'cpunion' && inputs.mode == 'resource-probes'
    name: Bounded resource probes (${{ matrix.profile }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        profile: [EC32, GWASI]
    env:
      GOMAXPROCS: '2'
      BINARYEN_CORES: '2'
      GOFLAGS: -tags=llvm22
      LLGO_BUILD_CACHE: 'on'
      LLGO_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-deps
        with:
          llvm-version: 22
      - uses: emscripten-core/setup-emsdk@v15
        if: matrix.profile == 'EC32'
        with:
          version: '4.0.21'
      - uses: actions/setup-node@v7
        if: matrix.profile == 'EC32'
        with:
          node-version: '24'
      - uses: ./.github/actions/setup-binaryen
      - uses: bytecodealliance/actions/wasmtime/setup@v1
        if: matrix.profile == 'GWASI'
        with:
          version: '39.0.1'
      - uses: ./.github/actions/setup-go
      - name: Build compiler and check diagnostic wrappers
        run: |
          python3 -m unittest discover -s dev -p 'wasm_build_diagnostics_test.py' -v
          go build -o "$RUNNER_TEMP/llgo" ./cmd/llgo
          go test -c -o "$RUNNER_TEMP/goroot-runner" ./test/goroot
      - name: Preserve the original recover compile and optimizer inputs
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          python3 dev/wasm_build_diagnostics.py \
            --llgo "$RUNNER_TEMP/llgo" --runner "$RUNNER_TEMP/goroot-runner" \
            --goroot "$(go env GOROOT)" --output "$RUNNER_TEMP/recover-probe" \
            --profile "$PROFILE" --case '^recover\.go$' --clang-passes
      - name: Capture bounded execution stacks of original goroutine workloads
        if: ${{ !cancelled() && matrix.profile == 'GWASI' }}
        run: |
          evidence="$RUNNER_TEMP/runtime-probe"
          mkdir "$evidence"
          goroot="$(go env GOROOT)"
          failed=0
          for case_path in gcgort.go chan/goroutines.go fixedbugs/issue78081.go; do
            case_name="${case_path//\//-}"
            module="$evidence/$case_name.wasm"
            cp "$goroot/test/$case_path" "$evidence/$case_name"
            GOOS=wasip1 GOARCH=wasm CGO_ENABLED=0 \
              /usr/bin/time -v timeout 5m "$RUNNER_TEMP/llgo" build -ldflags=-w=false \
              -o "$module" "$goroot/test/$case_path" > "$evidence/$case_name-build.log" 2>&1 || {
                cat "$evidence/$case_name-build.log"; failed=1; continue;
              }
            test -s "$module" || { failed=1; continue; }
            # Epoch interrupts retain a named Wasm backtrace on timeout. These
            # are diagnostic samples, not acceptance runs or a CPU percentage.
            # Wasmtime 39 guest profiling does not flush its profile on traps.
            for duration in 2s 8s 20s; do
              log="$evidence/$case_name-$duration.log"
              probe_status=0
              WASMTIME_BACKTRACE_DETAILS=1 timeout 60s wasmtime run \
                --dir=/ --env PWD --env PATH --env GOMAXPROCS=1 \
                -W exceptions=y -W multi-memory=y -W max-wasm-stack=8388608 \
                -W "timeout=$duration" "$module" > "$log" 2>&1 || probe_status=$?
              printf '%s duration=%s status=%s (diagnostic only)\n' \
                "$case_path" "$duration" "$probe_status" | tee -a "$evidence/verdict.txt"
              cat "$log"
              if [[ "$probe_status" == 124 ]]; then failed=1; fi
            done
          done
          exit "$failed"
      - name: Upload bounded resource evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: r4-resources-${{ matrix.profile }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/recover-probe/evidence
            ${{ runner.temp }}/runtime-probe
          if-no-files-found: error
          retention-days: 3
