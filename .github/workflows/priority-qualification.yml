name: Priority Pixi Windows qualification
on:
  push:
    branches: [codex/priority-qualification-20261019]
permissions:
  contents: read
jobs:
  pixi-windows:
    name: Pixi Windows with command trace
    runs-on: windows-2025
    timeout-minutes: 65
    defaults:
      run:
        working-directory: llgo dev
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 19679f1cb329849d7bf1cd6968da3f62c03ab5ba
          path: llgo dev
      - uses: prefix-dev/setup-pixi@9dabb60412d3d2d967a8d682f7ce01317af40514
        with:
          pixi-version: v0.81.0
          working-directory: llgo dev/dev
          locked: true
      - name: Check the actual development environment with trace
        shell: pwsh
        run: |
          pixi run --manifest-path dev/pixi.toml --locked pwsh -Command 'Set-PSDebug -Trace 1; & ./dev/check_devenv.ps1'
          if ($LASTEXITCODE -ne 0) { throw 'Pixi Windows qualification failed' }
