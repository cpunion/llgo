name: Diagnose GC starvation on Linux amd64

on:
  push:
    branches: [codex/diagnose-gc-starvation-linux-20260912]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    if: github.repository == 'cpunion/llgo'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-deps
        with:
          llvm-version: '22'
      - uses: ./.github/actions/setup-go
      - name: Install diagnostic tools
        run: sudo apt-get install -y gdb
      - name: Compare unmodified revisions with the same stress tests
        env:
          GOTOOLCHAIN: local
          GOWORK: 'off'
          LLGO_BUILD_CACHE: 'off'
        run: bash dev/diagnose_gc_linux.sh
      - name: Preserve diagnostics even when a workload fails
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gc-linux-amd64-diagnostics
          path: gc-linux-results/
          retention-days: 7
          if-no-files-found: error
