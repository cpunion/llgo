# Temporary validation on the contributor fork; removed before the PR.
name: Traceback validation
on:
  push:
    branches: [codex/panic-test-stack-20260925]
permissions:
  contents: read
jobs:
  traceback:
    if: github.repository == 'cpunion/llgo'
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            arch: amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-deps
        with:
          llvm-version: '22'
          windows-arch: ${{ matrix.arch || 'amd64' }}
      - uses: ./.github/actions/setup-go
      - name: Windows Go SSA package
        shell: bash
        run: CC="$LLGO_WINDOWS_HOST_CC" CXX="$LLGO_WINDOWS_HOST_CXX" go test ./ssa -count=1
      - name: Windows compiler IR snapshots
        shell: bash
        run: CC="$LLGO_WINDOWS_HOST_CC" CXX="$LLGO_WINDOWS_HOST_CXX" go test ./cl -run '^(TestVar|TestBasicFunc|TestIntrinsicBoolToUint8)$' -count=1
