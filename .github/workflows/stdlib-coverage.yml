name: Stdlib Coverage

on:
  # Temporary: coroutine PRs use Go/format only; revert before upstream merge.
  workflow_dispatch:
  push:
    branches:
      - "**"
      - "!dependabot/**"
      - "!xgopilot/**"
      - "!llvm-coro"
      - "!coro/**"
  pull_request:
    branches:
      - "**"
      - "!llvm-coro"
      - "!coro/**"

concurrency:
  group: stdlib-coverage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    timeout-minutes: 15
    strategy:
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          go-version: "1.24.2"

      - name: Check stdlib function coverage
        run: doc/_readme/scripts/check_std_cover.sh
