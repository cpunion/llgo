name: WASM runtime and size validation

on:
  push:
    branches: [codex/validate-w2a-browser-20260915]

permissions:
  contents: read

jobs:
  runtime:
    name: Focused W2 runtime, Chrome, and small binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-deps
        with:
          llvm-version: 22
      - uses: emscripten-core/setup-emsdk@v15
        with:
          version: '4.0.21'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: '153.0.8010.36'
          install-dependencies: true
      - uses: ./.github/actions/setup-binaryen
      - uses: bytecodealliance/actions/wasmtime/setup@v1
        with:
          version: '39.0.1'
      - uses: bytecodealliance/actions/wasm-tools/setup@v1
        with:
          version: '1.243.0'
      - uses: ./.github/actions/setup-go
      - name: Build exact W2 candidate
        run: dev/build_ci_tools.sh "$RUNNER_TEMP/llgo-bin"
      - name: Retain native cprintf and paired lifecycle diagnostics
        env:
          GOMAXPROCS: '2'
          GOFLAGS: -tags=llvm22
          LLGO_BUILD_CACHE: 'on'
        run: |
          set -euo pipefail
          git fetch --depth=1 origin 291adee7373a582c85f18245c2874f25f601b48c
          git worktree add --detach "$RUNNER_TEMP/diagnostic-base" FETCH_HEAD
          (cd "$RUNNER_TEMP/diagnostic-base" && go build -o "$RUNNER_TEMP/llgo-base" ./cmd/llgo)
          git fetch --depth=1 origin 2db247e4384848c189e94cbbe96b04462e9bc698
          git worktree add --detach "$RUNNER_TEMP/diagnostic-main" FETCH_HEAD
          (cd "$RUNNER_TEMP/diagnostic-main" && go build -o "$RUNNER_TEMP/llgo-main" ./cmd/llgo)
          for revision in main base head; do
            source_root="$RUNNER_TEMP/diagnostic-$revision"
            compiler="$RUNNER_TEMP/llgo-$revision"
            if [[ "$revision" == head ]]; then
              source_root="$GITHUB_WORKSPACE"
              compiler="$RUNNER_TEMP/llgo-bin/llgo"
            fi
            output="$RUNNER_TEMP/diagnostic/$revision"
            mkdir -p "$output"
            LLGO_ROOT="$source_root" "$compiler" build -o "$output/cprintf" "$GITHUB_WORKSPACE/benchmark/binary_size/cprintf/main.go"
            "$output/cprintf"
            llvm-readelf --sections --wide "$output/cprintf" > "$output/sections.txt"
            llvm-nm --print-size --size-sort "$output/cprintf" > "$output/symbols.txt"
          done
          failed=0
          for revision in base head; do
            source_root="$RUNNER_TEMP/diagnostic-base"
            compiler="$RUNNER_TEMP/llgo-base"
            if [[ "$revision" == head ]]; then
              source_root="$GITHUB_WORKSPACE"
              compiler="$RUNNER_TEMP/llgo-bin/llgo"
            fi
            output="$RUNNER_TEMP/diagnostic/$revision"
            LLGO_ROOT="$source_root" "$compiler" build -target emscripten -o "$output/lifecycle.mjs" "$GITHUB_WORKSPACE/internal/build/testdata/wasm-lifecycle"
            for iteration in {1..10}; do
              status=0
              node targets/emscripten-runner.mjs "$output/lifecycle.mjs" > "$output/lifecycle-$iteration.log" 2>&1 || status=$?
              printf 'LIFECYCLE %s %s exit=%s\n' "$revision" "$iteration" "$status"
              if [[ "$status" -ne 0 ]]; then
                cat "$output/lifecycle-$iteration.log"
                failed=1
              fi
            done
          done
          exit "$failed"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-cprintf-and-lifecycle
          path: ${{ runner.temp }}/diagnostic
          if-no-files-found: error
      - name: Execute complete runtime gate including both real browser providers
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
          LLGO: ${{ runner.temp }}/llgo-bin/llgo
          LLGO_ROOT: ${{ github.workspace }}
          LLGO_BUILD_CACHE: '1'
        run: dev/test_wasm_single_worker.sh runtime
      - name: Compare cprintf and println with the published W2 code
        env:
          GOMAXPROCS: '2'
          GOFLAGS: -tags=llvm22
          LLGO_BUILD_CACHE: 'on'
        run: |
          git fetch --depth=1 origin 291adee7373a582c85f18245c2874f25f601b48c
          git worktree add --detach "$RUNNER_TEMP/size-base" FETCH_HEAD
          (
            cd "$RUNNER_TEMP/size-base"
            go build -o "$RUNNER_TEMP/size-base-llgo" ./cmd/llgo
          )
          for profile in emscripten emscripten-memory64; do
            for example in cprintf println; do
              fixture="$GITHUB_WORKSPACE/benchmark/binary_size/$example"
              for revision in base head; do
                if [[ "$revision" == base ]]; then
                  source_root="$RUNNER_TEMP/size-base"
                  compiler="$RUNNER_TEMP/size-base-llgo"
                else
                  source_root="$GITHUB_WORKSPACE"
                  compiler="$RUNNER_TEMP/llgo-bin/llgo"
                fi
                output="$RUNNER_TEMP/size-$revision-$profile-$example"
                mkdir -p "$output"
                LLGO_ROOT="$source_root" "$compiler" build -target "$profile" -o "$output/program.mjs" "$fixture"
                node "$GITHUB_WORKSPACE/targets/$profile-runner.mjs" "$output/program.mjs"
                printf 'SIZE %s %s %s module=%s glue=%s\n' "$revision" "$profile" "$example" "$(stat -c%s "$output/program.wasm")" "$(stat -c%s "$output/program.mjs")"
              done
              base_size=$(stat -c%s "$RUNNER_TEMP/size-base-$profile-$example/program.wasm")
              head_size=$(stat -c%s "$RUNNER_TEMP/size-head-$profile-$example/program.wasm")
              if (( head_size > base_size )); then
                echo "narrowing check optimization increased $profile/$example module size" >&2
                exit 1
              fi
            done
          done
