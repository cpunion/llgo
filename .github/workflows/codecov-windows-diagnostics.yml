name: Windows host Codecov diagnostics
on:
  push:
    branches: [codex/verify-codecov-windows-20261005]
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-11-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.10'
          architecture: x64
      - name: Install CLI with host Python and probe its architecture
        id: windows_codecov
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pythonRoot = $env:pythonLocation
          & (Join-Path $pythonRoot 'python.exe') -c 'import platform; assert platform.machine() == "AMD64"; print(platform.machine())'
          if ($LASTEXITCODE -ne 0) { throw "Host Python architecture probe failed: $LASTEXITCODE" }
          & (Join-Path $pythonRoot 'python.exe') -m pip install --only-binary=:all: codecov-cli==11.3.1
          if ($LASTEXITCODE -ne 0) { throw "Installing Codecov CLI failed: $LASTEXITCODE" }
          $binary = Join-Path $pythonRoot 'Scripts/codecovcli.exe'
          & $binary --version
          if ($LASTEXITCODE -ne 0) { throw "Codecov CLI version probe failed: $LASTEXITCODE" }
          "binary=$binary" >> $env:GITHUB_OUTPUT
      - name: Generate actual host test coverage
        shell: bash
        run: go test ./cmd/internal/gdb -count=1 -coverprofile=coverage-host.txt
      - name: Exercise the official action with an absolute Windows binary
        uses: codecov/codecov-action@v7
        with:
          binary: ${{ steps.windows_codecov.outputs.binary }}
          use_pypi: true
          version: '11.3.1'
          files: coverage-host.txt
          disable_search: true
          dry_run: true
          fail_ci_if_error: true
