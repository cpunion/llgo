name: Targets

on:
  push:
    branches:
      - main
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  llgo:
    timeout-minutes: 30
    strategy:
      matrix:
        os:
          - ubuntu-latest
        llvm: [19]
    runs-on: ${{matrix.os}}
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        uses: ./.github/actions/setup-deps
        with:
          llvm-version: ${{matrix.llvm}}

      - name: Install embedded debugger dependencies
        run: sudo apt-get install -y gdb-multiarch lldb-${{matrix.llvm}} qemu-system-arm

      - name: Set up Go for build
        uses: ./.github/actions/setup-go

      - name: Install
        run: |
          go install ./...
          echo "LLGO_ROOT=$GITHUB_WORKSPACE" >> $GITHUB_ENV

      - name: Build targets (empty)
        run: |
          cd _demo/embed/targetsbuild
          bash build.sh empty

      - name: Build targets (defer)
        run: |
          cd _demo/embed/targetsbuild
          bash build.sh defer

      - name: Test embedded debugger transports
        run: bash cmd/llgo/debugtest/embedded/runtest.sh

      - name: Test physical-probe opt-in guard
        shell: bash
        run: |
          set +e
          output="$(bash cmd/llgo/debugtest/hardware/runtest.sh 2>&1)"
          result=$?
          set -e
          test "${result}" -eq 2
          grep -F 'LLGO_HARDWARE_CONFIRM=flash' <<<"${output}"

      - name: Test LLGo GDB adapter
        run: LLGO_GDB_INTEGRATION=1 go test ./cmd/internal/gdb -run '^TestGDBIntegration$' -count=1
