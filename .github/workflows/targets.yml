name: Targets

on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  llgo:
    # The empty and defer probes compile the complete embedded target catalog
    # sequentially. Coroutine planning makes the combined lane exceed the old
    # 30-minute budget on hosted runners even while targets keep succeeding.
    timeout-minutes: 45
    strategy:
      matrix:
        os:
          - ubuntu-latest
        llvm: [19]
    runs-on: ${{matrix.os}}
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        uses: ./.github/actions/setup-deps
        with:
          llvm-version: ${{matrix.llvm}}

      - name: Set up Go for build
        uses: ./.github/actions/setup-go

      - name: Install
        run: |
          go install ./...
          echo "LLGO_ROOT=$GITHUB_WORKSPACE" >> $GITHUB_ENV

      - name: Build targets (empty)
        run: |
          cd _demo/embed/targetsbuild
          bash build.sh empty

      - name: Build targets (defer)
        run: |
          cd _demo/embed/targetsbuild
          bash build.sh defer
