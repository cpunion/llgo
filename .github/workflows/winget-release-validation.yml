name: WinGet release validation
on:
  push:
    branches: [codex/qualify-native-1.0.9-20261029]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qualify-native-109-${{ github.ref }}
  cancel-in-progress: true
jobs:
  repackage:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Repackage verified original 1.0.9 compilers
        run: python .github/windows/qualify-native-109.py
      - uses: actions/upload-artifact@v7
        with:
          name: llgo-1.0.9-native-candidates
          path: qualification
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
  validate:
    needs: repackage
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        profile: [MSVC, MinGW]
        goarch: [amd64, '386', arm64]
        include:
          - goarch: '386'
            runner: windows-2022
          - goarch: amd64
            runner: windows-2022
          - goarch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: xgo-dev/llgo
          ref: b2e1d4e84fcccdc893b77a652c2f5c9b2fc65836
          path: release-source
      - uses: actions/download-artifact@v8
        with:
          name: llgo-1.0.9-native-candidates
          path: qualification
      - name: Bootstrap stable WinGet
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $installed = Get-Command winget.exe -ErrorAction SilentlyContinue
          $version = if ($installed) { [version]((& $installed.Source --version).Trim().TrimStart('v')) } else { [version]'0.0' }
          if ($version -lt [version]'1.29.290') {
            # Bootstrap from verified release files, avoiding the module's
            # failing latest-release discovery on the ARM64 image. Older
            # preinstalled clients do not recognize the 1.12 schema header.
            $base = 'https://github.com/microsoft/winget-cli/releases/download/v1.29.290'
            $files = @{
              'Microsoft.DesktopAppInstaller_8wekyb3d8bbwe.msixbundle' = '6824b6e9484ab24687d99a0c829d2bcbcc7849a70a4d0f596fc43c89d20dff15'
              'DesktopAppInstaller_Dependencies.zip' = '50c377516749002dcdda9c8e52f26e8e2ea73d52131ce96ffd082dcf60ca6677'
              'e53e159d00e04f729cc2180cffd1c02e_License1.xml' = 'bcb15118ec47df24e3e6013a7006147c3a15b3a8104ed660fe87c8b4ed01f485'
            }
            $temporary = Join-Path $env:RUNNER_TEMP 'winget-bootstrap'
            New-Item -ItemType Directory -Force $temporary | Out-Null
            foreach ($name in $files.Keys) {
              $path = Join-Path $temporary $name
              curl.exe --fail --location --retry 5 --retry-all-errors --output $path "$base/$name"
              if ($LASTEXITCODE -ne 0) { throw "Downloading $name failed" }
              if ((Get-FileHash $path -Algorithm SHA256).Hash -ne $files[$name]) { throw "Invalid hash for $name" }
            }
            $deps = Join-Path $temporary 'dependencies'
            Expand-Archive (Join-Path $temporary 'DesktopAppInstaller_Dependencies.zip') $deps
            $arch = if ($env:RUNNER_ARCH -eq 'ARM64') { 'arm64' } else { 'x64' }
            $packages = @(Get-ChildItem (Join-Path $deps $arch) -Recurse -File | Where-Object { $_.Extension -in @('.appx', '.msix') })
            if (-not $packages.Count) { throw "Missing WinGet dependencies for $arch" }
            Add-AppxPackage -Path (Join-Path $temporary 'Microsoft.DesktopAppInstaller_8wekyb3d8bbwe.msixbundle') -DependencyPath $packages.FullName -ForceApplicationShutdown
            # Server 2022 also needs the release's offline license. Match the
            # WinGet repair module's provision-and-register installation path.
            Add-AppxProvisionedPackage -Online -PackagePath (Join-Path $temporary 'Microsoft.DesktopAppInstaller_8wekyb3d8bbwe.msixbundle') -LicensePath (Join-Path $temporary 'e53e159d00e04f729cc2180cffd1c02e_License1.xml') | Out-Null
            $package = Get-AppxPackage -Name Microsoft.DesktopAppInstaller
            Add-AppxPackage -Register -DisableDevelopmentMode -Path (Join-Path $package.InstallLocation 'AppxManifest.xml')
          }
          $env:PATH += ';' + (Join-Path $env:LOCALAPPDATA 'Microsoft/WindowsApps')
          (Join-Path $env:LOCALAPPDATA 'Microsoft/WindowsApps') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          winget --version
          if ($LASTEXITCODE -ne 0) { throw 'WinGet bootstrap failed' }
      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          cache: 'false'
          architecture: ${{ matrix.goarch == 'arm64' && 'arm64' || 'x64' }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Stage the selected original compiler package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-source/.windows-dist | Out-Null
          $abi = '${{ matrix.profile }}'.ToLowerInvariant()
          Copy-Item "qualification/native/llgo1.0.9.windows-${{ matrix.goarch }}-$abi-native.zip*" release-source/.windows-dist/
      - name: Check standalone archive without development dependencies
        shell: pwsh
        run: |
          $test = Join-Path $PWD '.github/windows/test-release.ps1'
          $readobj = Join-Path $PWD 'qualification/inspection/${{ matrix.goarch }}/llvm-readobj.exe'
          $abi = '${{ matrix.profile }}'.ToLowerInvariant()
          Set-Location release-source
          & $test -Native -CheckOnly -ReadObj $readobj -GoArch '${{ matrix.goarch }}' -Profile $abi
      - name: Test WinGet validate install startup and uninstall
        shell: pwsh
        run: ./.github/windows/qualify-native-winget.ps1 -GoArch '${{ matrix.goarch }}' -Profile '${{ matrix.profile }}'
      - name: Install native compilation dependencies
        uses: ./.github/actions/setup-deps
        with:
          windows-abi: ${{ matrix.profile == 'MSVC' && 'msvc' || 'mingw' }}
          windows-arch: ${{ matrix.goarch }}
      - name: Activate native target
        uses: ./.github/actions/activate-windows-target
        with:
          windows-abi: ${{ matrix.profile == 'MSVC' && 'msvc' || 'mingw' }}
          windows-arch: ${{ matrix.goarch }}
      - name: Compile and run Go C and C++ using the packaged compiler alias
        shell: pwsh
        run: |
          $test = Join-Path $PWD '.github/windows/test-release.ps1'
          $readobj = Join-Path $PWD 'qualification/inspection/${{ matrix.goarch }}/llvm-readobj.exe'
          $abi = '${{ matrix.profile }}'.ToLowerInvariant()
          Set-Location release-source
          & $test -Native -ReadObj $readobj -GoArch '${{ matrix.goarch }}' -Profile $abi
      - name: Preserve WinGet diagnostic logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: winget-native-109-logs-${{ matrix.goarch }}-${{ matrix.profile }}
          path: |
            ~/AppData/Local/Packages/Microsoft.DesktopAppInstaller_8wekyb3d8bbwe/LocalState/DiagOutputDir/
            ~/AppData/Local/Microsoft/WinGet/DiagOutputDir/
          if-no-files-found: ignore
  ready:
    needs: [repackage, validate]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: llgo-1.0.9-native-candidates
          path: qualification
      - name: Verify all six tested packages before publication
        working-directory: qualification/native
        run: sha256sum --check llgo1.0.9.windows-native.checksums.txt
