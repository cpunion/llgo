name: GDB Intel diagnostics
on:
  push:
    branches: [codex/diagnose-gdb-intel-20261005]
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-deps
        with:
          llvm-version: "22"
      - uses: ./.github/actions/setup-go
      - name: Build LLGo from main
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/llgo-bin"
          go build -o "$RUNNER_TEMP/llgo-bin/llgo" ./cmd/llgo
          echo "$RUNNER_TEMP/llgo-bin" >> "$GITHUB_PATH"
          echo "LLGO_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-gdb
      - name: Match native debugger privileges in main CI
        run: |
          set -euo pipefail
          wrapper="$RUNNER_TEMP/llgo-gdb-native"
          printf '#!/bin/bash\nexec sudo -n %q "$@"\n' "$LLGO_GDB" > "$wrapper"
          chmod +x "$wrapper"
          "$wrapper" --batch --nx -ex 'python import gdb; print(gdb.VERSION)'
          echo "LLGO_GDB=$wrapper" >> "$GITHUB_ENV"
      - name: Match the preceding LLDB acceptance in PR CI
        env:
          LLGO_LLDB: /usr/bin/lldb
        run: bash test/debug/runtime/runtest.sh -v
      - name: Run native GDB acceptance with live command traces
        env:
          LLGO_GDB_INTEGRATION: "1"
        run: |
          set -euo pipefail
          go test ./cmd/internal/gdb -run '^TestGDBIntegration$' -count=5 -timeout=12m -v 2>&1 | tee "$RUNNER_TEMP/gdb-acceptance.log"
      - name: Collect stuck debugger stacks
        if: failure()
        run: |
          ps -axo pid,ppid,stat,wchan,command > "$RUNNER_TEMP/gdb-processes.log"
          for pid in $(pgrep -x gdb); do
            sudo -n sample "$pid" 5 -file "$RUNNER_TEMP/gdb-sample-$pid.log"
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gdb-intel-diagnostics
          path: ${{ runner.temp }}/gdb-*.log
          if-no-files-found: error
