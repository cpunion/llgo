name: Exact d4b Codecov baseline

on:
  push:
    branches: [codex/codecov-base-d4b-20261109]

permissions:
  contents: read

concurrency:
  group: codecov-baseline-d4b.yml-${{ github.ref }}
  cancel-in-progress: false

jobs:
  baseline:
    if: github.repository == 'cpunion/llgo' && github.ref == 'refs/heads/codex/codecov-base-d4b-20261109'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        producer: [go, llgo, dev, browser]
    env:
      GOENV: 'off'
      GOWORK: 'off'
      GOTOOLCHAIN: local
      GOSUMDB: sum.golang.org
      GOPRIVATE: ''
      GONOSUMDB: ''
      GOINSECURE: ''
      LLGO_ROOT: ${{ github.workspace }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check and preserve the control before checking out the baseline
        run: |
          python3 -m pip install -r .github/scripts/requirements-ci.txt
          python3 -m unittest discover -s .github/scripts -p test_codecov_baseline.py -v
          cp .github/scripts/codecov_baseline.py "$RUNNER_TEMP/codecov_baseline.py"
      - uses: actions/checkout@v7
        with:
          ref: d4b248e8c7790ad7083325ea2b001c16e4a5a8a5
          persist-credentials: false
      - uses: ./.github/actions/setup-deps
        with:
          llvm-version: '22'
      - uses: ./.github/actions/setup-embed-deps
        if: matrix.producer == 'go' || matrix.producer == 'llgo'
      - uses: ./.github/actions/setup-demo-deps
        if: matrix.producer != 'browser'
      - uses: ./.github/actions/setup-go
        if: matrix.producer == 'go'
        with:
          go-version: '1.21.13'
          cache: false
      - uses: ./.github/actions/setup-go
        with:
          cache: false
      - uses: emscripten-core/setup-emsdk@v15
        if: matrix.producer == 'browser'
        with:
          version: '6.0.8'
      - uses: actions/setup-node@v7
        if: matrix.producer == 'browser'
        with:
          node-version: '24'
      - uses: browser-actions/setup-chrome@v2
        if: matrix.producer == 'browser'
        id: chrome
        with:
          chrome-version: '152.0.7977.54'
          install-dependencies: true
      - uses: ./.github/actions/setup-binaryen
        if: matrix.producer == 'browser'
      - name: Materialize the exact original Linux commands
        run: |
          set -euo pipefail
          test "$(go env GOVERSION)" = go1.27.0
          test "$(go env GOOS)/$(go env GOARCH)" = linux/amd64
          test "$(llvm-config --version)" = 22.1.8
          echo "BASE_COVERAGE=$RUNNER_TEMP/base-codecov" >> "$GITHUB_ENV"
          python3 "$RUNNER_TEMP/codecov_baseline.py" prepare '${{ matrix.producer }}' "$RUNNER_TEMP/base-codecov"
          go version > "$RUNNER_TEMP/base-codecov/go-version.txt"
          llvm-config --version > "$RUNNER_TEMP/base-codecov/llvm-version.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/base-codecov/source.txt"
      - name: Original compiler build
        run: bash --noprofile --norc -e -o pipefail "$BASE_COVERAGE/build.sh"
      - name: Original dev LTO plugin build
        if: matrix.producer == 'dev'
        run: bash --noprofile --norc -e -o pipefail "$BASE_COVERAGE/plugin.sh"
      - name: Original Go coverage suite
        if: matrix.producer == 'go'
        env:
          LLGO_GO_TEST_OVERLAY: ''
          LLGO_TEST_EXTENDED_ABI: '1'
        run: bash --noprofile --norc -e -o pipefail "$BASE_COVERAGE/coverage.sh"
      - name: Original LLGo coverage suite
        if: matrix.producer == 'llgo'
        env:
          LLGO_BUILD_CACHE: '1'
          LLGO_TEST_BENCH_GO126: '1'
          LLGO_TEST_SUITE: core
          LLGO_TEST_COVERPROFILE: coverage-llgo.txt
          LLGO_TEST_COVERPKG: github.com/xgo-dev/llgo/test/...
        run: bash --noprofile --norc -e -o pipefail "$BASE_COVERAGE/coverage.sh"
      - name: Original dev LTO coverage suite
        if: matrix.producer == 'dev'
        run: bash --noprofile --norc -e -o pipefail "$BASE_COVERAGE/coverage.sh"
      - name: Original browser coverage suite
        if: matrix.producer == 'browser'
        env:
          LLGO: ${{ runner.temp }}/llgo-bin/llgo
          LLGO_BUILD_CACHE: '1'
          LLGO_BROWSER_CHROME: ${{ steps.chrome.outputs.chrome-path }}
          LLGO_BROWSER_CHROME_NO_SANDBOX: '1'
          LLGO_BROWSER_COVERAGE_DIR: coverage-browser
        run: bash --noprofile --norc -e -o pipefail "$BASE_COVERAGE/coverage.sh"
      - name: Original Go AES conformance
        if: matrix.producer == 'go'
        run: bash --noprofile --norc -e -o pipefail "$BASE_COVERAGE/aes.sh"
      - name: Original Go traceback coverage
        if: matrix.producer == 'go'
        working-directory: runtime
        run: bash --noprofile --norc -e -o pipefail "$BASE_COVERAGE/traceback.sh"
      - name: Original Go embedded tests
        if: matrix.producer == 'go'
        env:
          LLGO_EMBED_TESTS: '1'
        run: bash --noprofile --norc -e -o pipefail "$BASE_COVERAGE/embedded.sh"
      - name: Original Go standard symbol check
        if: matrix.producer == 'go'
        run: bash --noprofile --norc -e -o pipefail "$BASE_COVERAGE/stdlib.sh"
      - name: Original host coverage filtering
        if: matrix.producer == 'go'
        run: bash --noprofile --norc -e -o pipefail "$BASE_COVERAGE/filter.sh"
      - name: Verify immutable source and every original report
        run: python3 "$RUNNER_TEMP/codecov_baseline.py" verify '${{ matrix.producer }}' "$BASE_COVERAGE"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: d4b-baseline-${{ matrix.producer }}
          path: ${{ runner.temp }}/base-codecov
          if-no-files-found: error

  upload:
    if: github.repository == 'cpunion/llgo' && github.ref == 'refs/heads/codex/codecov-base-d4b-20261109'
    needs: baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Preserve the verifier
        run: |
          python3 -m pip install -r .github/scripts/requirements-ci.txt
          cp .github/scripts/codecov_baseline.py "$RUNNER_TEMP/codecov_baseline.py"
      - uses: actions/checkout@v7
        with:
          ref: d4b248e8c7790ad7083325ea2b001c16e4a5a8a5
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: d4b-baseline-*
          path: ${{ runner.temp }}/baseline-downloads
      - name: Verify all four successful original producers
        id: verified
        run: |
          set -euo pipefail
          for producer in go llgo dev browser; do
            mv "$RUNNER_TEMP/baseline-downloads/d4b-baseline-$producer" "$RUNNER_TEMP/baseline-downloads/$producer"
          done
          python3 "$RUNNER_TEMP/codecov_baseline.py" downloaded all "$RUNNER_TEMP/baseline-downloads"
      - uses: codecov/codecov-action@v7
        with:
          use_pypi: true
          version: '11.3.1'
          use_oidc: true
          override_commit: d4b248e8c7790ad7083325ea2b001c16e4a5a8a5
          override_branch: codex/ci-base-main-d4b-20261105
          disable_search: true
          fail_ci_if_error: true
          files: ${{ steps.verified.outputs.go_files }}
          flags: go-tests
      - uses: codecov/codecov-action@v7
        with:
          use_pypi: true
          version: '11.3.1'
          use_oidc: true
          override_commit: d4b248e8c7790ad7083325ea2b001c16e4a5a8a5
          override_branch: codex/ci-base-main-d4b-20261105
          disable_search: true
          fail_ci_if_error: true
          files: ${{ steps.verified.outputs.llgo_files }}
          flags: llgo-tests
      - uses: codecov/codecov-action@v7
        with:
          use_pypi: true
          version: '11.3.1'
          use_oidc: true
          override_commit: d4b248e8c7790ad7083325ea2b001c16e4a5a8a5
          override_branch: codex/ci-base-main-d4b-20261105
          disable_search: true
          fail_ci_if_error: true
          files: ${{ steps.verified.outputs.dev_files }}
          flags: dev-lto-globaldce
      - uses: codecov/codecov-action@v7
        with:
          use_pypi: true
          version: '11.3.1'
          use_oidc: true
          override_commit: d4b248e8c7790ad7083325ea2b001c16e4a5a8a5
          override_branch: codex/ci-base-main-d4b-20261105
          disable_search: true
          fail_ci_if_error: true
          files: ${{ steps.verified.outputs.browser_files }}
          flags: go-tests
