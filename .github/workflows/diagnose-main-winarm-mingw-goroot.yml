name: Diagnose main Windows ARM64 MinGW concurrent build

on:
  push:
    branches: [codex/diagnose-main-winarm-mingw-goroot-20260906]

permissions:
  contents: read

jobs:
  full:
    runs-on: windows-11-arm
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-deps
        with:
          llvm-version: "22"
          windows-abi: mingw
          windows-arch: arm64
      - uses: ./.github/actions/setup-go
        with:
          go-version: "1.27.0"
          architecture: arm64
      - name: Build LLGo test tools
        shell: bash
        run: |
          set -euo pipefail
          dev/build_ci_tools.sh "$RUNNER_TEMP/llgo-bin"
          echo "$RUNNER_TEMP/llgo-bin" >> "$GITHUB_PATH"
          echo "LLGO_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - uses: ./.github/actions/activate-windows-target
        with:
          windows-abi: mingw
          windows-arch: arm64
      - name: Run concurrent build with serial test execution
        timeout-minutes: 45
        shell: bash
        env:
          LLGO: ${{ runner.temp }}/llgo-bin/llgo.exe
          LLGO_BUILD_CACHE: "1"
          LLGO_GOROOT_HEARTBEAT_SECONDS: "30"
          LLGO_STDIO_NOBUF: "1"
          LLGO_TEST_JOBS: "2"
          LLGO_TEST_RUN_SEQUENTIAL: "1"
          LLGO_TEST_VERBOSE: "1"
        run: dev/test_go_version.sh 1.27
