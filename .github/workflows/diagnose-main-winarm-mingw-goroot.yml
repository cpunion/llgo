name: Diagnose main Windows ARM64 MinGW failed binaries

on:
  push:
    branches: [codex/diagnose-main-winarm-mingw-goroot-20260906]

permissions:
  contents: read

jobs:
  classify:
    runs-on: windows-11-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-deps
        with:
          llvm-version: "22"
          windows-abi: mingw
          windows-arch: arm64
      - uses: ./.github/actions/setup-demo-deps
        with:
          windows-abi: mingw
          windows-arch: arm64
          install-lldb-python: "true"
      - uses: ./.github/actions/setup-go
        with:
          go-version: "1.27.0"
          architecture: arm64
      - name: Build LLGo test tools
        shell: bash
        run: |
          set -euo pipefail
          dev/build_ci_tools.sh "$RUNNER_TEMP/llgo-bin"
          echo "$RUNNER_TEMP/llgo-bin" >> "$GITHUB_PATH"
          echo "LLGO_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - uses: ./.github/actions/activate-windows-target
        with:
          windows-abi: mingw
          windows-arch: arm64
      - name: Build one LLGo reflect stress binary
        shell: bash
        env:
          LLGO: ${{ runner.temp }}/llgo-bin/llgo.exe
          LLGO_BUILD_CACHE: "1"
          LLGO_STDIO_NOBUF: "1"
        run: |
          set -euo pipefail
          modfile="$RUNNER_TEMP/test.mod"
          cp .github/test-go.mod "$modfile"
          cp .github/test-go.sum "$RUNNER_TEMP/test.sum"
          go mod edit -modfile="$modfile" -go=1.27 \
            -replace="github.com/xgo-dev/llgo/runtime=$GITHUB_WORKSPACE/runtime"
          "$LLGO" test -c -ldflags=-w=false -modfile="$modfile" \
            -o="$RUNNER_TEMP/go-reflect-stress.exe" ./test/go
      - name: Classify and capture the LLGo crash
        timeout-minutes: 20
        shell: bash
        env:
          PYTHONHOME: ${{ env.LLGO_WINDOWS_LLDB_PYTHON_HOME }}
          PYTHONPATH: ${{ env.LLGO_WINDOWS_LLDB_PYTHONPATH }}
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
        run: |
          set -euo pipefail
          PATH="$(cygpath -u "$PYTHONHOME"):$PATH"
          export PATH
          binary="$RUNNER_TEMP/go-reflect-stress.exe"

          run_lldb() {
            local label=$1
            local pattern=$2
            local count=$3
            local log="$RUNNER_TEMP/${label// /-}.log"
            echo "::group::$label"
            set +e
            "$LLGO_LLDB" --batch -o run -k "thread backtrace all" -- \
              "$binary" -test.v "-test.run=$pattern" \
              "-test.count=$count" -test.timeout=3m 2>&1 | tee "$log"
            local status=${PIPESTATUS[0]}
            set -e
            echo "::endgroup::"
            if grep -Eiq 'stop reason.*(Exception|EXCEPTION_ACCESS_VIOLATION|0xc0000005)' "$log"; then
              return 86
            fi
            return "$status"
          }

          run_lldb "ordinary goroutine startup with concurrent GC" \
            '^TestDiagnosticGoroutineStartupGC$' 3
          run_lldb "reflect goroutine startup without explicit GC" \
            '^TestDiagnosticReflectMakeFuncGoroutineNoExplicitGC$' 3

          for attempt in $(seq 1 6); do
            echo "::group::reflect plus GC, fresh process $attempt"
            "$binary" -test.v \
              '-test.run=^TestReflectMakeFuncGoroutineStartup/pointer_argument$' \
              -test.count=1 -test.timeout=3m \
              >"$RUNNER_TEMP/reflect-load-$attempt.log" 2>&1 &
            load_pid=$!
            debug_log="$RUNNER_TEMP/reflect-debug-$attempt.log"
            set +e
            "$LLGO_LLDB" --batch -o run -k "thread backtrace all" -- \
              "$binary" -test.v \
              '-test.run=^TestReflectMakeFuncGoroutineStartup/pointer_argument$' \
              -test.count=1 -test.timeout=3m 2>&1 | tee "$debug_log"
            debug_status=${PIPESTATUS[0]}
            wait "$load_pid"
            load_status=$?
            set -e
            if grep -Eiq 'stop reason.*(Exception|EXCEPTION_ACCESS_VIOLATION|0xc0000005)' "$debug_log"; then
              debug_status=86
            fi
            cat "$RUNNER_TEMP/reflect-load-$attempt.log"
            echo "debug status=$debug_status; load status=$load_status"
            echo "::endgroup::"
            if (( debug_status != 0 || load_status != 0 )); then
              exit 1
            fi
          done
      - name: Stress the official Go control
        if: always()
        shell: bash
        run: go test ./test/go -run '^TestReflectMakeFuncGoroutineStartup$' -count=100
