name: Runtime flake diagnosis
on:
  push:
    branches: [codex/diagnose-runtime-flakes-20261011]
permissions:
  contents: read
jobs:
  msvc386:
    runs-on: windows-2022
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: original-fault
            ref: 58a9d864bcaeccbe9472a8b3986bdc18cd630837
            rounds: 10
          - name: current-fix
            ref: 209c2f255de48e389704edc30a66d868ddc3fed1
            rounds: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.ref }}
          path: source
      - uses: ./source/.github/actions/setup-deps
        with:
          llvm-version: 22
          windows-abi: msvc
          windows-arch: '386'
      - uses: ./source/.github/actions/setup-go
      - name: Build compiler
        shell: bash
        working-directory: source
        run: |
          dev/build_ci_tools.sh "$RUNNER_TEMP/llgo-bin"
          echo "$RUNNER_TEMP/llgo-bin" >> "$GITHUB_PATH"
      - uses: ./source/.github/actions/setup-go
        with:
          go-version: '1.26.7'
          cache: false
      - uses: ./source/.github/actions/activate-windows-target
        with:
          windows-abi: msvc
          windows-arch: '386'
      - name: Build original GC stress with debug information
        shell: bash
        run: |
          export LLGO_ROOT="$PWD/source"
          echo "LLGO_ROOT=$LLGO_ROOT" >> "$GITHUB_ENV"
          source source/test/debug/runtime/common.sh
          echo "LLDB_PATH=$LLDB_PATH" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/gc-probe"
          cp "$(go env GOROOT)/test/fixedbugs/issue25897a.go" "$RUNNER_TEMP/gc-probe/main.go"
          cd "$RUNNER_TEMP/gc-probe"
          echo 'module gcprobe' > go.mod
          echo 'go 1.26' >> go.mod
          llgo build -debug-artifact=embedded -o gc.exe .
          echo "GC_PROBE_DIR=$(cygpath -w "$PWD")" >> "$GITHUB_ENV"
          echo "GC_PROBE_ROUNDS=${{ matrix.rounds }}" >> "$GITHUB_ENV"
      - name: Reproduce original case
        shell: bash
        run: python .github/scripts/diagnose_gc_fault.py --direct
      - name: Capture exception site and all threads
        if: ${{ !cancelled() && env.GC_PROBE_DIR != '' }}
        shell: bash
        run: |
          export GC_PROBE_SCRIPT=$(cygpath -w "$PWD/.github/scripts/diagnose_gc_fault.py")
          llgo lldb -lldb "$LLDB_PATH" -- --batch \
            -o 'script import os, runpy; _ = runpy.run_path(os.environ["GC_PROBE_SCRIPT"])' \
            > "$RUNNER_TEMP/gc-probe/backtrace.log" 2>&1
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ['GC_PROBE_DIR']) / 'debug-results.json'
          results = json.loads(p.read_text())
          print(json.dumps(results, indent=2))
          if any(r['result'] != 0 for r in results):
              raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gc-fault-${{ matrix.name }}
          path: ${{ runner.temp }}/gc-probe
          if-no-files-found: error
