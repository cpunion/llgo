name: Runtime flake diagnosis
on:
  push:
    branches: [codex/diagnose-runtime-flakes-20261011]
permissions:
  contents: read
jobs:
  msvc386-bdwgc:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-deps
        with:
          llvm-version: 22
          windows-abi: msvc
          windows-arch: '386'
      - uses: ./.github/actions/activate-windows-target
        with:
          windows-abi: msvc
          windows-arch: '386'
      - name: Build standalone C collector contention probe
        shell: bash
        run: |
          mkdir -p probes/c-fairness
          clang --target=i686-pc-windows-msvc -fms-runtime-lib=dll -fuse-ld=lld -O2 .github/scripts/gc-fairness-c/fairness.c \
            -o probes/c-fairness/fairness.exe $(pkg-config --libs bdw-gc) -lkernel32 -llegacy_stdio_definitions
      - name: Compare allocation progress with and without repeated collection
        shell: bash
        run: python .github/scripts/gc-fairness-c/run.py probes/c-fairness/fairness.exe --output probes/c-fairness --rounds 3 --timeout 90
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: c-bdwgc-fairness
          path: probes/c-fairness
          if-no-files-found: error
