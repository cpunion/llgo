name: Runtime flake diagnosis
on:
  push:
    branches: [codex/diagnose-runtime-flakes-20261011]
permissions:
  contents: read
jobs:
  msvc386-paired:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-deps
        with:
          llvm-version: 22
          windows-abi: msvc
          windows-arch: '386'
      - uses: ./.github/actions/activate-windows-target
        with:
          windows-abi: msvc
          windows-arch: '386'
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: 38114231804
          name: gc-fault-current-fix
          path: probes/current
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: 38115474206
          name: gc-fault-current-fix
          path: probes/fault-probe
      - name: Sample identical binaries on the same host without a debugger
        shell: bash
        run: python .github/scripts/diagnose_gc_paired.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gc-paired-samples
          path: probes/*.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gc-paired-output
          path: probes/*.log
          if-no-files-found: error
