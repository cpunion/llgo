name: Runtime flake diagnosis
on:
  push:
    branches: [codex/diagnose-runtime-flakes-20261011]
permissions:
  contents: read
  actions: read
jobs:
  msvc386-gc-handoff-stress:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-deps
        with:
          llvm-version: 22
          windows-abi: msvc
          windows-arch: '386'
      - uses: actions/download-artifact@v8
        with:
          name: gc-handoff-comparison
          run-id: 38123024848
          github-token: ${{ github.token }}
          path: probes
      - name: Run published handoff binary 100 times with unchanged 90 second limit
        shell: bash
        run: python .github/scripts/diagnose_gc_handoff_stress.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gc-handoff-stress
          path: probes
          if-no-files-found: error
