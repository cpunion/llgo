name: Windows runtime ownership audit qualification
on:
  push:
    branches: [codex/verify-runtimeaudit-windows-20261021]
permissions:
  contents: read
jobs:
  audit:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 4b09e4c45cad0c3d16ba1ffeb8b4347dcf24d260
      - uses: ./.github/actions/setup-deps
        with:
          llvm-version: 22
          windows-abi: mingw
      - uses: ./.github/actions/setup-go
      - name: Verify ownership, source selection and CLI diagnostics
        shell: bash
        env:
          LLGO_ROOT: ${{ github.workspace }}
        run: |
          go test -v -count=1 -timeout=10m \
            '-ldflags=-linkmode=external -extldflags=-lsynchronization' \
            -run '^(TestRuntimeAudit|TestRuntimeOwnership|TestAuditCommand)' \
            ./internal/build ./dev/runtimeaudit
