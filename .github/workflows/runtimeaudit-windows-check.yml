name: Windows runtime ownership audit qualification
on:
  push:
    branches: [codex/verify-runtimeaudit-windows-20261021]
permissions:
  contents: read
jobs:
  audit:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 03129d21a8a4ae2f9a2b3baa86d7ffa688fd7e08
      - uses: ./.github/actions/setup-deps
        with:
          llvm-version: 22
          windows-abi: mingw
      - uses: ./.github/actions/setup-go
      - name: Verify ownership, source selection and CLI diagnostics
        shell: bash
        env:
          LLGO_ROOT: ${{ github.workspace }}
        run: |
          go test -v -count=1 -timeout=10m \
            '-ldflags=-linkmode=external -extldflags=-lsynchronization' \
            -run '^(TestRuntimeAudit|TestRuntimeOwnership|TestAuditCommand|TestBounds|TestStringSlice)' \
            ./ssa ./internal/build ./dev/runtimeaudit
      - name: Verify native slicing, UTF-8 and compatibility hooks
        shell: bash
        env:
          LLGO_ROOT: ${{ github.workspace }}
        run: |
          go build '-ldflags=-linkmode=external -extldflags=-lsynchronization' -o llgo.exe ./cmd/llgo
          ./llgo.exe test -v -count=1 -timeout=5m \
            -run '^(TestStringSliceIndices|TestRuntimeUTF8MatchesUnicode|TestAuxvHook|TestNanotimeHook|TestLegacyFastrand64Hook)$' \
            ./test/std/runtime
