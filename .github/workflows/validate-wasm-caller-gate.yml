name: Validate Wasm caller regression on every test-command path
on:
  push:
    branches: [codex/validate-wasm-caller-gate-20260915]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GOMAXPROCS: '2'
      GOFLAGS: -tags=llvm22
      LLGO_BUILD_CACHE: 'on'
      LLGO_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-deps
        with:
          llvm-version: 22
      - uses: ./.github/actions/setup-go
      - uses: emscripten-core/setup-emsdk@v15
        with:
          version: '4.0.21'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: ./.github/actions/setup-binaryen
      - uses: bytecodealliance/actions/wasmtime/setup@v1
        with:
          version: '39.0.1'
      - uses: bytecodealliance/actions/wasm-tools/setup@v1
        with:
          version: '1.243.0'
      - name: Build clean candidate and original revision
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/caller-validation"
          dev/build_ci_tools.sh "$RUNNER_TEMP/llgo-bin"
          git worktree add --detach "$RUNNER_TEMP/caller-base" fcce9aaf1c2f94ba5d7442a61eba8a0b0e21ce15
          go -C "$RUNNER_TEMP/caller-base" build -o "$RUNNER_TEMP/llgo-base" ./cmd/llgo
      - name: The regression must reject the original wrapper allocations
        run: |
          set -euo pipefail
          cp internal/build/testdata/wasm-test/caller_alloc_test.go "$RUNNER_TEMP/caller-base/internal/build/testdata/wasm-test/"
          status=0
          (
            cd "$RUNNER_TEMP/caller-base"
            LLGO_ROOT="$PWD" GOOS=js GOARCH=wasm "$RUNNER_TEMP/llgo-base" test -v -run '^TestCallerInstrumentationAllocations$' -count=1 -timeout=30s ./internal/build/testdata/wasm-test
          ) > "$RUNNER_TEMP/caller-validation/baseline.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/caller-validation/baseline.log"
          test "$status" -ne 0
          grep -Eq 'caller metadata wrappers allocate .* objects, underlying helpers allocate' "$RUNNER_TEMP/caller-validation/baseline.log"
      - name: Complete all public test-command paths
        env:
          LLGO: ${{ runner.temp }}/llgo-bin/llgo
        run: |
          set -euo pipefail
          dev/test_wasm_single_worker.sh test-command 2>&1 | tee "$RUNNER_TEMP/caller-validation/test-command.log"
          test "$(grep -c '^--- PASS: TestCallerInstrumentationAllocations ' "$RUNNER_TEMP/caller-validation/test-command.log")" -ge 4
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: wasm-caller-regression-gate
          path: ${{ runner.temp }}/caller-validation
          if-no-files-found: error
