name: Debugger host qualification
on:
  push:
    branches: [codex/debug-host-qualification-20261001]
permissions:
  contents: read
jobs:
  darwin-gdb:
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install GDB
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_UPGRADE: '1'
        run: brew list --versions gdb || brew install gdb
      - name: Exercise Darwin GDB pthread control
        run: python3 dev/qualify_darwin_gdb.py
      - name: Upload debugger evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: darwin-gdb-pthread-evidence
          path: |
            debugger-evidence/*.log
            debugger-evidence/probe*
