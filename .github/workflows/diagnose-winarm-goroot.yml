name: Diagnose Windows ARM64 goroot hang

on:
  push:
    branches: [codex/diagnose-winarm-goroot-timeout-20260907]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-11-arm
    # The isolated fork cannot read another PR ref's vcpkg cache. Allow one
    # cold dependency build; test processes retain their short external limits.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-deps
        with:
          llvm-version: "22"
          windows-abi: msvc
          windows-arch: arm64
      - name: Save cold-built vcpkg before testing
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.tool_cache }}\llgo-vcpkg\${{ hashFiles('.github/windows/vcpkg/vcpkg.json') }}
          key: llgo-vcpkg-arm64-windows-${{ hashFiles('.github/windows/vcpkg/vcpkg.json') }}
      - name: Save downloaded LLVM before testing
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.tool_cache }}\llgo-llvm-archives\clang+llvm-22.1.8-x86_64-pc-windows-msvc.tar.xz
          key: llgo-llvm-archive-22.1.8-x86_64-pc-windows-msvc-d96c2cc1736f4eb7fa43cb9bbdf56d93551a9ae0a9aadb9c99c3c3b2b712a234
      - name: Save native debugger before testing
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.tool_cache }}\llgo-windows-support\22.1.8\arm64
          key: llgo-windows-support-22.1.8-arm64-msvc-16e5709785fef73c854646241c4a92c5cd574318d1b33c63330dd7721903e55c-76f44ef1ba6eeb5a65904e9500f042f588fade49952778ce48f0374daa934396-c68b26561883d5c7f33307aeb2b9b6c188eb705808b3f780dfce0be49f4e835d-native-lldb-v2
      - uses: ./.github/actions/setup-embed-deps
      - uses: ./.github/actions/setup-demo-deps
        with:
          windows-abi: msvc
          windows-arch: arm64
          install-lldb-python: "true"
      - uses: ./.github/actions/setup-go
        with:
          architecture: x64
      - uses: ./.github/actions/setup-llgo-cache
      - name: Build the same compiler and test tools
        shell: bash
        run: |
          dev/build_ci_tools.sh "$RUNNER_TEMP/llgo-bin"
          echo "$RUNNER_TEMP/llgo-bin" >> "$GITHUB_PATH"
          echo "LLGO_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - uses: ./.github/actions/activate-windows-target
        with:
          windows-abi: msvc
          windows-arch: arm64
      - name: Check Windows native runtime and FFI
        shell: pwsh
        run: |
          .\.github\workflows\test_windows_runtime.ps1 `
            -LLGo (Join-Path $env:RUNNER_TEMP 'llgo-bin\llgo.exe') `
            -Profile msvc -GoArch arm64
      - name: Reproduce the shard and stress its exact goroot binary
        timeout-minutes: 14
        shell: bash
        env:
          LLGO_BUILD_CACHE: "1"
          LLGO_STDIO_NOBUF: "1"
          LLGO_TEST_CHECK_SYMBOLS: "0"
          LLGO_TEST_STD_BUILDMODES: "0"
          SHARD_INDEX: "0"
          SHARD_TOTAL: "2"
        run: |
          export LLGO="$RUNNER_TEMP/llgo-bin/llgo.exe"
          export LLGO_TEST_LLGEN="$RUNNER_TEMP/llgo-bin/llgen.exe"
          export CHECK_STD_SYMBOLS="$RUNNER_TEMP/llgo-bin/check_std_symbols.exe"
          python .github/workflows/diagnose_winarm_goroot.py
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-arm64-goroot-diagnostics
          path: ${{ runner.temp }}/goroot-diagnostics
          if-no-files-found: warn
