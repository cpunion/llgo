name: QA build test shards
on:
  push:
    branches: [codex/qa-build-shards-20261022]
permissions:
  contents: read
jobs:
  executor:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
        with:
          cache: 'false'
      - name: Verify sharding, isolated fixtures, coverage and exit status
        run: python -m unittest discover -s .github/scripts -p test_run_build_tests.py -v
