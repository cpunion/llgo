name: Diagnose the timed-out LLGo shard

on:
  push:
    branches: [codex/diagnose-panic-shard0-20260912]

permissions:
  contents: read

jobs:
  shard0:
    if: github.repository == 'cpunion/llgo'
    name: shard0 (${{ matrix.trial }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - trial: original-1
            trace: '0'
          - trial: original-2
            trace: '0'
          - trial: traced
            trace: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 7aa6c5f92f984f71a7232d7aecf3694a522715c8
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: diagnostic-harness
      - uses: ./.github/actions/setup-deps
        with:
          llvm-version: '22'
      - uses: ./.github/actions/setup-embed-deps
      - uses: ./.github/actions/setup-demo-deps
        with:
          install-lldb-python: 'false'
      - uses: ./.github/actions/setup-go
      - name: Restore caches as in the original CI job
        uses: ./.github/actions/setup-llgo-cache
        with:
          build-cache-mode: restore
          crosscompile-cache-mode: restore
      - name: Build the exact timed-out compiler revision
        run: |
          dev/build_ci_tools.sh "$RUNNER_TEMP/llgo-bin"
          sudo apt-get install -y gdb
      - name: Run the original shard, symbols, and both build modes
        timeout-minutes: 19
        env:
          DIAGNOSTIC_TRACE: ${{ matrix.trace }}
          DIAGNOSTIC_TRIAL: ${{ matrix.trial }}
          LLGO_BUILD_CACHE: '1'
          LLGO_TEST_BENCH_GO126: '1'
          LLGO_TEST_CHECK_SYMBOLS: '1'
          LLGO_TEST_STD_BUILDMODES: '1'
          SHARD_INDEX: '0'
          SHARD_TOTAL: '2'
        run: bash diagnostic-harness/dev/diagnose_panic_shard0.sh
      - name: Preserve logs and build traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: panic-shard0-${{ matrix.trial }}
          path: shard0-diagnostics/
          retention-days: 7
          if-no-files-found: error
