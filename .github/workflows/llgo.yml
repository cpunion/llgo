name: LLGo

on:
  workflow_dispatch:

jobs:
  llgo:
    name: MinGW ARM64 subprocess diagnosis
    runs-on: windows-11-arm
    timeout-minutes: 45
    strategy:
      matrix:
        include:
          - os: windows-11-arm
            llvm: 22
            windows_abi: mingw
            windows_arch: arm64
            host_go_arch: arm64
            shard_total: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        uses: ./.github/actions/setup-deps
        with:
          llvm-version: ${{matrix.llvm}}
          windows-abi: ${{ matrix.windows_abi || 'msvc' }}
          windows-arch: ${{ matrix.windows_arch || 'amd64' }}
      - name: Install embedded dependencies
        uses: ./.github/actions/setup-embed-deps
      - name: Setup demo dependencies
        uses: ./.github/actions/setup-demo-deps
        with:
          windows-abi: ${{ matrix.windows_abi || 'msvc' }}
          windows-arch: ${{ matrix.windows_arch || 'amd64' }}
          # Only this compiler lane executes the LLDB integration suite. Test
          # lanes still install the Python 3.12 demo ABI but skip the unrelated
          # target-native debugger runtime.
          install-lldb-python: "true"

      - name: Set up Go for build
        uses: ./.github/actions/setup-go
        with:
          architecture: ${{ matrix.host_go_arch || '' }}

      - name: Restore LLGo cache
        uses: ./.github/actions/setup-llgo-cache

      - name: Build LLGo and test tools
        shell: bash
        run: |
          dev/build_ci_tools.sh "$RUNNER_TEMP/llgo-bin"
          echo "$RUNNER_TEMP/llgo-bin" >> "$GITHUB_PATH"
          echo "LLGO_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      - name: Activate native Windows target
        if: runner.os == 'Windows'
        uses: ./.github/actions/activate-windows-target
        with:
          windows-abi: ${{ matrix.windows_abi }}
          windows-arch: ${{ matrix.windows_arch }}

      - name: Check Windows native runtime and FFI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $llgo = Join-Path $env:RUNNER_TEMP 'llgo-bin\llgo.exe'
          .\.github\workflows\test_windows_runtime.ps1 `
            -LLGo $llgo `
            -Profile "${{ matrix.windows_abi }}" `
            -GoArch "${{ matrix.windows_arch || 'amd64' }}"

      - name: Run Go 1.27 LLGo tests
        id: full
        timeout-minutes: 20
        continue-on-error: true
        env:
          LLGO_BUILD_CACHE: "1"
          LLGO_TEST_BENCH_GO126: "1"
          LLGO_TEST_CHECK_SYMBOLS: "0"
          LLGO_TEST_STD_BUILDMODES: "0"
          SHARD_INDEX: "0"
          SHARD_TOTAL: ${{ matrix.shard_total }}
        shell: bash
        run: |
          set -euo pipefail

          tool_suffix=
          if [[ "$RUNNER_OS" == Windows ]]; then
            tool_suffix=.exe
            export LLGO_STDIO_NOBUF=1
          fi
          export LLGO="$RUNNER_TEMP/llgo-bin/llgo${tool_suffix}"
          export LLGO_TEST_LLGEN="$RUNNER_TEMP/llgo-bin/llgen${tool_suffix}"
          export CHECK_STD_SYMBOLS="$RUNNER_TEMP/llgo-bin/check_std_symbols${tool_suffix}"
          dev/test_go_version.sh 1.27

          if [[ "$RUNNER_OS" == Windows ]]; then
            # The TLS regression lives in the runtime submodule, outside test/.
            (cd runtime && "$LLGO" test -v -run '^TestSlotGCAllocation$' -count=20 -timeout=2m ./internal/clite/tls)
          fi

      - name: Record memory and toolchain after full suite
        if: always()
        shell: pwsh
        run: |
          Get-CimInstance Win32_OperatingSystem | Select-Object TotalVisibleMemorySize,FreePhysicalMemory,TotalVirtualMemorySize,FreeVirtualMemory
          Get-Process | Sort-Object WorkingSet64 -Descending | Select-Object -First 20 Name,Id,WorkingSet64,PrivateMemorySize64,HandleCount,@{n='Threads';e={$_.Threads.Count}}
          go version
          go env GOOS GOARCH GOROOT CC CGO_ENABLED
          go list -export runtime/cgo
          Write-Host "Native go list runtime/cgo exit code: $LASTEXITCODE"

      - name: Isolated LLGo tool-compile repetition
        if: always()
        id: isolated
        timeout-minutes: 5
        continue-on-error: true
        shell: pwsh
        run: |
          $env:LLGO = Join-Path $env:RUNNER_TEMP 'llgo-bin\llgo.exe'
          $env:LLGO_STDIO_NOBUF = '1'
          & $env:LLGO test -v -run '^TestToolCompile' -count=10 -timeout=2m ./test/cmd/llgo
          exit $LASTEXITCODE

      - name: Native Go tool-compile control
        if: always()
        id: control
        timeout-minutes: 5
        continue-on-error: true
        shell: pwsh
        run: |
          go test -v -run '^TestToolCompile' -count=2 -timeout=2m ./test/cmd/llgo
          exit $LASTEXITCODE

      - name: Preserve failure result
        if: always()
        env:
          FULL: ${{ steps.full.outcome }}
          ISOLATED: ${{ steps.isolated.outcome }}
          CONTROL: ${{ steps.control.outcome }}
        shell: pwsh
        run: |
          Write-Host "Full suite=$env:FULL; isolated LLGo=$env:ISOLATED; native Go=$env:CONTROL"
          if ($env:FULL -ne 'success' -or $env:ISOLATED -ne 'success' -or $env:CONTROL -ne 'success') {
            throw 'Diagnostic checks failed; see the original errors above.'
          }
