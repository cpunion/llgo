name: Diagnose native source-debug offline
on:
  push:
    branches: [codex/debug-native-offline-2849-20261018]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        compiler: [baseline, candidate]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Select baseline compiler
        if: matrix.compiler == 'baseline'
        run: git restore --source=c41bc55d918b2d728201ea45b4ba8000611a7ab8 -- cl/instr.go
      - uses: ./.github/actions/setup-deps
        with:
          llvm-version: 22
      - name: Install matching LLDB
        run: sudo apt-get install -y lldb-22 python3-lldb-22
      - uses: ./.github/actions/setup-go
      - name: Build compiler
        run: |
          go build -o "$RUNNER_TEMP/llgo-bin/llgo" ./cmd/llgo
          echo "$RUNNER_TEMP/llgo-bin" >> "$GITHUB_PATH"
          echo "LLGO_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - name: Native acceptance with progress
        env:
          LLGO_LLDB: /usr/lib/llvm-22/bin/lldb
          PYTHONUNBUFFERED: 1
        run: |
          set -o pipefail
          timeout --signal=INT --kill-after=30s 8m bash test/debug/native/runtest.sh 2>&1 | tee "$RUNNER_TEMP/native-acceptance.log"
      - name: Preserve diagnostic output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-source-debug-${{ matrix.compiler }}
          path: ${{ runner.temp }}/native-acceptance.log
