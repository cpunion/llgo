name: Windows release native diagnostic

on:
  push:
    branches: [codex/pr2694-bdwgc-native-debug-20261101]

permissions:
  contents: read

jobs:
  win32:
    if: github.repository == 'cpunion/llgo'
    name: Release metadata (${{ matrix.profile }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: mingw-386
            runner: windows-2022
            go-host: x32
            arch: '386'
          - profile: msvc-amd64
            runner: windows-2022
            go-host: x64
            arch: amd64
          - profile: msvc-arm64
            runner: windows-11-arm
            go-host: arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          architecture: ${{ matrix.go-host }}
          cache: false
      - name: Install the pinned LLVM 22 toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'llvm-mingw.zip'
          curl.exe --fail --location --retry 3 --output $archive 'https://github.com/mstorsjo/llvm-mingw/releases/download/20260616/llvm-mingw-20260616-ucrt-x86_64.zip'
          if ($LASTEXITCODE -ne 0) { throw 'llvm-mingw download failed' }
          $expected = 'b9b68a4d276e16fa25802aaba458e4638f64b3884c290aaccdc2d87083b6ca35'
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLower() -ne $expected) {
            throw 'llvm-mingw checksum mismatch'
          }
          $target = Join-Path $env:RUNNER_TEMP 'llvm-mingw'
          Expand-Archive $archive $target
          $root = Get-ChildItem $target -Directory | Select-Object -First 1
          "RELEASE_LLVM_MINGW=$($root.FullName)" >> $env:GITHUB_ENV
          "$($root.FullName)\bin" >> $env:GITHUB_PATH
      - name: Exercise the actual release cgo linker and debug contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $report = Join-Path (Get-Location).Path '_out/release-native-diagnostic'
          New-Item $report -ItemType Directory | Out-Null
          if ('${{ matrix.profile }}'.StartsWith('msvc')) {
            . .github/windows/msvc-target.ps1
            $target = Enter-LLGoVisualStudio -GoArch '${{ matrix.arch }}'
            $compiler = Join-Path $env:RELEASE_LLVM_MINGW 'bin/clang.exe'
            $env:CC = '"' + $compiler.Replace('\', '/') + '" --target=' + $target.Triple + ' -fuse-ld=lld -fms-runtime-lib=static'
            $env:CXX = $env:CC + ' -std=c++17'
          } else {
            $compiler = Join-Path $env:RELEASE_LLVM_MINGW 'bin/i686-w64-mingw32-clang.exe'
            $env:CC = '"' + $compiler.Replace('\', '/') + '"'
            $env:CXX = '"' + (Join-Path $env:RELEASE_LLVM_MINGW 'bin/i686-w64-mingw32-clang++.exe').Replace('\', '/') + '"'
          }
          $env:PATH = (Join-Path $env:RELEASE_LLVM_MINGW 'bin') + ';' + $env:PATH
          $env:GOFLAGS = ''
          $env:GOTOOLCHAIN = 'local'
          @{
            head = (& git rev-parse HEAD).Trim()
            go = (& go version)
            profile = '${{ matrix.profile }}'
            clang = (& $compiler --version)
            cc = $env:CC
            library_sha256 = (Get-FileHash .github/windows/release-lib.ps1 -Algorithm SHA256).Hash
            test_sha256 = (Get-FileHash .github/windows/release-build_test.ps1 -Algorithm SHA256).Hash
          } | ConvertTo-Json -Depth 4 | Set-Content "$report/inputs.json"
          & .github/windows/release-build_test.ps1 *>&1 | Tee-Object "$report/native.log"
      - name: Retain actual native reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-release-native-${{ matrix.profile }}
          path: _out/release-native-diagnostic
          if-no-files-found: error
          retention-days: 7

