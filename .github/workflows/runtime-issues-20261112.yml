name: Native nil-panic instruction attribution
on:
  push:
    branches: [audit/lto-inline-performance-20261114]
permissions:
  contents: read
  actions: read
jobs:
  native-diagnostic:
    if: github.repository == 'cpunion/llgo'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: cpunion/wasmvm
          ref: cf72501dc15335e75fe6da85b6f490db7f223ff2
          path: fixture-source
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: lto-nil-cohort-2
          run-id: 43590417831
          github-token: ${{ github.token }}
          path: nil-callgrind-input
      - name: Install the profiler and runtime libraries
        run: |
          python3 .github/actions/setup-deps/ubuntu_apt_test.py
          sudo python3 .github/actions/setup-deps/ubuntu_apt.py /etc/apt "$(dpkg --print-architecture)"
          sudo timeout --kill-after=30s 5m apt-get update
          sudo timeout --kill-after=30s 5m apt-get install -y valgrind libgc1 libffi8 binutils
      - name: Profile the exact previously measured binaries
        run: python3 -u .github/scripts/verify_nil_callgrind.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nil-panic-instruction-attribution
          path: nil-callgrind-results/
          if-no-files-found: error
