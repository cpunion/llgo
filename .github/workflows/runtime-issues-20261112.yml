name: Windows SDK identity diagnostic
on:
  push:
    branches: [diagnose/runtime-issues-20261112]
permissions:
  contents: read
jobs:
  windows-path:
    if: github.repository == 'cpunion/llgo'
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
      - shell: bash
        run: go run .github/issue-repro/sdkpath.go
