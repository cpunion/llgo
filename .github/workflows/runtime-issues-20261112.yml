name: Native LTO nil-check and layout comparison
on:
  push:
    branches: [audit/lto-inline-performance-20261114]
permissions:
  contents: read
jobs:
  native-diagnostic:
    if: github.repository == 'cpunion/llgo'
    strategy:
      fail-fast: false
      matrix:
        cohort: [1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Verify the compiler source baseline
        run: |
          git fetch --no-tags --depth=1 origin ac1292206d672c2aeb546780a1d585ad98edbc3d
          git diff --exit-code ac1292206d672c2aeb546780a1d585ad98edbc3d HEAD -- cl ssa internal cmd runtime
      - uses: ./.github/actions/setup-deps
        with:
          llvm-version: 22
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.3'
          cache: false
      - uses: ./.github/actions/setup-llgo-cache
        with:
          build-cache-mode: off
      - name: Build the baseline and candidate compilers
        shell: bash
        run: |
          export CGO_CPPFLAGS CGO_LDFLAGS
          CGO_CPPFLAGS="$(bash dev/devenv_unix_flags.sh cppflags)"
          export CGO_CXXFLAGS=-std=c++17
          CGO_LDFLAGS="$(bash dev/devenv_unix_flags.sh ldflags)"
          mkdir -p "$RUNNER_TEMP/lto-inline-bin"
          git fetch --no-tags --depth=1 origin 3d4e43b3ee7780ed1989b4a4492a9398773fa80d
          git diff --exit-code ac1292206d672c2aeb546780a1d585ad98edbc3d 3d4e43b3ee7780ed1989b4a4492a9398773fa80d -- runtime cmd cl
          git worktree add --detach "$RUNNER_TEMP/llgo-nil-fix" 3d4e43b3ee7780ed1989b4a4492a9398773fa80d
          go build -o "$RUNNER_TEMP/lto-inline-bin/llgo-main" ./cmd/llgo
          (cd "$RUNNER_TEMP/llgo-nil-fix" && go build -o "$RUNNER_TEMP/lto-inline-bin/llgo-fix" ./cmd/llgo)
          echo "$RUNNER_TEMP/lto-inline-bin" >> "$GITHUB_PATH"
          echo "LLGO_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo "LLGO_BUILD_CACHE=off" >> "$GITHUB_ENV"
      - name: Fixed native comparison with same-binary controls
        run: python3 .github/scripts/verify_lto_inline.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lto-nil-cohort-${{ matrix.cohort }}
          path: |
            lto-inline-results/*.json
            lto-inline-results/*.asm
            lto-inline-results/*build.log
            lto-inline-results/bin/
          if-no-files-found: error
