name: Independent fixed-binary entry64 replication
on:
  push:
    branches: [audit/lto-inline-performance-20261114]
permissions:
  contents: read
  actions: read
jobs:
  native-diagnostic:
    if: github.repository == 'cpunion/llgo'
    strategy:
      fail-fast: false
      matrix:
        cohort: [1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: cpunion/wasmvm
          ref: 26b788258ac6c280639001ecda0af28159cf8068
          path: fixture-source
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: cpunion/wasmvm
          ref: 9fbd8ff1f46e099e58e7d7240c0cd6b95a57ba52
          path: control-source
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: lto-entry64-cohort-1
          run-id: 43605504511
          github-token: ${{ github.token }}
          path: lto-repeat-input
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.27.3'
          cache: false
      - name: Install runtime libraries
        run: |
          python3 .github/actions/setup-deps/ubuntu_apt_test.py
          sudo python3 .github/actions/setup-deps/ubuntu_apt.py /etc/apt "$(dpkg --print-architecture)"
          sudo timeout --kill-after=30s 5m apt-get update
          sudo timeout --kill-after=30s 5m apt-get install -y libgc1 libffi8
      - name: Replay all frozen binaries with independent sample ordering
        run: python3 -u .github/scripts/repeat_lto_binaries.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lto-entry64-replication-${{ matrix.cohort }}
          path: |
            lto-repeat-results/*.json
            lto-repeat-results/*.asm
          if-no-files-found: error
