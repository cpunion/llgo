name: Frozen LTO software CPU-clock attribution
on:
  push:
    branches: [audit/lto-inline-performance-20261114]
permissions:
  contents: read
  actions: read
jobs:
  native-diagnostic:
    if: github.repository == 'cpunion/llgo'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: cpunion/wasmvm
          ref: 26b788258ac6c280639001ecda0af28159cf8068
          path: fixture-source
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: lto-slice-cohort-2
          run-id: 43599604900
          github-token: ${{ github.token }}
          path: lto-clock-input
      - name: Install software sampling tools and runtime libraries
        run: |
          python3 .github/actions/setup-deps/ubuntu_apt_test.py
          sudo python3 .github/actions/setup-deps/ubuntu_apt.py /etc/apt "$(dpkg --print-architecture)"
          sudo timeout --kill-after=30s 5m apt-get update
          sudo timeout --kill-after=30s 5m apt-get install -y linux-tools-generic libgc1 libffi8 binutils
          sudo sysctl -w kernel.perf_event_paranoid=-1
      - name: Sample the exact previously measured binaries
        run: python3 -u .github/scripts/verify_lto_cpu_clock.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lto-software-clock-attribution
          path: lto-clock-results/
          if-no-files-found: error
