name: Independent GC validation

on:
  pull_request:
    paths:
      - '.github/workflows/gc-validation.yml'
      - '.github/actions/setup-embed-deps/**'
      - 'dev/test_gc_*'
      - 'internal/build/*gc*.go'
      - 'internal/build/build.go'
      - 'runtime/internal/runtime/tinygogc/**'
      - 'runtime/internal/runtime/z_gc*.go'
      - 'runtime/internal/gcroot/**'
      - 'runtime/internal/wasmcontext/**'
      - 'runtime/internal/test/gc-*/**'
      - '_demo/embed/testdata/esp32-serial/gc-runtime/**'
      - 'targets/**'
  workflow_call:
    inputs:
      scope:
        type: string
        default: all
  workflow_dispatch:
    inputs:
      scope:
        description: Independent collector verification scope
        type: choice
        default: all
        options: [all, core, wasm, embedded, generic-ports]

permissions:
  contents: read

concurrency:
  group: gc-validation-${{ github.event.pull_request.number || github.ref }}-${{ inputs.scope || 'changed' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  core:
    if: github.event_name == 'pull_request' || inputs.scope == 'all' || inputs.scope == 'core'
    name: GC core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2025]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
      - name: Verify embedded execution witness and timeout accounting
        if: matrix.os == 'ubuntu-24.04'
        run: python3 -m unittest discover -s dev -p test_gc_embedded_test.py -v
      - name: Actual collector in fixed and growing arenas
        working-directory: internal/build
        run: |
          set -o pipefail
          go test -v -count=1 -timeout=180s \
            gc_arena_test.go wasm_gc_metadata_test.go \
            wasm_gc_head_cache_test.go wasm_gc_pacing_test.go \
            2>&1 | tee "$RUNNER_TEMP/gc-core.log"
      - name: Runtime helper coverage
        working-directory: runtime
        run: |
          go test -count=1 -coverprofile="$RUNNER_TEMP/gc-helpers.cover" \
            ./internal/runtime/tinygogc ./internal/gcroot ./internal/wasmcontext
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gc-core-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/gc-core.log
            ${{ runner.temp }}/gc-helpers.cover
          if-no-files-found: error

  wasm:
    # Normal PRs reuse the full acceptance workflow's existing five profile
    # jobs for these fixtures and original GOROOT cases. Dispatch this matrix
    # only for isolated collector work, avoiding a duplicate Wasm toolchain.
    if: inputs.scope == 'all' || inputs.scope == 'wasm'
    name: GC Wasm (${{ matrix.profile }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        profile: [WC32, GWASI]
    env:
      GOMAXPROCS: '2'
      BINARYEN_CORES: '2'
      GOFLAGS: -tags=llvm22
      LLGO_ROOT: ${{ github.workspace }}
      LLGO_BUILD_CACHE: 'on'
      LLGO_WASI_THREADS: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-deps
        with:
          llvm-version: 22
      - uses: ./.github/actions/setup-go
      - uses: emscripten-core/setup-emsdk@v15
        if: matrix.profile == 'EC32' || matrix.profile == 'EC64' || matrix.profile == 'GJS'
        with:
          version: '4.0.21'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: ./.github/actions/setup-binaryen
      - uses: bytecodealliance/actions/wasmtime/setup@v1
        with:
          version: '39.0.1'
      - name: Build compiler and GC workload runner
        run: |
          go build -o "$RUNNER_TEMP/llgo" ./cmd/llgo
          go test -c -o "$RUNNER_TEMP/goroot-runner" ./test/goroot
          go test ./internal/build -run '^TestConfigureWasmGC' -count=1
      - name: Reproduce mixed TLS initializer with and without package cache
        env:
          LLGO: ${{ runner.temp }}/llgo
        run: |
          set -o pipefail
          case '${{ matrix.profile }}' in
            WC32) profile_args=(-target wasi -emulator); profile_env=() ;;
            GWASI) profile_args=(); profile_env=(env GOOS=wasip1 GOARCH=wasm CGO_ENABLED=0) ;;
          esac
          failed=0
          for cache in on off on; do
            echo "=== ${{ matrix.profile }} LLGO_BUILD_CACHE=$cache ==="
            "${profile_env[@]}" env LLGO_BUILD_CACHE="$cache" \
              "$LLGO" test "${profile_args[@]}" -v -count=5 -timeout=2m \
              -run '^TestCrossPackageMixedInitializerGroup$' ./test/llgoext \
              2>&1 | tee -a "$RUNNER_TEMP/locality-${{ matrix.profile }}.log"
            status=${PIPESTATUS[0]}
            if (( status != 0 )); then failed=1; fi
          done
          cache_root="${XDG_CACHE_HOME:-$HOME/.cache}/llgo/build"
          find "$cache_root" -type f -path '*localityscope*' -print \
            > "$RUNNER_TEMP/locality-cache-${{ matrix.profile }}.txt" 2>/dev/null || true
          cat "$RUNNER_TEMP/locality-cache-${{ matrix.profile }}.txt"
          exit "$failed"
      - name: Collector integration and unsupported-entry rejection
        if: ${{ false }}
        run: |
          :
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gc-wasm-${{ matrix.profile }}
          path: |
            ${{ runner.temp }}/locality-${{ matrix.profile }}.log
            ${{ runner.temp }}/locality-cache-${{ matrix.profile }}.txt
          if-no-files-found: error

  embedded:
    if: github.event_name == 'pull_request' || inputs.scope == 'all' || inputs.scope == 'embedded'
    name: GC embedded (${{ matrix.target }}, single mutator)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        target: [esp32, esp32c3-basic]
    env:
      GOMAXPROCS: '2'
      GOFLAGS: -tags=llvm22
      LLGO_ROOT: ${{ github.workspace }}
      LLGO_BUILD_CACHE: 'on'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-deps
        with:
          llvm-version: 22
      - uses: ./.github/actions/setup-go
      - uses: ./.github/actions/setup-embed-deps
      - name: Build compiler
        run: go build -o "$RUNNER_TEMP/llgo" ./cmd/llgo
      - name: Execute collector fixture on an embedded ISA
        run: |
          python3 dev/test_gc_embedded.py --llgo "$RUNNER_TEMP/llgo" \
            --target '${{ matrix.target }}' --evidence "$RUNNER_TEMP/gc-embedded"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gc-embedded-${{ matrix.target }}
          path: ${{ runner.temp }}/gc-embedded
          if-no-files-found: error

  generic-ports:
    # These target descriptions do not yet provide a complete LLGo executable
    # port (startup/libc/thread/heap symbols). Keep their diagnostic failures
    # explicit, separate from validation of the supported ESP GC backend.
    if: inputs.scope == 'generic-ports'
    name: GC port diagnostic (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        target: [cortex-m-qemu, riscv-qemu]
    env:
      GOMAXPROCS: '2'
      GOFLAGS: -tags=llvm22
      LLGO_ROOT: ${{ github.workspace }}
      LLGO_BUILD_CACHE: 'on'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-deps
        with:
          llvm-version: 22
      - uses: ./.github/actions/setup-go
      - name: Install emulators
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm qemu-system-misc
      - name: Build compiler
        run: go build -o "$RUNNER_TEMP/llgo" ./cmd/llgo
      - name: Execute collector fixture on an embedded ISA
        run: |
          python3 dev/test_gc_embedded.py --llgo "$RUNNER_TEMP/llgo" \
            --target '${{ matrix.target }}' --evidence "$RUNNER_TEMP/gc-embedded"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: gc-embedded-${{ matrix.target }}
          path: ${{ runner.temp }}/gc-embedded
          if-no-files-found: error
