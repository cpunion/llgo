name: Function-value complete build diagnostic

on:
  push:
    branches: [codex/funcval-final-sdk-ci-20261104]
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_REF: d04b831ce3aa544beaeb4a077c81e08e3b06f5a8
  TRANSLATOR_VERSION: v0.0.0-20261104055044-c395df92b7ac
  GOTOOLCHAIN: local
  GOWORK: "off"
  GOENV: "off"
  GOFLAGS: -mod=readonly
  GOMAXPROCS: "2"
  GOMEMLIMIT: 4GiB
  CGO_ENABLED: "1"
  LLVM_CONFIG: /usr/bin/llvm-config-22
  CC: clang-22
  CXX: clang++-22
  GOSUMDB: sum.golang.org
  GOPRIVATE: ""
  GONOSUMDB: ""
  GONOPROXY: ""
  GOINSECURE: ""

jobs:
  affected-adapter:
    if: ${{ !cancelled() && github.repository == 'cpunion/llgo' }}
    name: Complete owner execution ${{ matrix.package }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: adapter
            package: ./internal/plan9asm
    steps: &complete-package-steps
      - name: Check out diagnostic control
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Preserve the control helper before fixed product checkout
        shell: bash
        run: |
          set -euo pipefail
          cp .github/scripts/run_funcval_diagnostic.py "$RUNNER_TEMP/run_funcval_diagnostic.py"
          sha256sum "$RUNNER_TEMP/run_funcval_diagnostic.py"
      - name: Check out immutable qualified product source
        uses: actions/checkout@v7
        with:
          repository: cpunion/llgo
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false
      - name: Assert immutable product source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_REF"
          test -z "$(git status --porcelain)"
      - name: Install LLVM 22 and native dependencies
        timeout-minutes: 20
        uses: ./.github/actions/setup-deps
        with:
          llvm-version: "22"
      - name: Install existing embedded emulator dependencies
        timeout-minutes: 20
        uses: ./.github/actions/setup-embed-deps
      - name: Keep older Go for toolchain-switch regressions
        uses: ./.github/actions/setup-go
        with:
          go-version: 1.21.13
          cache: "false"
      - name: Select exact current Go from source .go-version
        uses: ./.github/actions/setup-go
      - name: Restore versioned SDKs and compiler caches
        uses: ./.github/actions/setup-llgo-cache
        with:
          build-cache-mode: readwrite
          build-cache-scope: funcval-diagnostic-${{ matrix.id }}
          crosscompile-cache-mode: readwrite
      - name: Install existing optional demo dependencies
        timeout-minutes: 15
        uses: ./.github/actions/setup-demo-deps
      - name: Inventory and run every actual package owner
        timeout-minutes: 75
        shell: bash
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/run_funcval_diagnostic.py" \
            --package '${{ matrix.package }}' \
            --reports "$RUNNER_TEMP/funcval-reports-${{ matrix.id }}"
      - name: Preserve raw results, source identity and explicit skip reasons
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: funcval-${{ env.SOURCE_REF }}-${{ matrix.id }}
          path: ${{ runner.temp }}/funcval-reports-${{ matrix.id }}
          if-no-files-found: error
          retention-days: 7

  complete-package:
    needs: affected-adapter
    if: ${{ !cancelled() && github.repository == 'cpunion/llgo' }}
    name: Complete owner execution ${{ matrix.package }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: build
            package: ./internal/build
          - id: cl
            package: ./cl
    steps: *complete-package-steps
