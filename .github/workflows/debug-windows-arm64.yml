name: Diagnose Windows ARM64 C unwind

on:
  push:
    branches: [codex/debug-windows-arm64-diag-20261001]

permissions:
  contents: read

jobs:
  lldb:
    runs-on: windows-11-arm
    timeout-minutes: 45
    env:
      GOMAXPROCS: "4"
      GOFLAGS: "-p=2"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-deps
        with:
          llvm-version: "22"
          windows-abi: mingw
          windows-arch: arm64
      - uses: ./.github/actions/setup-demo-deps
        with:
          windows-abi: mingw
          windows-arch: arm64
          install-lldb-python: "true"
      - uses: ./.github/actions/activate-windows-target
        with:
          windows-abi: mingw
          windows-arch: arm64
      - name: Build pure C thread control
        shell: bash
        run: |
          set -euo pipefail
          read -r -a cc_command <<< "$CC"
          "${cc_command[@]}" -gdwarf-4 -O0 -fno-omit-frame-pointer -Wall -Wextra -Werror \
            .github/diagnostics/windows-unwind/main.c -o thread-unwind.exe -lkernel32
      - name: LLDB native C diagnostics
        shell: pwsh
        run: |
          $env:PYTHONHOME = $env:LLGO_WINDOWS_LLDB_PYTHON_HOME
          $env:PYTHONPATH = $env:LLGO_WINDOWS_LLDB_PYTHONPATH
          $env:PYTHONUTF8 = "1"
          $env:PYTHONIOENCODING = "utf-8"
          $env:PATH = "$env:LLGO_WINDOWS_LLDB_PYTHON_HOME;$env:PATH"
          & $env:LLGO_LLDB --batch -o "command script import .github/diagnostics/windows-unwind/control.py" -o "script control.run('thread-unwind.exe')"
          if ($LASTEXITCODE -ne 0) {
            throw "LLDB C diagnostics failed with exit code $LASTEXITCODE"
          }
      - name: Save debug executables
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-arm64-c-unwind
          path: |
            thread-unwind.exe
            windows-unwind.json
