name: Diagnose Windows ARM64 debugger

on:
  push:
    branches: [codex/debug-windows-arm64-diag-20261001]

permissions:
  contents: read

jobs:
  lldb:
    runs-on: windows-11-arm
    timeout-minutes: 45
    env:
      GOMAXPROCS: "4"
      GOFLAGS: "-p=2"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-deps
        with:
          llvm-version: "22"
          windows-abi: mingw
          windows-arch: arm64
      - uses: ./.github/actions/setup-demo-deps
        with:
          windows-abi: mingw
          windows-arch: arm64
          install-lldb-python: "true"
      - uses: ./.github/actions/setup-go
        with:
          architecture: arm64
      - uses: ./.github/actions/setup-llgo-cache
      - name: Build LLGo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/llgo-bin"
          go build -o "$RUNNER_TEMP/llgo-bin/llgo.exe" ./cmd/llgo
          echo "$RUNNER_TEMP/llgo-bin" >> "$GITHUB_PATH"
          echo "LLGO_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - uses: ./.github/actions/activate-windows-target
        with:
          windows-abi: mingw
          windows-arch: arm64
      - name: LLDB native runtime diagnostics
        shell: pwsh
        run: |
          $env:PYTHONHOME = $env:LLGO_WINDOWS_LLDB_PYTHON_HOME
          $env:PYTHONPATH = $env:LLGO_WINDOWS_LLDB_PYTHONPATH
          $env:PYTHONUTF8 = "1"
          $env:PYTHONIOENCODING = "utf-8"
          $env:PATH = "$env:LLGO_WINDOWS_LLDB_PYTHON_HOME;$env:PATH"
          bash cmd/llgo/lldbtest/runtest.sh -v
          if ($LASTEXITCODE -ne 0) {
            throw "LLDB integration tests failed with exit code $LASTEXITCODE"
          }
      - name: Save debug executables
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-arm64-debug-executables
          path: cmd/llgo/lldbtest/debug*.out
