name: WebAssembly full acceptance

on:
  pull_request:
    paths:
      - 'dev/wasmstdlib/**'
      - 'dev/wasmbrowser/**'
      - 'dev/test_wasm_browser.sh'
      - 'dev/test_wasm_exit_status.sh'
      - 'dev/test_wasi_poll.sh'
      - 'dev/test_gc_wasm.sh'
      - 'dev/test_wasm_caller_alloc.sh'
      - 'dev/wasm_caller_alloc_test.py'
      - 'dev/wasm_test_env*'
      - '.github/workflows/wasm-acceptance.yml'
      - 'test/**'
      - 'runtime/**'
      - 'cl/**'
      - 'ssa/**'
      - 'internal/abi/**'
      - 'internal/build/**'
      - 'targets/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wasm-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  goroot-smoke:
    name: wasm GOROOT sentinels (${{ matrix.profile }})
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        profile: [EC32, EC64, WC32, GJS, GWASI]
    env:
      GOMAXPROCS: '2'
      GOFLAGS: -tags=llvm22
      LLGO_BUILD_CACHE: 'on'
      # The temporary llgo binary is outside an installed bin/ tree. Raw
      # profile comparisons must load this checkout's source patches too.
      LLGO_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-deps
        with:
          llvm-version: 22
      - uses: emscripten-core/setup-emsdk@v15
        if: ${{ matrix.profile == 'EC32' || matrix.profile == 'EC64' || matrix.profile == 'GJS' }}
        with:
          version: '4.0.21'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: ./.github/actions/setup-binaryen
      - uses: bytecodealliance/actions/wasmtime/setup@v1
        with:
          version: '39.0.1'
      - uses: ./.github/actions/setup-go
      - name: Build LLGo and host-side GOROOT runner
        run: |
          go build -o "$RUNNER_TEMP/llgo" ./cmd/llgo
          go test -c -o "$RUNNER_TEMP/goroot-runner" ./test/goroot
      - name: Verify single-mutator GC integration and reject unsafe entry
        env:
          LLGO: ${{ runner.temp }}/llgo
        run: |
          set -o pipefail
          bash dev/test_gc_wasm.sh '${{ matrix.profile }}' "$RUNNER_TEMP/gc-wasm" \
            2>&1 | tee "$RUNNER_TEMP/gc-integration.log"
      - name: Preserve GC execution evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wasm-gc-integration-${{ matrix.profile }}
          path: |
            ${{ runner.temp }}/gc-wasm
            ${{ runner.temp }}/gc-integration.log
          if-no-files-found: error
      - name: Exercise representative runnable cases
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -o pipefail
          target_goroot="$(go env GOROOT)"
          cases='^(helloworld\.go|bom\.go)$'
          if [[ "$PROFILE" == GWASI ]]; then
            # Original generated programs catch excessive pre-Asyncify
            # inlining, duplicated panic locations and scalar aggregate copies.
            # issue5963 also terminates the logical main G through Goexit, so
            # it catches ownership of an advanced Asyncify cursor. Guard them
            # once before starting the full matrix.
            cases='^(helloworld\.go|bom\.go|fixedbugs/(issue5162|issue5963)\.go|cmplxdivide\.go|recover\.go)$'
          elif [[ "$PROFILE" == WC32 ]]; then
            # WC32 shares the Binaryen Asyncify context implementation with
            # GWASI and therefore needs the same cursor-ownership regression.
            cases='^(helloworld\.go|bom\.go|fixedbugs/issue5963\.go)$'
          fi
          (
            cd test/goroot
            "$RUNNER_TEMP/goroot-runner" -test.v -test.run '^TestGoRootRunCases$' \
              -test.count=1 -test.timeout=40m \
              -goroot "$target_goroot" -llgo "$RUNNER_TEMP/llgo" \
              -wasm-profile "$PROFILE" -directive-mode ci \
              -report "$RUNNER_TEMP/goroot-smoke-$PROFILE.json" \
              -case "$cases" \
              -max-rss-mib 4096 -rss-warn-mib 1024 \
              -min-memory-free-percent 15 -min-swap-free-mib 512
          ) 2>&1 | tee "$RUNNER_TEMP/goroot-$PROFILE.log"
      - name: Preserve sentinel log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wasm-goroot-sentinel-${{ matrix.profile }}
          path: |
            ${{ runner.temp }}/goroot-${{ matrix.profile }}.log
            ${{ runner.temp }}/goroot-smoke-${{ matrix.profile }}.json
          if-no-files-found: error

      - name: Check caller stack allocation in an isolated process
        env:
          LLGO: ${{ runner.temp }}/llgo
        run: bash dev/test_wasm_caller_alloc.sh '${{ matrix.profile }}'

      - name: Check Wasm harness failure and environment isolation
        if: matrix.profile == 'GJS'
        run: python3 -m unittest discover -s dev -p 'wasm_*_test.py'

      - name: Check typed reflection before full acceptance
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          set -o pipefail
          args=()
          case "$PROFILE" in
            EC32) args=(-target emscripten) ;;
            EC64) args=(-target emscripten-memory64) ;;
            WC32) args=(-target wasi) ;;
            GJS) export GOOS=js GOARCH=wasm CGO_ENABLED=0 ;;
            GWASI) export GOOS=wasip1 GOARCH=wasm CGO_ENABLED=0 ;;
            *) echo "unknown wasm reflection profile: $PROFILE" >&2; exit 1 ;;
          esac
          "$RUNNER_TEMP/llgo" test "${args[@]}" -emulator -v -timeout=2m \
            -run '^(TestReflect.*Bridge|TestMakeFunc|TestValueMethodAndCall|TestValueCallSlice)$' \
            ./test/std/reflect 2>&1 | tee "$RUNNER_TEMP/reflect-$PROFILE.log"

      - name: Preserve reflection log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wasm-reflect-${{ matrix.profile }}
          path: ${{ runner.temp }}/reflect-${{ matrix.profile }}.log
          if-no-files-found: error

      - name: Compare GJS host behavior with the official Go helper
        if: ${{ matrix.profile == 'GJS' }}
        env:
          GOOS: js
          GOARCH: wasm
          GOMAXPROCS: '1'
        run: |
          set -o pipefail
          timeout 10m bash dev/wasm_test_env.sh go test -exec="$(go env GOROOT)/lib/wasm/go_js_wasm_exec" \
            -v -count=1 -timeout=60s ./internal/build/testdata/wasm-test \
            2>&1 | tee "$RUNNER_TEMP/gjs-go.log"
          timeout 10m bash dev/wasm_test_env.sh "$RUNNER_TEMP/llgo" test -v -count=1 -timeout=60s \
            ./internal/build/testdata/wasm-test 2>&1 | tee "$RUNNER_TEMP/gjs-llgo.log"
          for compiler in go llgo; do
            log="$RUNNER_TEMP/gjs-$compiler.log"
            test "$(grep -c '^PASS$' "$log")" = 1
            if grep -Eq '^(panic:|fatal error:|--- FAIL:|FAIL([[:space:]]|$))' "$log"; then
              exit 1
            fi
          done

      - name: Verify Fiber storage and GC range helpers
        if: ${{ matrix.profile == 'GJS' }}
        working-directory: runtime
        # This nested module is outside the host workflow's root ./... tests.
        # Run the pure helpers once, not once per Wasm profile or GOROOT shard.
        run: |
          go test -count=1 -coverprofile="$RUNNER_TEMP/gjs-storage.cover" \
            ./internal/wasmcontext ./internal/gcroot ./internal/runtime/tinygogc

      - uses: bytecodealliance/actions/wasm-tools/setup@v1
        if: ${{ matrix.profile == 'WC32' }}
        with:
          version: '1.243.0'
      - name: Verify GC environment and automatic collection
        id: gc-pacing
        if: ${{ matrix.profile == 'WC32' || matrix.profile == 'GJS' }}
        env:
          PROFILE: ${{ matrix.profile }}
          LLGO: ${{ runner.temp }}/llgo
        run: |
          set -o pipefail
          suite=gc-env
          if [[ "$PROFILE" == WC32 ]]; then suite=gc-pacing; fi
          bash dev/test_wasm_single_worker.sh "$suite" \
            2>&1 | tee "$RUNNER_TEMP/gc-pacing-$PROFILE.log"
      - name: Preserve GC pacing regression log
        if: ${{ always() && steps.gc-pacing.outcome != 'skipped' && steps.gc-pacing.outcome != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: wasm-gc-pacing-${{ matrix.profile }}
          path: ${{ runner.temp }}/gc-pacing-${{ matrix.profile }}.log
          if-no-files-found: error

      - name: Upload Wasm runtime helper coverage
        if: ${{ matrix.profile == 'GJS' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          # Fork PRs cannot request the base repository's OIDC identity.
          use_oidc: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          fail_ci_if_error: true
          disable_search: true
          files: ${{ runner.temp }}/gjs-storage.cover
          flags: wasm-runtime-helpers

      - name: Reject failed tests with a successful process status
        env:
          PROFILE: ${{ matrix.profile }}
          LLGO: ${{ runner.temp }}/llgo
        run: |
          case "$PROFILE" in
            EC32) args=(-target emscripten -emulator) ;;
            EC64) args=(-target emscripten-memory64 -emulator) ;;
            WC32) args=(-target wasi -emulator) ;;
            GJS) export GOOS=js GOARCH=wasm CGO_ENABLED=0; args=() ;;
            GWASI) export GOOS=wasip1 GOARCH=wasm CGO_ENABLED=0; args=() ;;
            *) exit 2 ;;
          esac
          bash dev/test_wasm_exit_status.sh "$RUNNER_TEMP/exit-$PROFILE.log" "${args[@]}"

      - name: Verify stack capture during first-allocation profiling
        env:
          PROFILE: ${{ matrix.profile }}
        run: |
          case "$PROFILE" in
            EC32) args=(-target emscripten -emulator) ;;
            EC64) args=(-target emscripten-memory64 -emulator) ;;
            WC32) args=(-target wasi -emulator) ;;
            GJS) export GOOS=js GOARCH=wasm CGO_ENABLED=0; args=() ;;
            GWASI) export GOOS=wasip1 GOARCH=wasm CGO_ENABLED=0; args=() ;;
            *) exit 2 ;;
          esac
          # This needs a fresh process: testing.M warms the PC registry and
          # masks recursion while its initial slices are being allocated.
          timeout 5m "$RUNNER_TEMP/llgo" run "${args[@]}" \
            ./internal/build/testdata/wasm-profile-reentry \
            > "$RUNNER_TEMP/profile-reentry-$PROFILE.log" 2>&1 || {
              cat "$RUNNER_TEMP/profile-reentry-$PROFILE.log"; exit 1;
            }
          cat "$RUNNER_TEMP/profile-reentry-$PROFILE.log"

      - name: Preserve process status regression log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wasm-exit-status-${{ matrix.profile }}
          path: |
            ${{ runner.temp }}/exit-${{ matrix.profile }}.log
            ${{ runner.temp }}/profile-reentry-${{ matrix.profile }}.log
          if-no-files-found: warn

      - name: Verify WASI blocked I/O scheduling and cancellation
        if: ${{ matrix.profile == 'WC32' || matrix.profile == 'GWASI' }}
        env:
          PROFILE: ${{ matrix.profile }}
          LLGO: ${{ runner.temp }}/llgo
        run: |
          case "$PROFILE" in
            WC32) args=(-target wasi -emulator) ;;
            GWASI) export GOOS=wasip1 GOARCH=wasm CGO_ENABLED=0; args=() ;;
            *) exit 2 ;;
          esac
          bash dev/test_wasi_poll.sh "$RUNNER_TEMP/poll-$PROFILE.log" "${args[@]}"

      - name: Preserve WASI poll regression log
        if: ${{ always() && (matrix.profile == 'WC32' || matrix.profile == 'GWASI') }}
        uses: actions/upload-artifact@v7
        with:
          name: wasm-poll-${{ matrix.profile }}
          path: ${{ runner.temp }}/poll-${{ matrix.profile }}.log
          if-no-files-found: warn

      - name: Preserve GJS compiler comparison
        if: ${{ always() && matrix.profile == 'GJS' }}
        uses: actions/upload-artifact@v7
        with:
          name: wasm-gjs-compatibility
          path: |
            ${{ runner.temp }}/gjs-*.log
            ${{ runner.temp }}/gjs-storage.cover
          if-no-files-found: warn

  browser:
    name: wasm browser acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GOMAXPROCS: '2'
      GOFLAGS: -tags=llvm22
      LLGO_BUILD_CACHE: 'on'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-deps
        with:
          llvm-version: 22
      - uses: emscripten-core/setup-emsdk@v15
        with:
          version: '4.0.21'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: ./.github/actions/setup-binaryen
      - uses: ./.github/actions/setup-go
      - name: Verify browser host shim
        run: node dev/test_wasm_fs.mjs
      - name: Build LLGo
        run: go build -o "$RUNNER_TEMP/llgo" ./cmd/llgo
      - name: Exercise raw and C-profile modules in a real browser
        env:
          LLGO: ${{ runner.temp }}/llgo
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/wasm-browser"
          dev/test_wasm_browser.sh 2>&1 | tee "$RUNNER_TEMP/wasm-browser/acceptance.log"
      - name: Preserve browser output and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wasm-browser
          path: ${{ runner.temp }}/wasm-browser/
          if-no-files-found: warn

  goroot:
    name: wasm GOROOT (${{ matrix.profile }}, ${{ matrix.shard }}/4)
    needs: goroot-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        profile: [EC32, EC64, WC32, GJS, GWASI]
        shard: [0, 1, 2, 3]
    env:
      GOMAXPROCS: '2'
      GOFLAGS: -tags=llvm22
      LLGO_BUILD_CACHE: 'on'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-deps
        with:
          llvm-version: 22
      - uses: emscripten-core/setup-emsdk@v15
        if: ${{ matrix.profile == 'EC32' || matrix.profile == 'EC64' || matrix.profile == 'GJS' }}
        with:
          version: '4.0.21'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: ./.github/actions/setup-binaryen
      - uses: bytecodealliance/actions/wasmtime/setup@v1
        with:
          version: '39.0.1'
      - uses: ./.github/actions/setup-go
      - name: Build LLGo and host-side GOROOT runner
        run: |
          go build -o "$RUNNER_TEMP/llgo" ./cmd/llgo
          go test -c -o "$RUNNER_TEMP/goroot-runner" ./test/goroot
      - name: Execute GOROOT shard
        env:
          PROFILE: ${{ matrix.profile }}
          SHARD: ${{ matrix.shard }}
        run: |
          set -o pipefail
          target_goroot="$(go env GOROOT)"
          (
            cd test/goroot
            "$RUNNER_TEMP/goroot-runner" -test.v -test.run '^TestGoRootRunCases$' \
              -test.count=1 -test.timeout=175m \
              -goroot "$target_goroot" -llgo "$RUNNER_TEMP/llgo" \
              -wasm-profile "$PROFILE" -directive-mode coverage \
              -directives run,runoutput,buildrun,rundir,runindir,buildrundir,errorcheckandrundir \
              -report "$RUNNER_TEMP/goroot-$PROFILE-$SHARD.json" \
              -progress 60s -shard-index "$SHARD" -shard-total 4 \
              -max-rss-mib 4096 -rss-warn-mib 1024 \
              -min-memory-free-percent 15 -min-swap-free-mib 512
          ) 2>&1 | tee "$RUNNER_TEMP/goroot-$PROFILE-$SHARD.log"
      - name: Preserve complete shard log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wasm-goroot-${{ matrix.profile }}-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/goroot-${{ matrix.profile }}-${{ matrix.shard }}.log
            ${{ runner.temp }}/goroot-${{ matrix.profile }}-${{ matrix.shard }}.json
          if-no-files-found: error

  packages:
    name: wasm test acceptance (${{ matrix.profile }}, ${{ matrix.shard }}/2)
    needs: goroot-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        profile: [EC32, EC64, WC32, GJS, GWASI, GJS-reference, GWASI-reference]
        shard: [0, 1]
    env:
      GOMAXPROCS: '2'
      GOFLAGS: -tags=llvm22
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-deps
        if: ${{ !contains(matrix.profile, 'reference') }}
        with:
          llvm-version: 22
      - uses: emscripten-core/setup-emsdk@v15
        if: ${{ matrix.profile == 'EC32' || matrix.profile == 'EC64' || matrix.profile == 'GJS' }}
        with:
          version: '4.0.21'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: ./.github/actions/setup-binaryen
        if: ${{ !contains(matrix.profile, 'reference') }}
      - uses: bytecodealliance/actions/wasmtime/setup@v1
        with:
          version: '39.0.1'
      - uses: ./.github/actions/setup-go
      - name: Check acceptance accounting
        run: go test ./dev/wasmstdlib -count=1
      - name: Build LLGo
        if: ${{ !contains(matrix.profile, 'reference') }}
        run: go build -o "$RUNNER_TEMP/llgo" ./cmd/llgo
      - name: Execute every discovered test package in this shard
        env:
          PROFILE: ${{ matrix.profile }}
          SHARD: ${{ matrix.shard }}
        run: |
          go run ./dev/wasmstdlib -full -profile "$PROFILE" \
            -shard "$SHARD" -shards 2 -llgo "$RUNNER_TEMP/llgo" \
            -report "$RUNNER_TEMP/acceptance.json"
      - name: Preserve all results and individual package logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wasm-acceptance-${{ matrix.profile }}-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/acceptance.json
            ${{ runner.temp }}/acceptance.json.logs/
          if-no-files-found: error
