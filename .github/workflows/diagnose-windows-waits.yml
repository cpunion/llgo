name: Diagnose Windows waits
on:
  push:
    branches: [codex/2781-windows-wait-diagnose-20261011]
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            abi: mingw
            arch: amd64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-deps
        with:
          llvm-version: 22
          windows-abi: ${{ matrix.abi }}
          windows-arch: ${{ matrix.arch }}
      - uses: ./.github/actions/setup-go
      - name: Build compiler
        shell: bash
        run: |
          dev/build_ci_tools.sh "$RUNNER_TEMP/llgo-bin"
          echo "$RUNNER_TEMP/llgo-bin" >> "$GITHUB_PATH"
          echo "LLGO_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - uses: ./.github/actions/activate-windows-target
        with:
          windows-abi: ${{ matrix.abi }}
          windows-arch: ${{ matrix.arch }}
      - name: Install MinGW LLDB
        if: matrix.abi == 'mingw'
        shell: msys2 {0}
        run: |
          prefix=mingw-w64-clang-x86_64
          repo=https://repo.msys2.org/mingw/clang64
          args=(--noconfirm -U)
          for dep in cc-libs expat bzip2 mpdecimal ncurses openssl sqlite3 tcl tk tzdata; do
            args+=(--assume-installed "$prefix-$dep")
          done
          pacman "${args[@]}" "$repo/$prefix-python-3.14.6-2-any.pkg.tar.zst" "$repo/$prefix-lldb-22.1.8-1-any.pkg.tar.zst"
          echo "LLGO_LLDB=$(cygpath -m /clang64/bin/lldb.exe)" >> "$GITHUB_ENV"
      - name: Collect dependency unwind information
        if: matrix.abi == 'msvc'
        shell: bash
        run: |
          mkdir -p .artifacts/waits
          cp "$LLGO_WINDOWS_VCPKG_ROOT/bin/gc.dll" .artifacts/waits/
          cp "$LLGO_WINDOWS_VCPKG_ROOT/bin/gc.pdb" .artifacts/waits/ || true
          llvm-readobj --unwind .artifacts/waits/gc.dll > .artifacts/waits/gc-unwind.txt
          llvm-objdump -d .artifacts/waits/gc.dll > .artifacts/waits/gc-disassembly.txt
      - name: Compare ARM64 debugger waits
        if: matrix.abi == 'msvc'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('test/debug/runtime/test.py')
          s = p.read_text().replace('for command in ("thread list", "thread backtrace all"):', 'for command in ("thread list", "thread backtrace all", "image lookup -n GC_with_callee_saves_pushed", "disassemble -n GC_with_callee_saves_pushed"):' )
          p.write_text(s)
          PY
          set +e
          bash test/debug/runtime/runtest.sh -v > .artifacts/waits/debug-current.log 2>&1
          echo "CURRENT RESULT=$?"
          python - <<'PY'
          from pathlib import Path
          p = Path('runtime/internal/sync/_wrap/sync_windows.c')
          p.write_text(p.read_text().replace('GC_do_blocking(llgo_cond_wait_inactive, &call);', 'llgo_cond_wait_inactive(&call);'))
          PY
          bash test/debug/runtime/runtest.sh -v > .artifacts/waits/debug-direct.log 2>&1
          echo "DIRECT RESULT=$?"
      - name: Diagnose the exact complete demo harness
        shell: bash
        run: |
          mkdir -p .artifacts/waits
          export WAIT_PROBE_DIR=$(cygpath -m "$PWD/.artifacts/waits")
          echo "WAIT_PROBE_DIR=$WAIT_PROBE_DIR" >> "$GITHUB_ENV"
          python .github/scripts/diagnose_windows_waits.py --demo
      - name: Capture pending commandrun stacks
        shell: msys2 {0}
        run: |
          source test/debug/runtime/common.sh
          export WAIT_PROBE_SCRIPT=$(cygpath -m "$PWD/.github/scripts/diagnose_windows_waits.py")
          llgo lldb -lldb "$LLDB_PATH" -- --batch -o 'script import os, runpy; _ = runpy.run_path(os.environ["WAIT_PROBE_SCRIPT"])' > .artifacts/waits/commandrun-backtrace.log 2>&1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-waits-${{ matrix.abi }}-${{ matrix.arch }}
          path: .artifacts/waits
