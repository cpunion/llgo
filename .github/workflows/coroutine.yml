name: Coroutine

on:
  pull_request:
    branches:
      - main
      - llvm-coro
      - "coro/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.check }}
    runs-on: ubuntu-22.04
    timeout-minutes: ${{ matrix.timeout || 20 }}
    env:
      LLGO_ROOT: ${{ github.workspace }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { llvm: 22, go: "1.27.0", lane: "compat", check: "test (LLVM 22, Go 1.27.0)" }
          - { llvm: 22, go: "1.27.0", lane: "integration", check: "test integration (LLVM 22, Go 1.27.0)" }
          - { llvm: 22, go: "1.27.0", lane: "integration-build", check: "test production build plan (LLVM 22, Go 1.27.0)" }
          - { llvm: 22, go: "1.27.0", lane: "fault-e2e", timeout: 25, check: "test native fault landing E2E (LLVM 22, Go 1.27.0)" }
          - { llvm: 22, go: "1.27.0", lane: "native-e2e", check: "test native linked E2E (LLVM 22, Go 1.27.0)" }
          - { llvm: 22, go: "1.27.0", lane: "archive-e2e", timeout: 30, check: "test independent archive E2E (LLVM 22, Go 1.27.0)" }
          - { llvm: 22, go: "1.27.0", lane: "reflect-e2e", timeout: 30, check: "test reflected resource handoff E2E (LLVM 22, Go 1.27.0)" }
          - { llvm: 22, go: "1.27.0", lane: "fleet-e2e", check: "test native fleet E2E (LLVM 22, Go 1.27.0)" }
          - { llvm: 22, go: "1.27.0", lane: "stdlib-time", fixtures: "time timer sync", check: "test stdlib time, timer and sync (LLVM 22, Go 1.27.0)" }
          - { llvm: 22, go: "1.27.0", lane: "stdlib-file", fixtures: "file syscall-file syscall-pipe", check: "test stdlib file and syscall (LLVM 22, Go 1.27.0)" }
          - { llvm: 22, go: "1.27.0", lane: "stdlib-tcp", fixtures: "tcp", check: "test stdlib TCP (LLVM 22, Go 1.27.0)" }
          - { llvm: 22, go: "1.27.0", lane: "synctest", check: "test synctest and weak object ownership (LLVM 22)" }
          - { llvm: 22, go: "1.27.0", lane: "timer-gc", timeout: 35, check: "test standard timer semantics and GC cancellation (LLVM 22)" }
          - { llvm: 22, go: "1.27.0", lane: "timer-gc-wasi", timeout: 35, check: "test WASI standard timers and TinyGC cancellation (LLVM 22)" }
          - { llvm: 22, go: "1.27.0", lane: "target-core", check: "test target adapters (LLVM 22, Go 1.27.0)" }
          - { llvm: 22, go: "1.27.0", lane: "target-js-wasm", check: "test JS/WASM command reactor (LLVM 22)" }
          - { llvm: 22, go: "1.27.0", lane: "target-wasi-command", check: "test WASI command reactor (LLVM 22)" }
          - { llvm: 22, go: "1.27.0", lane: "target-wasm", wasm_target: "wasip2", check: "test WASM host probes (wasip2, LLVM 22)" }
          - { llvm: 22, go: "1.27.0", lane: "target-wasm", wasm_target: "wasm-unknown", check: "test WASM host probes (wasm-unknown, LLVM 22)" }
    steps:
      - uses: actions/checkout@v7

      - name: Install LLVM
        run: |
          echo 'deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-${{ matrix.llvm }} main' | sudo tee /etc/apt/sources.list.d/llvm.list
          wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          sudo apt-get update
          sudo apt-get install --no-install-recommends llvm-${{ matrix.llvm }}-dev clang-${{ matrix.llvm }} lld-${{ matrix.llvm }} libgc-dev
          echo '/usr/lib/llvm-${{ matrix.llvm }}/bin' >> "$GITHUB_PATH"

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          go-version: ${{ matrix.go }}

      - name: Set up Wasmtime
        if: matrix.lane == 'target-wasi-command' || matrix.lane == 'timer-gc-wasi'
        uses: bytecodealliance/actions/wasmtime/setup@v1
        with:
          version: "39.0.1"

      # This focused LLVM/runtime matrix complements the regular upstream Go,
      # cache, LLGo and target workflows, including their macOS lanes.
      - name: Test coroutine analysis
        if: matrix.lane == 'integration'
        run: go test -race -shuffle=on ./internal/coro

      - name: Test command flag failures and help
        if: matrix.lane == 'integration'
        run: go test -race -shuffle=on ./cmd/internal/base ./cmd/internal/build -run '^Test(ParseFlags|CommandFlagParseExit|BuildFlagParseExit)' -count=1

      - name: Test exact LLVM executor leaf proofs
        if: matrix.lane == 'integration'
        run: go test ./internal/llvmproof -count=1

      - name: Test target-neutral coroutine runtime core
        if: matrix.lane == 'compat'
        run: |
          cd runtime
          go test -race -shuffle=on ./internal/coroalloc -count=1
          go test -race -shuffle=on ./internal/coro -count=1
          go test -race -shuffle=on ./internal/corodoorbell -count=1
          go test -race -tags=coro_gc_observer_test \
            ./internal/runtime/coro_gc_observer_llgo.go \
            ./internal/runtime/coro_gc_observer_test.go -count=1
          go test -race -tags=coro_signal_host_test \
            ./internal/lib/runtime/signal_host_llgo.go \
            ./internal/lib/runtime/signal_host_test.go -count=1
          go test -race -tags=coro_synctest_timer_test \
            ./internal/runtime/coro_synctest_timer_llgo.go \
            ./internal/runtime/coro_synctest_timer_test.go -count=1
          # The run-decision wrapper needs the production coro package but a
          # test-local abort shim, so select its two sources instead of loading
          # the complete LLGo runtime package into the host Go runtime.
          go test -race -shuffle=on -tags=coro_run_decision_abi_test \
            ./internal/runtime/coro_run_decision.go \
            ./internal/runtime/coro_run_decision_test.go \
            -run '^Test(CoroRunDecisionOutputModeV1|NormalCoroRunDecisionWordsV1|CoroRunDecisionWrapperRejectsMalformedNormalOnlyMode)$' -count=1
          go test . -run '^(TestCoroNativeTargetBuildSelection|TestCoroTimerOwnerV2SourceABI|TestNativeTimerCapacity|TestTimeSleep|TestCoroGCNotification|TestCallerPCRegistryProductionRace|TestBDWGCInitialMarkerQuota)' -count=1
          go test -race ./internal/lib/runtime/time_coro_gc_llgo.go \
            ./internal/lib/runtime/time_coro_gc_test.go -count=1 -timeout=60s
          # The complete LLGo runtime package intentionally owns symbols that
          # collide with the host Go runtime. Use the real production adapter
          # sources plus test-only definitions of the compiler-owned C wrappers
          # to exercise begin/run/destroy without adding production callbacks.
          # Compiler tests separately cover the LLVM/LLGo side; this is not a
          # cross-language linked smoke test.
          go test -race -shuffle=on -tags=coro_runtime_adapter_test \
            ./internal/runtime/coro_run_slice.go \
            ./internal/runtime/coro_task_context_test_adapter.go \
            ./internal/runtime/coro_execution_quota_default.go \
            ./internal/runtime/coro_program.go \
            ./internal/runtime/coro_sched.go \
            ./internal/runtime/coro_gc_observer_test_adapter.go \
            ./internal/runtime/coro_executor.go \
            ./internal/runtime/coro_panic_payload.go \
            ./internal/runtime/coro_panic_trace_nil_test_adapter.go \
            ./internal/runtime/coro_panic_trace_release_test_adapter.go \
            ./internal/runtime/coro_executor_driver_legacy.go \
            ./internal/runtime/coro_ready_distribution_default.go \
            ./internal/runtime/coro_target_executor_retired_default.go \
            ./internal/runtime/coro_target_test_adapter.go \
            ./internal/runtime/coro_program_test.go \
            -run '^TestCoroProgram' -count=1
          go test -race -shuffle=on -tags=coro_poll_owner_test \
            ./internal/runtime/coro_poll_owner_llgo.go \
            ./internal/runtime/coro_operation_capacity.go \
            ./internal/runtime/coro_target_poll_import.go \
            ./internal/runtime/coro_poll_owner_test.go -count=1
          # The native fleet is a deliberately isolated production adapter:
          # select only its real source plus its host test so LLGo runtime
          # symbols do not collide with the host Go runtime.
          go test -race -shuffle=on -tags=coro_native_fleet_test \
            ./internal/runtime/coro_run_slice.go \
            ./internal/runtime/coro_task_context_test_adapter.go \
            ./internal/runtime/coro_execution_quota_default.go \
            ./internal/runtime/coro_ready_distribution_default.go \
            ./internal/runtime/coro_native_fleet.go \
            ./internal/runtime/coro_gc_observer_test_adapter.go \
            ./internal/runtime/coro_gc_observer_nobdwgc.go \
            ./internal/runtime/coro_native_deferred_replacement_default.go \
            ./internal/runtime/coro_native_fleet_reactor.go \
            ./internal/runtime/coro_native_atomic_host.go \
            ./internal/runtime/coro_native_fleet_test.go \
            -run '^TestCoroNativeFleet' -count=1
          # Exercise the native page shape under the host race detector.
          go test -p=1 -race -shuffle=on -tags=coro_smallpage_test ./internal/coro -count=3 -timeout=10m
          # Fleet state is process-global: use three fresh processes.
          for small_page_round in 1 2 3; do
            go test -p=1 -race -shuffle=on -gcflags=command-line-arguments=-lang=go1.20 -tags=coro_native_fleet_test,coro_smallpage_test \
              ./internal/runtime/coro_run_slice.go \
              ./internal/runtime/coro_task_context_test_adapter.go \
              ./internal/runtime/coro_execution_quota_default.go \
              ./internal/runtime/coro_ready_distribution_default.go \
              ./internal/runtime/coro_native_fleet.go \
              ./internal/runtime/coro_gc_observer_test_adapter.go \
              ./internal/runtime/coro_gc_observer_nobdwgc.go \
              ./internal/runtime/coro_native_deferred_replacement_default.go \
              ./internal/runtime/coro_native_fleet_reactor.go \
              ./internal/runtime/coro_native_atomic_host.go \
              ./internal/runtime/coro_native_fleet_test.go \
              -run '^TestCoroNativeFleet' -count=1
          done
          GOOS=js GOARCH=wasm CGO_ENABLED=0 go test \
            -tags=coro_runtime_adapter_test \
            -exec="$(go env GOROOT)/lib/wasm/go_js_wasm_exec" \
            ./internal/runtime/coro_run_slice.go \
            ./internal/runtime/coro_task_context_test_adapter.go \
            ./internal/runtime/coro_execution_quota_default.go \
            ./internal/runtime/coro_program.go \
            ./internal/runtime/coro_sched.go \
            ./internal/runtime/coro_gc_observer_test_adapter.go \
            ./internal/runtime/coro_executor.go \
            ./internal/runtime/coro_panic_payload.go \
            ./internal/runtime/coro_panic_trace_nil_test_adapter.go \
            ./internal/runtime/coro_panic_trace_release_test_adapter.go \
            ./internal/runtime/coro_executor_driver_legacy.go \
            ./internal/runtime/coro_ready_distribution_default.go \
            ./internal/runtime/coro_target_executor_retired_default.go \
            ./internal/runtime/coro_target_test_adapter.go \
            ./internal/runtime/coro_program_test.go \
            -run '^TestCoroProgram' -count=1
          # Exercise the production typed hchan queue and exact coroutine
          # source transaction together. The host atomic shim exercises the
          # portable no-suspend channel gate without an OS mutex dependency.
          go test -race -shuffle=on -tags='coro_channel_adapter_test,coro_channel_owner_test' \
            ./internal/runtime/z_chan.go \
            ./internal/runtime/z_chan_coro.go \
            ./internal/runtime/coro_current_task_route_test_adapter.go \
            ./internal/runtime/coro_keyed_registry_atomic_host.go \
            ./internal/runtime/coro_resume_materialize.go \
            ./internal/runtime/z_chan_lock_coro.go \
            ./internal/runtime/z_chan_lock_coro_atomic_host.go \
            ./internal/runtime/coro_channel_adapter_test.go \
            ./internal/runtime/coro_channel_owner_lock_test.go \
            -run '^TestCoroChannelAdapter' -count=1
          GOOS=js GOARCH=wasm CGO_ENABLED=0 go test \
            -tags='coro_channel_adapter_test,coro_channel_owner_test' \
            -exec="$(go env GOROOT)/lib/wasm/go_js_wasm_exec" \
            ./internal/runtime/z_chan.go \
            ./internal/runtime/z_chan_coro.go \
            ./internal/runtime/coro_current_task_route_test_adapter.go \
            ./internal/runtime/coro_keyed_registry_atomic_host.go \
            ./internal/runtime/coro_resume_materialize.go \
            ./internal/runtime/z_chan_lock_coro.go \
            ./internal/runtime/z_chan_lock_coro_atomic_host.go \
            ./internal/runtime/coro_channel_adapter_test.go \
            ./internal/runtime/coro_channel_owner_lock_test.go \
            -run '^TestCoroChannelAdapter' -count=1
          # Semaphore and notify waits share one POD-only keyed registry. Race
          # the exact lock-free production source to lock FIFO selection,
          # generation reuse, cancellation, and single-owner posting without
          # silently restoring the old channel spin gate dependency.
          go test -race -shuffle=on -tags=coro_sema_owner_test \
            ./internal/runtime/coro_current_task_route_test_adapter.go \
            ./internal/runtime/coro_keyed_registry_atomic_host.go \
            ./internal/runtime/coro_resume_materialize.go \
            ./internal/runtime/coro_operation_capacity.go \
            ./internal/runtime/coro_keyed_park.go \
            ./internal/runtime/coro_keyed_post_test.go \
            ./internal/runtime/coro_keyed_registry_test.go \
            ./internal/runtime/coro_sema_owner_llgo.go \
            ./internal/runtime/coro_sema_owner_test.go \
            -run '^TestCoroKeyed' -count=1
          GOOS=js GOARCH=wasm CGO_ENABLED=0 go test \
            -tags=coro_sema_owner_test \
            -exec="$(go env GOROOT)/lib/wasm/go_js_wasm_exec" \
            ./internal/runtime/coro_current_task_route_test_adapter.go \
            ./internal/runtime/coro_keyed_registry_atomic_host.go \
            ./internal/runtime/coro_resume_materialize.go \
            ./internal/runtime/coro_operation_capacity.go \
            ./internal/runtime/coro_keyed_park.go \
            ./internal/runtime/coro_keyed_post_test.go \
            ./internal/runtime/coro_keyed_registry_test.go \
            ./internal/runtime/coro_sema_owner_llgo.go \
            ./internal/runtime/coro_sema_owner_test.go \
            -run '^TestCoroKeyed' -count=1
          go test ./internal/corotimer -run '^TestDeadlineAfter$' -count=1

      - name: Link named freestanding WebAssembly targets
        if: matrix.lane == 'target-wasm'
        env:
          LLGO_WASM_TARGET_SMOKE: "1"
          WASM_TARGET: ${{ matrix.wasm_target }}
        run: |
          go test -v ./internal/crosscompile -run '^TestFreestandingWasmTargetToolchainSmoke$' -count=1
          go build -o /tmp/llgo-wasm-target ./cmd/llgo
          target="$WASM_TARGET"
          output="/tmp/llgo-${target}.wasm"
          LLGO_BUILD_CACHE=off LDFLAGS='--export=main' \
            /tmp/llgo-wasm-target build -target="$target" -o "$output" \
            ./internal/crosscompile/testdata/wasm_allocator
          test "$(od -An -t x1 -N4 "$output" | tr -d ' \n')" = '0061736d'
          symbols="$(llvm-nm --defined-only --format=just-symbols "$output")"
          for symbol in main malloc free sbrk abort; do
            grep -Fx "$symbol" <<<"$symbols"
          done
          if grep -E '^GC_' <<<"$symbols"; then
            echo 'freestanding binary retained a BDWGC symbol' >&2
            exit 1
          fi
          test -z "$(llvm-nm --undefined-only --format=just-symbols "$output")"
          if command -v wasmtime >/dev/null; then
            result="$(wasmtime run --invoke main "$output" 0 0)"
            test "$result" = '0'
          fi

          host_exports='--export=main --export=malloc --export=free --export=__llgo_coro_host_next_action_v1 --export=__llgo_coro_host_profile_v1 --export=__llgo_coro_host_publish_time_v1 --export=__llgo_coro_host_publish_wall_time_v1 --export=__llgo_coro_host_continue_slice_v1 --export=__llgo_coro_host_ack_cancel_v1 --export=__llgo_coro_host_next_operation_v1 --export=__llgo_coro_host_complete_operation_v1'
          output="/tmp/llgo-${target}-stdlib-file.wasm"
          LLGO_BUILD_CACHE=off LDFLAGS="$host_exports" \
            /tmp/llgo-wasm-target build -target="$target" -o "$output" \
            ./internal/build/_testgo/coro_stdlib_file_rw
          test -z "$(llvm-nm --undefined-only --format=just-symbols "$output")"
          result="$(node ./internal/build/_testgo/coro_host_file_rw/host_runner.mjs "$output")"
          grep -F '"status":"complete"' <<<"$result"
          grep -F '"operations":5' <<<"$result"

          positional="/tmp/llgo-${target}-positional-file.wasm"
          LLGO_BUILD_CACHE=off LDFLAGS="$host_exports" \
            /tmp/llgo-wasm-target build -target="$target" -o "$positional" \
            ./internal/build/_testgo/coro_host_file_positional
          result="$(node ./internal/build/_testgo/coro_host_file_rw/host_runner.mjs "$positional" positional)"
          grep -F '"status":"complete"' <<<"$result"
          grep -F '"operations":12' <<<"$result"

          output="/tmp/llgo-${target}-host-network.wasm"
          LLGO_BUILD_CACHE=off LDFLAGS="$host_exports" \
            /tmp/llgo-wasm-target build -target="$target" -o "$output" \
            ./internal/build/_testgo/coro_host_network_loopback
          test -z "$(llvm-nm --undefined-only --format=just-symbols "$output")"
          result="$(node ./internal/build/_testgo/coro_host_network_loopback/host_runner.mjs "$output")"
          grep -F '"status":"complete"' <<<"$result"
          grep -F '"operations":16' <<<"$result"
          grep -F '"cancellations":2' <<<"$result"

          output="/tmp/llgo-${target}-stdlib-tcp.wasm"
          LLGO_BUILD_CACHE=off LDFLAGS="$host_exports" \
            /tmp/llgo-wasm-target build -target="$target" -o "$output" \
            ./internal/build/_testgo/coro_stdlib_tcp_loopback
          test -z "$(llvm-nm --undefined-only --format=just-symbols "$output")"
          result="$(node ./internal/build/_testgo/coro_stdlib_tcp_loopback/host_runner.mjs "$output")"
          grep -F '"status":"complete"' <<<"$result"
          grep -F '"cancellationOpcodes":[65538,65539,131076,131077,131083,131085]' <<<"$result"
          grep -F '"dnsQueries":[1,28]' <<<"$result"

      - name: Run the built-in JS/WebAssembly command reactor
        if: matrix.lane == 'target-js-wasm'
        run: |
          go test ./internal/crosscompile -run '^TestJS(WasmCommandUsesOnlyHostPullCoroutineReactor|FSCallOperationProtocol)$' -count=1
          go test ./internal/build -run '^TestJSFilesystem' -count=1
          go build -o /tmp/llgo-js-wasm ./cmd/llgo
          output=/tmp/llgo-js-wasm-time.wasm
          GOMAXPROCS=2 GOMEMLIMIT=2GiB LLGO_BUILD_CACHE=off \
            /tmp/llgo-js-wasm build -p=1 -target=wasm -o "$output" \
            ./internal/build/_testgo/coro_stdlib_time_sleep
          test "$(od -An -t x1 -N4 "$output" | tr -d ' \n')" = '0061736d'
          diff -u \
            <(sort targets/wasm-undefined.txt) \
            <(llvm-nm --undefined-only --format=just-symbols "$output" | sort)
          node targets/wasm_exec.js "$output"

          caller=/tmp/llgo-js-shared-caller-pc.wasm
          GOMAXPROCS=2 GOMEMLIMIT=2GiB LLGO_BUILD_CACHE=off \
            /tmp/llgo-js-wasm build -p=1 -target=wasm -o "$caller" \
            runtime/_testgo/coro_shared_caller_pc/main.go
          result="$(timeout 30s node --max-old-space-size=256 --unhandled-rejections=strict targets/wasm_exec.js "$caller")"
          test "$result" = 'shared caller PC identity passed'

          filesystem=/tmp/llgo-js-wasm-stdlib-file.wasm
          GOMAXPROCS=2 GOMEMLIMIT=2GiB LLGO_BUILD_CACHE=off \
            /tmp/llgo-js-wasm build -p=1 -target=wasm -o "$filesystem" \
            ./internal/build/_testgo/coro_js_stdlib_file
          result="$(node internal/crosscompile/testdata/coro_js_fs/real_file.cjs targets/wasm_exec.js "$filesystem")"
          grep -Fx 'Node standard filesystem and Go bookkeeping ok' <<<"$result"
          grep -F 'Node physical filesystem cleanup ok (' <<<"$result"
          test ! -e /tmp/llgo-coro-js-stdlib-file

          GOMAXPROCS=2 GOMEMLIMIT=2GiB LLGO_BUILD_CACHE=off \
            LLGO_TEST_LLGO=/tmp/llgo-js-wasm LLGO_CORO_JS_RESOURCE_ACCEPTANCE=1 \
            timeout 12m go test -p=1 ./internal/build \
            -run '^TestCoroJSBorrowedResourceCleanupAcceptance$' -v -count=1 -timeout=11m

      - name: Run the built-in WASI Preview 1 command reactor
        if: matrix.lane == 'target-wasi-command'
        run: |
          go test ./internal/crosscompile \
            -run '^Test(WASICommandReactorUsesOneBoundedHostPullCore|WASIMemoryOwnershipLinkFlags|ResolvedLLVMTargetSpecWASIThreads)$' \
            -count=1
          go test ./internal/build \
            -run '^Test(WASICommandOwnsSingleThreadedMemory|WASIP1CoroSyscallMetadataSourcePatch|WASMMathGenericSourcePatch)$' \
            -count=1
          go build -o /tmp/llgo-wasi-command ./cmd/llgo
          output=/tmp/llgo-wasi-command-reactor.wasm
          GOMAXPROCS=2 GOMEMLIMIT=2GiB LLGO_BUILD_CACHE=off \
            /tmp/llgo-wasi-command build -p=1 -target=wasip1 -o "$output" \
            ./internal/build/_testgo/coro_wasi_command_reactor
          test "$(od -An -t x1 -N4 "$output" | tr -d ' \n')" = '0061736d'
          result="$(wasmtime run --dir=/tmp "$output")"
          grep -Fx 'WASI reactor file, timer and inherited stdout ok' <<<"$result"
          test ! -e /tmp/llgo-coro-wasi-command-reactor

          positional=/tmp/llgo-wasi-positional-file.wasm
          GOMAXPROCS=2 GOMEMLIMIT=2GiB LLGO_BUILD_CACHE=off \
            /tmp/llgo-wasi-command build -p=1 -target=wasip1 -o "$positional" \
            ./internal/build/_testgo/coro_host_file_positional
          wasmtime run --dir=/tmp "$positional"
          test ! -e /tmp/llgo-coro-host-positional

          filesystem=/tmp/llgo-wasi-filesystem.wasm
          GOMAXPROCS=2 GOMEMLIMIT=2GiB LLGO_BUILD_CACHE=off \
            /tmp/llgo-wasi-command build -p=1 -target=wasip1 -o "$filesystem" \
            ./internal/build/_testgo/coro_wasi_filesystem
          result="$(wasmtime run --dir=/tmp "$filesystem")"
          grep -Fx 'WASI raw filesystem and Go cwd ok' <<<"$result"
          test ! -e /tmp/llgo-coro-wasi-filesystem

          stdfile=/tmp/llgo-wasi-stdlib-file.wasm
          GOMAXPROCS=2 GOMEMLIMIT=2GiB LLGO_BUILD_CACHE=off \
            /tmp/llgo-wasi-command build -p=1 -target=wasip1 -o "$stdfile" \
            ./internal/build/_testgo/coro_wasi_stdlib_file
          result="$(wasmtime run --dir=/tmp "$stdfile")"
          grep -Fx 'WASI standard file, Root and fmt ok' <<<"$result"
          test ! -e /tmp/llgo-coro-wasi-stdlib-file

          unsupported=/tmp/llgo-wasi-reflect-unsupported.wasm
          GOMAXPROCS=2 GOMEMLIMIT=2GiB LLGO_BUILD_CACHE=off \
            /tmp/llgo-wasi-command build -p=1 -target=wasip1 -o "$unsupported" \
            ./internal/build/_testgo/coro_wasi_reflect_unsupported
          result="$(wasmtime run "$unsupported")"
          grep -Fx 'WASI dynamic reflection fails explicitly' <<<"$result"

          for probe in syscall os; do
            exit_output="/tmp/llgo-wasi-${probe}-exit.wasm"
            GOMAXPROCS=2 GOMEMLIMIT=2GiB LLGO_BUILD_CACHE=off \
              /tmp/llgo-wasi-command build -p=1 -target=wasip1 -o "$exit_output" \
              "./internal/build/_testgo/coro_wasi_${probe}_exit"
            status=0
            wasmtime run "$exit_output" || status=$?
            test "$status" -eq 42
          done

          math_output=/tmp/llgo-wasi-math.wasm
          GOMAXPROCS=2 GOMEMLIMIT=2GiB LLGO_BUILD_CACHE=off \
            /tmp/llgo-wasi-command build -p=1 -target=wasip1 -o "$math_output" \
            ./internal/build/_testgo/coro_wasm_math
          result="$(wasmtime run "$math_output")"
          grep -Fx 'WASM generic math semantics ok' <<<"$result"

          wasi_cache="${XDG_CACHE_HOME:-$HOME/.cache}/llgo/crosscompile"
          mapfile -t wasi_headers < <(find "$wasi_cache" -path '*/include/wasm32-wasip1/wasi/api.h')
          test "${#wasi_headers[@]}" -gt 0
          LLGO_WASI_REACTOR_SYSROOT="${wasi_headers[0]%/include/wasm32-wasip1/wasi/api.h}" \
            go test ./internal/crosscompile -run '^TestWASIReactorOperationLifecycle$' -count=1

          gc_output=/tmp/llgo-wasi-frame-gc.wasm
          GOMAXPROCS=2 GOMEMLIMIT=2GiB LLGO_BUILD_CACHE=off \
            /tmp/llgo-wasi-command build -p=1 -target=wasip1-gc -o "$gc_output" \
            ./internal/build/_testgo/coro_wasi_frame_gc
          test "$(od -An -t x1 -N4 "$gc_output" | tr -d ' \n')" = '0061736d'
          gc_symbols="$(llvm-nm --defined-only --format=just-symbols "$gc_output")"
          if grep -E '^GC_' <<<"$gc_symbols"; then
            echo 'WASI TinyGC binary retained a BDWGC symbol' >&2
            exit 1
          fi
          wasmtime run "$gc_output"

      - name: Upload failed WebAssembly coroutine probes
        if: failure() && (matrix.lane == 'target-wasm' || matrix.lane == 'target-js-wasm' || matrix.lane == 'target-wasi-command')
        uses: actions/upload-artifact@v7
        with:
          name: coroutine-wasm-failure-${{ github.run_id }}-${{ matrix.wasm_target || matrix.lane }}
          path: |
            /tmp/llgo-*-stdlib-file.wasm
            /tmp/llgo-*-host-network.wasm
            /tmp/llgo-*-stdlib-tcp.wasm
            /tmp/llgo-js-wasm-time.wasm
            /tmp/llgo-wasi-command-reactor.wasm
            /tmp/llgo-wasi-frame-gc.wasm
            /tmp/llgo-wasi-filesystem.wasm
            /tmp/llgo-wasi-positional-file.wasm
            /tmp/llgo-wasi-reflect-unsupported.wasm
            /tmp/llgo-wasi-math.wasm
            /tmp/llgo-wasi-*-exit.wasm
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Compile coroutine runtime adapter across targets
        if: matrix.lane == 'target-core'
        run: |
          cd runtime
          # Select the real LLGo production bridges. A package assembled with
          # host-Go tags omits its compiler-owned synctest/GC/context functions
          # and is not an executable configuration of this runtime.
          go test . -run '^TestCoroHostTargetCrossCompile$' -count=1
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go test -c -o /tmp/coro-doorbell-linux-arm64.test ./internal/corodoorbell
          GOOS=linux GOARCH=riscv64 CGO_ENABLED=0 go test -c -o /tmp/coro-doorbell-linux-riscv64.test ./internal/corodoorbell

      - name: Test coroutine build integration
        if: matrix.lane == 'integration'
        # Keep the analyzer and source-contract tests in one short-lived
        # process. Tests that invoke the complete build pipeline own a separate
        # lane below because each retains a full runtime/stdlib LLVM universe.
        run: go test ./internal/build -run 'Coro|Coroutine|SourcePatchRequirement' -skip 'E2E|^TestCoroNativeTimeSleepProductionPlanAndCodegen$|^TestCoroStdlibSyncAcceptance$|^Test(BuildCoroPlanErrors|CoroEmissionCoverageStopsBeforeAnyPackageCodegen|CoroUnsupportedEntryResolutionReturnsErrorBeforeCodegen|CoroEmissionUniverseAcceptsModeTestVariants|RealNativeCoroTargetIsTrustedPlainSchedulerIsland)$' -timeout=10m -count=1

      - name: Test staged method type retention and cache metadata
        if: matrix.lane == 'integration'
        run: go test -race -shuffle=on ./internal/dcepass ./internal/build -run '^Test(MethodFragment|EmitStrongType|MethodArray|StagedMethodTypes|SemanticDeadcode|PackageMetaEnabled|LinkedCExports|DeadcodeEntry)' -timeout=10m -count=1

      - name: Test coroutine production build plan
        if: matrix.lane == 'integration-build'
        # These tests intentionally run build.Do and therefore materialize a
        # complete runtime/stdlib SSA and LLVM universe. Keep the coverage, but
        # isolate both their job and process lifetimes from the smaller analyzer
        # contract suite and from one another. LLVM allocations otherwise
        # accumulate across full builds even after Go test cleanup.
        run: |
          tests=(
            TestBuildCoroPlanErrors
            TestCoroEmissionCoverageStopsBeforeAnyPackageCodegen
            TestCoroUnsupportedEntryResolutionReturnsErrorBeforeCodegen
            TestCoroEmissionUniverseAcceptsModeTestVariants
            TestRealNativeCoroTargetIsTrustedPlainSchedulerIsland
          )
          for test in "${tests[@]}"; do
            go test ./internal/build -run "^${test}$" -timeout=10m -count=1
          done

      - name: Test concurrent native object ownership
        if: matrix.lane == 'integration-build'
        run: go test -race ./internal/build -run '^TestNativeObject' -timeout=5m -count=1

      - name: Test detached backend memory and root preservation
        if: matrix.lane == 'integration-build'
        run: go test ./ssa ./internal/build -run '^Test(CoroPackageLoweringPreservesSuspendedOwner|StagedPackageCompactionWriteFailurePreservesOwner|DiscardLocalValueNamesPreservesSymbolsAndRoots|LargeAArch64CodegenReleasesMachineFunctions)$' -timeout=5m -count=1

      - name: Test native coroutine fault landing
        if: matrix.lane == 'fault-e2e'
        run: |
          # Exercise the complete standard runtime and a real protected-page
          # signal. This also covers enabling panic-on-fault and faulting again
          # in the same physical root resume, which IR-only tests cannot prove.
          go build -o /tmp/llgo-coro-fault ./cmd/llgo
          GOMAXPROCS=2 GOMEMLIMIT=2GiB GOFLAGS=-p=1 LLGO_BUILD_CACHE=off \
            /tmp/llgo-coro-fault build -p=1 -trimpath \
            -o /tmp/llgo-coro-fault-gate ./test/go/testdata/coro_fault_landing
          timeout 30s /tmp/llgo-coro-fault-gate
          if timeout 30s env LLGO_CORO_REJECT_FAULT=1 /tmp/llgo-coro-fault-gate \
              >/tmp/llgo-coro-fault-reject.log 2>&1; then
            echo 'unexpected non-nil fault returned successfully'
            cat /tmp/llgo-coro-fault-reject.log
            exit 1
          fi
          if grep -Fq 'unexpected non-nil fault recovered' \
              /tmp/llgo-coro-fault-reject.log; then
            cat /tmp/llgo-coro-fault-reject.log
            exit 1
          fi

      - name: Test concurrent first use of native fallback symbol caches
        if: matrix.lane == 'fault-e2e'
        run: |
          GOMAXPROCS=2 GOMEMLIMIT=2GiB GOFLAGS=-p=1 LLGO_BUILD_CACHE=off \
            LLGO_TEST_LLGO=/tmp/llgo-coro-fault \
            go test ./test/go -run '^TestRuntimeFallbackSymbolCacheConcurrentFirstUse$' \
              -timeout=5m -count=1 -v

      - name: Test guarded WaitGroup updates without execution domains
        if: matrix.lane == 'fault-e2e'
        run: |
          GOMAXPROCS=2 GOMEMLIMIT=2GiB GOFLAGS=-p=1 LLGO_BUILD_CACHE=off \
            /tmp/llgo-coro-fault test -c -p=1 -trimpath \
              -o /tmp/llgo-waitgroup-fast-gate \
              test/go/waitgroup_fast_add_test.go \
              test/go/waitgroup_brief_wait_test.go
          python3 - <<'PYCODE'
          from pathlib import Path
          import subprocess
          image = '/tmp/llgo-waitgroup-fast-gate'
          names = [line.split()[-1] for line in subprocess.check_output(['llvm-nm', image], text=True).splitlines()
                   if 'TestWaitGroupFastAddConcurrentCounter' in line and line.rstrip().endswith('$coro.resume')]
          assert names, 'missing native counter-test resumes'
          assembly = subprocess.check_output(['llvm-objdump', '--disassemble', '--disassemble-symbols=' + ','.join(names), image], text=True)
          assert 'cmpxchg' in assembly, 'native tests did not retain the guarded CAS'
          # The rejected patch is never added to the package. Its source
          # position in the actual image proves admission without requiring
          # the optimizer to retain a particular helper call or symbol.
          assert b'waitgroup_coro_go127.go' in Path(image).read_bytes(), 'source-guarded pre-wait path was not admitted'
          PYCODE
          for procs in 1 4; do
            GOMAXPROCS="$procs" timeout 90s /tmp/llgo-waitgroup-fast-gate \
              -test.v -test.count=3 -test.timeout=60s
          done

      - name: Test private channels, brief semaphore waits and memory equality
        if: matrix.lane == 'fault-e2e'
        run: |
          GOMAXPROCS=2 GOMEMLIMIT=2GiB GOFLAGS=-p=1 LLGO_BUILD_CACHE=off \
            /tmp/llgo-coro-fault test -c -p=1 -trimpath \
              -o /tmp/llgo-local-channel-gate \
              test/go/local_buffered_channel_test.go \
              test/go/local_buffered_channel_synctest_test.go \
              test/go/semaphore_brief_wait_test.go \
              test/go/waitgroup_brief_wait_synctest_test.go \
              test/go/memory_equality_offsets_test.go \
              test/go/defer_panic_callers_test.go \
              test/go/runtime_caller_exhaustion_test.go \
              test/go/recover_defer_go126_test.go \
              test/go/bound_method_direct_test.go \
              test/go/field_guard_memory_test.go
          for procs in 1 4; do
            GOMAXPROCS="$procs" timeout 90s /tmp/llgo-local-channel-gate \
              -test.v -test.count=3 -test.timeout=60s
          done

      - name: Test native linked coroutine islands
        if: matrix.lane == 'native-e2e'
        # Each fixture builds and optimizes its own LLVM runtime island. Keep
        # them in separate processes so LLVM state from an earlier fixture
        # cannot consume the shared 10-minute test timeout.
        run: |
          tests=(
            TestCoroStaticPlainDeferNativeNoStdlibRuntimeE2E
            TestCoroExplicitPanicNativeNoStdlibRuntimeE2E
            TestCoroChannelAndClosedStaticSpawnNativeNoStdlibRuntimeE2E
          )
          for test in "${tests[@]}"; do
            go test ./internal/build -run "^${test}$" -timeout=10m -count=1
          done

      - name: Test independent archive coroutine islands
        if: matrix.lane == 'archive-e2e'
        # Keep the complete archive cohort off the physical FD lane's job
        # budget. Every discovered test still runs in its own fresh process.
        run: |
          set -euo pipefail
          pattern='^TestCoroArchive.*DeliveryNativeNoStdlibRuntimeE2E$'
          go test ./internal/build -list "$pattern" > /tmp/llgo-coro-archive-tests.log
          mapfile -t tests < <(sed -n '/^TestCoroArchive.*DeliveryNativeNoStdlibRuntimeE2E$/p' /tmp/llgo-coro-archive-tests.log)
          test "${#tests[@]}" -gt 0
          for test in "${tests[@]}"; do
            go test ./internal/build -run "^${test}$" -timeout=10m -count=1
          done

      - name: Test native coroutine fleet
        if: matrix.lane == 'fleet-e2e'
        run: go test ./internal/build -run '^TestCoroNativeFleet.*E2E$' -timeout=10m -count=1

      - name: Test physical resource cancellation and asynchronous defer cleanup
        if: matrix.lane == 'native-e2e'
        env:
          LLGO_CORO_RESOURCE_ACCEPTANCE: "1"
          LLGO_TEST_LLGO: /tmp/llgo-resource-cleanup
          LLGO_CORO_RESOURCE_OUTPUT: /tmp/llgo-resource-artifacts
          GOMAXPROCS: "2"
          GOMEMLIMIT: 2GiB
        run: |
          # Linux per-process virtual-memory cap also bounds LLVM allocations,
          # which GOMEMLIMIT alone does not cover. Keep nested builds serial.
          ulimit -v 6291456
          go build -p=1 -o "$LLGO_TEST_LLGO" ./cmd/llgo
          timeout 18m go test -p=1 ./internal/build \
            -run '^TestCoro(BorrowedResourceCleanup|ResourceDeliverySlot|ResourceDeliveryForward|PublicOpenResource)Acceptance$' -v -count=1 -timeout=17m

      - name: Test reflected resource custody and independent archives
        if: matrix.lane == 'reflect-e2e'
        env:
          LLGO_CORO_RESOURCE_ACCEPTANCE: "1"
          LLGO_TEST_LLGO: /tmp/llgo-resource-cleanup
          LLGO_CORO_RESOURCE_OUTPUT: /tmp/llgo-resource-artifacts
          GOMAXPROCS: "2"
          GOMEMLIMIT: 2GiB
        run: |
          ulimit -v 6291456
          go build -p=1 -o "$LLGO_TEST_LLGO" ./cmd/llgo
          # Run each archive consumer in a fresh compiler process. The four
          # consumers otherwise retain earlier build state under one 6 GiB
          # address-space cap. Preserve every case and the existing limits.
          tests=(
            '^TestCoroReflectResourceAcceptance$'
            '^TestCoroReflectPostNativeResourceAcceptance$'
            '^TestCoroReflectArchiveResourceAcceptance$/^Small$'
            '^TestCoroReflectArchiveResourceAcceptance$/^Large$'
            '^TestCoroReflectArchiveResourceAcceptance$/^BoundSmall$'
            '^TestCoroReflectArchiveResourceAcceptance$/^BoundLarge$'
          )
          for test in "${tests[@]}"; do
            timeout 12m go test -p=1 ./internal/build -run "$test" -v -count=1 -timeout=11m
          done

      - name: Record failed native resource environment
        if: failure() && (matrix.lane == 'native-e2e' || matrix.lane == 'reflect-e2e')
        run: |
          mkdir -p /tmp/llgo-resource-artifacts
          {
            go version
            llvm-config-${{ matrix.llvm }} --version
            dpkg-query -W libgc1 libgc-dev libc6
            sha256sum /tmp/llgo-resource-cleanup
            find /tmp/llgo-resource-artifacts -type f -name resource -exec sha256sum {} \;
            find /tmp/llgo-resource-artifacts -type f -name resource -exec ldd {} \;
          } > /tmp/llgo-resource-artifacts/environment.txt 2>&1

      - name: Upload failed native resource images
        if: failure() && (matrix.lane == 'native-e2e' || matrix.lane == 'reflect-e2e')
        uses: actions/upload-artifact@v7
        with:
          name: failed-${{ matrix.lane }}-resource-llvm${{ matrix.llvm }}
          path: |
            /tmp/llgo-resource-cleanup
            /tmp/llgo-resource-artifacts
          if-no-files-found: error
          retention-days: 7

      - name: Test main return racing channel completion
        if: matrix.lane == 'fleet-e2e'
        run: |
          go build -o /tmp/llgo-fleet-regression ./cmd/llgo
          GOMAXPROCS=2 GOMEMLIMIT=2GiB LLGO_BUILD_CACHE=off \
            go test ./test/goroot -run '^TestGoRootRunCases$' -count=1 -v -timeout=8m \
            -goroot="$(go env GOROOT)" -llgo=/tmp/llgo-fleet-regression \
            -directive-mode=ci -case='^chan/sieve[12]\.go$' \
            -build-timeout=3m -run-timeout=1m

      - name: Test synchronous stdlib coroutine acceptance
        if: startsWith(matrix.lane, 'stdlib-')
        env:
          LLGO_CORO_STDLIB_FIXTURES: ${{ matrix.fixtures }}
        run: |
          # Each fixture performs a fresh whole-stdlib LLVM build. Keep them in
          # separate Go processes so LLVM/global build state from an earlier
          # fixture cannot accumulate into the later TCP/DNS gate.
          for fixture in $LLGO_CORO_STDLIB_FIXTURES; do
            LLGO_CORO_STDLIB_ACCEPTANCE="$fixture" \
              go test ./internal/build -run '^TestCoroStdlibSyncAcceptance$' -timeout=15m -count=1
          done

      - name: Test guarded poll locks and dynamic interface comparisons
        if: matrix.lane == 'stdlib-file'
        run: |
          GOMAXPROCS=2 GOMEMLIMIT=2GiB GOFLAGS=-p=1 \
            go build -p=1 -o /tmp/llgo-poll-compiler ./cmd/llgo
          GOMAXPROCS=2 GOMEMLIMIT=2GiB GOFLAGS=-p=1 LLGO_BUILD_CACHE=off \
            /tmp/llgo-poll-compiler test -c -p=1 -trimpath \
              -o /tmp/llgo-poll-gate \
              test/go/poll_mutex_fast_test.go test/go/interface_compare_fast_test.go
          python3 - <<'PYCODE'
          import json
          from pathlib import Path
          import subprocess
          image = '/tmp/llgo-poll-gate'
          out = Path('/tmp/llgo-poll-codegen')
          out.mkdir()
          symbols = subprocess.check_output(['llvm-nm', '--print-size', image], text=True)
          (out / 'symbols.txt').write_text(symbols)
          groups = {
              'counter': lambda name: 'TestPollMutexFastConcurrent' in name and name.endswith('$coro.resume'),
              'fd-read-lock': lambda name: name == 'internal/poll.(*FD).readLock$coro.resume',
              'fd-read-unlock': lambda name: name == 'internal/poll.(*FD).readUnlock$coro.resume',
          }
          proof = {}
          for group, selected in groups.items():
              entries = []
              for line in symbols.splitlines():
                  fields = line.split()
                  if len(fields) != 4 or not selected(fields[3]):
                      continue
                  address, size, kind, name = fields
                  start, size = int(address, 16), int(size, 16)
                  assert kind.lower() == 't' and size > 0, 'missing ELF function extent: ' + name
                  # A resume contains interior __llgo_pcsite symbols. Selecting
                  # only its name stops objdump at the first interior symbol;
                  # the ELF function extent includes its remaining instructions.
                  assembly = subprocess.check_output([
                      'llvm-objdump', '--disassemble', '--start-address=' + hex(start),
                      '--stop-address=' + hex(start + size), image], text=True)
                  (out / (group + '-' + str(len(entries)) + '.s')).write_text(assembly)
                  entries.append(dict(name=name, address=start, size=size, cas=assembly.count('cmpxchg')))
              proof[group] = entries
          (out / 'proof.json').write_text(json.dumps(proof, indent=2) + '\n')
          print(json.dumps(proof, indent=2))
          assert len(proof['counter']) == 2, 'missing poll-lock counter-test resumes'
          assert sum(entry['cas'] for entry in proof['counter']) >= 3, 'poll lock/unlock and WaitGroup guarded updates were not retained'
          for group in ('fd-read-lock', 'fd-read-unlock'):
              assert len(proof[group]) == 1 and proof[group][0]['cas'] >= 1, 'missing production guarded update: ' + group
          PYCODE
          for procs in 1 4; do
            GOMAXPROCS="$procs" timeout 90s /tmp/llgo-poll-gate \
              -test.v -test.count=3 -test.timeout=60s
          done

      - name: Test native build information and released main package metadata
        if: matrix.lane == 'stdlib-file'
        # Reuse this lane's compiler; the fault lane already owns three full
        # native builds. Keep every check and its individual timeout intact.
        run: |
          go test ./internal/build \
            -run '^Test(GenMainModule|LinkedBuildInfo|BuildInfoSurvivesNativeLink|RuntimeCompilerSourcePatchTypeChecks)' \
            -timeout=3m -count=1
          GOMAXPROCS=2 GOMEMLIMIT=2GiB GOFLAGS=-p=1 LLGO_BUILD_CACHE=off \
            timeout 5m /tmp/llgo-poll-compiler build -p=1 -trimpath \
            -o /tmp/llgo-buildinfo-gate ./test/go/testdata/coro_buildinfo
          timeout 30s /tmp/llgo-buildinfo-gate
          go version -m /tmp/llgo-buildinfo-gate
          GOMAXPROCS=2 GOMEMLIMIT=2GiB LLGO_BUILD_CACHE=off \
            go test ./test/goroot -run '^TestGoRootRunCases$' -count=1 -v -timeout=5m \
            -goroot="$(go env GOROOT)" -llgo=/tmp/llgo-poll-compiler \
            -directive-mode=ci -case='^noinit\.go$' \
            -build-timeout=3m -run-timeout=1m

      - name: Upload failed poll mutex code generation
        if: failure() && matrix.lane == 'stdlib-file'
        uses: actions/upload-artifact@v7
        with:
          name: poll-mutex-codegen-llvm-${{ matrix.llvm }}
          path: /tmp/llgo-poll-codegen
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify production time.Sleep coroutine plan
        if: matrix.lane == 'compat'
        run: go test -v ./internal/build -run '^TestCoroNativeTimeSleepProductionPlanAndCodegen$' -timeout=10m -count=1

      - name: Verify optimized compute loop services elapsed timers
        if: matrix.lane == 'stdlib-time'
        run: |
          go build -o /tmp/llgo-preempt-timer ./cmd/llgo
          GOMAXPROCS=2 GOMEMLIMIT=2GiB LLGO_BUILD_CACHE=off \
            /tmp/llgo-preempt-timer build -O3 -lto=full \
            -o /tmp/llgo-preempt-timer-gate ./benchmark/coro_core/testdata/preempt_timer
          # A second P must not conceal a missing safepoint/service poll.
          for attempt in 1 2 3; do
            echo "single-P optimized timer progress: attempt $attempt"
            timeout 30s env GOMAXPROCS=1 /tmp/llgo-preempt-timer-gate
          done

      - name: Test coroutine compiler integration
        if: matrix.lane == 'integration'
        run: |
          go test -race ./cl/ssawrap -count=1
          go test -race ./cl -run '^Test(CompilationCoroPlanObservationAndCacheRegistration|CoroEntryResolutionPlainPrimaryPreservesIR|ResolveFunctionSymbolUsesPrimaryAndExactPlan|CoroEntryRejectsUnsupportedBeforeCreatingSymbol|CoroEntryResolutionPreflightRejectsWholePlanBeforeCodegen|CoroEntryResolutionPreflightRejectsMissingPlanAndCache|Emission.*)$' -count=1

      - name: Test aggregate return snapshots and load safety
        if: matrix.lane == 'integration'
        run: go test -race ./internal/cabi -run '^Test(SmallAggregateReturnPreservesLoadedSnapshot|AggregateReturnLoadSafety|AggregateReturnCarrierAtProtectedBoundary)$' -count=3 -timeout=3m

      - name: Test SSA builder and source/physical type boundaries
        if: matrix.lane == 'compat'
        run: go test -v ./ssa -count=1

      - name: Test recorded caller line-directive positions
        if: matrix.lane == 'compat'
        run: go test ./cl -run '^Test(RuntimeLocationPosition|DirectiveFilename)' -count=1

      - name: Test shared SSA fault and nil-check proofs
        if: matrix.lane == 'compat'
        run: go test ./cl -run '^Test(SSA|CompletedFieldAddress|UnevaluatedFieldAddress|DominatedNilChecks)' -count=1

      - name: Test canonical coroutine plan digest and cache identity
        if: matrix.lane == 'compat'
        run: |
          go test ./internal/coro -run '^TestCoroPlanDigest' -count=1
          go test ./internal/build -run '^Test(BuildCoroPlanInstallsArchiveDigest|CoroutinePlanInputsAffectFingerprint|CoroEntryResolutionUsesPlanMatchedPackageCache|CoroPhysicalABICacheRegistrationPreservesCollectedFuncInfo)$' -count=1
          go test ./internal/build -run '^Test(CoroLibraryProgramPredicateProducedArchiveConsumer|BDWGCNotificationAutomaticForeignThreadAndDetach)$' -count=1
          go test ./cl -run '^Test(CompilationCoroABIIdentityValidation|CoroEntryResolutionCacheRegistrationWithDigest|CoroPhysicalABICacheRegistrationPreservesPhysicalMetadata)$' -count=1

      - name: Test function metadata string pool compatibility
        if: matrix.lane == 'compat'
        run: go test -race -shuffle=on -count=3 ./internal/build/funcinfo

      - name: Test coroutine physical ABI and function dispatch lowering
        if: matrix.lane == 'compat'
        # Run every compiler test whose name is part of the coroutine contract;
        # in particular this covers pure SSA aggregates/PHI and caller-frame
        # park lowering on native64 and wasm32 before and after CoroSplit.
        run: go test -v ./cl -run '^Test(Coro|PhysicalDescriptorPatch|GenericLocal.*Patch|EmissionUniverse(ActiveABIMethodTablesUseFrozenWrapperSymbols|ABIMethodDemandReferencesAreExactRecursiveAndOwnerScoped))' -count=1

      - name: Test real synctest execution and collector ownership
        if: matrix.lane == 'synctest' && github.repository == 'cpunion/llgo' && github.event.pull_request.base.ref == 'llvm-coro'
        env:
          LLGO_CORO_SYNCTEST_ACCEPTANCE: "1"
          LLGO_TEST_LLGO: /tmp/llgo-synctest
        run: |
          go build -o "$LLGO_TEST_LLGO" ./cmd/llgo
          go test ./internal/build -run '^TestCoroSynctestAcceptance$' -v -count=1 -timeout=18m

      - name: Test real standard timers and GC cancellation
        if: matrix.lane == 'timer-gc' && github.repository == 'cpunion/llgo' && github.event.pull_request.base.ref == 'llvm-coro'
        env:
          LLGO_CORO_TIMER_GC_ACCEPTANCE: "1"
          LLGO_TEST_LLGO: /tmp/llgo-timer-gc
          LLGO_CORO_TIMER_GC_OUTPUT: /tmp/llgo-timer-gc-artifacts
        run: |
          go build -o "$LLGO_TEST_LLGO" ./cmd/llgo
          GOMAXPROCS=2 GOMEMLIMIT=2GiB go test ./internal/build -run '^TestCoro(TimerGC|GCObservationLink|ReflectHeaderGC)Acceptance$' -v -count=1 -timeout=25m

      - name: Record failed native timer environment
        if: failure() && matrix.lane == 'timer-gc'
        run: |
          mkdir -p /tmp/llgo-timer-gc-artifacts
          {
            go version
            llvm-config-${{ matrix.llvm }} --version
            dpkg-query -W libgc1 libgc-dev libc6
            sha256sum /tmp/llgo-timer-gc
            find /tmp/llgo-timer-gc-artifacts -type f -name timer -exec sha256sum {} \;
            find /tmp/llgo-timer-gc-artifacts -type f -name timer -exec ldd {} \;
          } > /tmp/llgo-timer-gc-artifacts/environment.txt 2>&1

      - name: Upload failed native timer images
        if: failure() && matrix.lane == 'timer-gc'
        uses: actions/upload-artifact@v7
        with:
          name: failed-native-timer-gc-llvm${{ matrix.llvm }}
          path: |
            /tmp/llgo-timer-gc
            /tmp/llgo-timer-gc-artifacts
          if-no-files-found: error
          retention-days: 7

      - name: Test real WASI timers and TinyGC cancellation
        if: matrix.lane == 'timer-gc-wasi' && github.repository == 'cpunion/llgo' && github.event.pull_request.base.ref == 'llvm-coro'
        env:
          LLGO_CORO_WASI_TIMER_GC_ACCEPTANCE: "1"
          LLGO_TEST_LLGO: /tmp/llgo-wasi-timer-gc
        run: |
          go build -o "$LLGO_TEST_LLGO" ./cmd/llgo
          GOMAXPROCS=2 GOMEMLIMIT=2GiB go test ./internal/build -run '^TestCoroWASITimerGCAcceptance$' -v -count=1 -timeout=25m

      - name: Test coroutine TLS function dispatch proof
        if: matrix.lane == 'compat'
        run: go test -v ./internal/build -run '^TestCoroTLS' -count=1

      - name: Test bounded optimized coroutine instructions and syscall identities
        if: matrix.lane == 'compat'
        run: |
          go test ./ssa -run '^TestVerifyCoroAtomicCostModule' -count=1
          (cd runtime && go test . -run '^TestDarwinInternalSyscall.*WorkerTargetsAreExact$' -count=1)

      - name: Test coroutine registry and control integration
        if: matrix.lane == 'compat'
        run: go test -v ./internal/build -run '^Test(CollectLinkedCoroRootAnchors|ActiveCoroABIVersions|BuildCoroPlanErrors|CoroProgramManifest.*|CoroProgramBootstrap.*|SelectCoroProgramBootstrap.*|GenMainModule.*Coro.*)$' -count=1

      - name: Test LLVM 22 tool configuration
        if: matrix.lane == 'compat'
        run: go test ./xtool/env/llvm ./internal/xtool/llvm

      - name: Test resolved LLVM target configuration
        if: matrix.lane == 'target-core'
        run: |
          go test ./internal/xtool/llvm -run '^TestGetTarget(Spec|Triple)$' -count=1
          go test ./internal/crosscompile -run '^Test(UseTarget|UseExportsResolvedLLVMConfig|ResolvedLLVMTargetSpecWASIThreads)$' -count=1
          go test ./internal/crosscompile -run '^TestMacOSSysroot' -count=1
          go test ./internal/cabi -run '^TestDevLTOGlobalDCETargetArchAndNewTransformerArchSelection$' -count=1
          go test -v ./ssa -run '^Test(ResolvedTargetConfig(|IsAuthoritativeAndFrozen)|TargetDataLegacyLayoutCompatibility|ResolvedPointerWidthMismatchFallsBack|NewProgramDefaultTargetCompatibility|ResolvedExternalBackendCompatibilityFallback|ResolvedTargetABINameControlsRISCVObject)$' -count=1
          go test ./internal/build -run '^Test(NewLLSSATargetUsesResolvedLLVMConfig|LLVMCPUAndFeaturesAffectBuildFingerprint|DefaultTargetKeepsLegacyCacheIdentity|NonDefaultLLVMFeaturesEnterCacheIdentity|ResolvedTargetCompatibilityAudit|WasmFrontendLayoutMatchesLLVM|BaremetalFrontendLayoutMatchesLLVM)$' -count=1

      - name: Check llgo-tag build
        if: matrix.lane == 'integration'
        run: go test -tags=llgo ./internal/coro

      - name: Vet coroutine analysis
        if: matrix.lane == 'integration'
        run: |
          go vet ./internal/coro ./internal/build ./cl/ssawrap ./internal/xtool/llvm ./internal/crosscompile ./internal/cabi
          # Vet the selected production LLGo runtime, not a nonexistent host-Go
          # runtime assembled without its compiler-owned bridges. Runtime
          # source-island tests above check the host adapters independently.
          (cd runtime && go vet ./internal/coro && go vet -unsafeptr=false -tags='llgo,llgo_coro,llgo_coro_native_pipe,llgo_coro_native_timer' ./internal/runtime)
          # The compiler package has a pre-existing unsafe.Pointer finding.
          # Disable only that analyzer and keep all other checks enabled.
          go vet -unsafeptr=false ./cl
          # The SSA package has pre-existing sync.Map copylocks findings. Keep
          # every other analyzer active while coroutine slices are integrated.
          go vet -copylocks=false ./ssa

  baremetal-timer:
    name: test Cortex-M standard timer host protocol (LLVM 22)
    if: github.repository == 'cpunion/llgo' && github.event.pull_request.base.ref == 'llvm-coro'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      LLGO_ROOT: ${{ github.workspace }}
      LLGO_CORO_BAREMETAL_ACCEPTANCE: "1"
      LLGO_TEST_LLGO: /tmp/llgo-baremetal
    steps:
      - uses: actions/checkout@v7
      - name: Install LLVM 22 and Cortex-M emulator
        run: |
          echo 'deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-22 main' | sudo tee /etc/apt/sources.list.d/llvm.list
          wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          sudo apt-get update
          sudo apt-get install --no-install-recommends llvm-22-dev clang-22 lld-22 libgc-dev qemu-system-arm
          echo '/usr/lib/llvm-22/bin' >> "$GITHUB_PATH"
      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          go-version: "1.27.0"
      - name: Validate physical layout and startup
        run: |
          go test ./internal/build -run '^(TestWasmFrontendLayoutMatchesLLVM|TestBaremetalFrontendLayoutMatchesLLVM)$' -count=1
          go test ./internal/targets -run '^TestBaremetal' -count=1
          (cd runtime && go test . -run '^TestFuncForPCCache' -count=1)
      - name: Build compiler and execute standard timers on Cortex-M
        run: |
          go build -o "$LLGO_TEST_LLGO" ./cmd/llgo
          go test ./internal/build -run '^TestCoroBaremetalTimerAcceptance$' -count=1 -v -timeout=12m
