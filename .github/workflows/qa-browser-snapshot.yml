name: Verify browser snapshot exit race
'on':
  push:
    branches:
    - codex/qa-browser-snapshot-20261023
permissions:
  contents: read
jobs:
  browser:
    permissions:
      contents: read
    name: wasm-browser-debug
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7
    - name: Install dependencies
      uses: ./.github/actions/setup-deps
      with:
        llvm-version: 22
    - name: Set up Emscripten
      uses: emscripten-core/setup-emsdk@v15
      with:
        version: 6.0.8
    - uses: actions/setup-node@v7
      with:
        node-version: '24'
    - name: Set up Chrome for Testing
      id: chrome
      uses: browser-actions/setup-chrome@v2
      with:
        chrome-version: 152.0.7977.54
        install-dependencies: true
    - uses: ./.github/actions/setup-binaryen
    - uses: ./.github/actions/setup-go
    - name: Install llgo
      run: dev/build_ci_tools.sh "$RUNNER_TEMP/llgo-bin"
    - name: Test real browser source breakpoints and paused variables
      env:
        LLGO: ${{ runner.temp }}/llgo-bin/llgo
        LLGO_BUILD_CACHE: '1'
        LLGO_BROWSER_CHROME: ${{ steps.chrome.outputs.chrome-path }}
        LLGO_BROWSER_CHROME_NO_SANDBOX: '1'
        LLGO_BROWSER_COVERAGE_DIR: coverage-browser
      run: python3 dev/test_wasm_browser_debug.py
