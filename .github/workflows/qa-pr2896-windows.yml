name: QA PR2896 Windows report
'on':
  push:
    branches:
    - codex/qa-pr2896-report-20261021
permissions:
  contents: read
jobs:
  report:
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Compare complete Windows report output
      shell: python {0}
      run: "import os, pathlib, shlex, subprocess, sys, time\nsource = pathlib.Path('.github/scripts/run_go_tests.py').read_text()\n\
        needle = '    print((output / f\"{suite}-times.txt\").read_text(encoding=\"\
        utf-8\"), end=\"\")'\nassert needle in source\nsource = source.replace(needle,\
        \ '    import faulthandler\\n    faulthandler.dump_traceback_later(30)\\n'\
        \ + needle)\nstreamed = source.replace(needle, '    with (output / f\"{suite}-times.txt\"\
        ).open(encoding=\"utf-8\") as timings:\\n        for line in timings:\\n \
        \           print(line, end=\"\", flush=True)')\nbase = pathlib.Path(os.environ['RUNNER_TEMP'])\n\
        bash = pathlib.Path(os.environ['ProgramFiles']) / 'Git' / 'bin' / 'bash.exe'\n\
        results = {}\nfor name, code in [('original',source),('streamed',streamed)]:\n\
        \    file = base / (name+'.py')\n    file.write_text(code)\n    command =\
        \ shlex.join([sys.executable.replace('\\\\','/'), file.as_posix(), '--output-dir',\
        \ (base/name).as_posix(), 'main', sys.executable.replace('\\\\','/'), '-c',\
        \ \"from pathlib import Path; import sys; sys.stdout.write(Path('.github/scripts/qa_report_events.jsonl').read_text())\"\
        ])\n    command += ' | tee '+shlex.quote((base/(name+'.log')).as_posix())\n\
        \    print('Starting report probe',name,flush=True)\n    process = subprocess.Popen([str(bash),'-c','set\
        \ -euo pipefail\\n'+command])\n    try:\n        status = process.wait(timeout=80)\n\
        \    except subprocess.TimeoutExpired:\n        print('REPORT PROBE TIMEOUT',name,flush=True)\n\
        \        subprocess.run(['taskkill','/F','/T','/PID',str(process.pid)],timeout=20)\n\
        \        status = 124\n    results[name] = status\n    print('REPORT PROBE\
        \ RESULT',name,status,flush=True)\nprint('RESULTS',results,flush=True)\nif\
        \ results['streamed'] != 0:\n    raise SystemExit(1)\n"
