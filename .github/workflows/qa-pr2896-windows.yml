name: QA PR2896 Windows
'on':
  push:
    branches:
    - codex/qa-pr2896-windows-20261021
permissions:
  contents: read
jobs:
  createtemp-stress:
    runs-on: windows-2022
    timeout-minutes: 45
    strategy:
      matrix:
        os:
        - windows-2022
        llvm:
        - 22
        windows_abi:
        - mingw
        windows_arch:
        - '386'
        host_go_arch:
        - x64
    steps:
    - uses: actions/checkout@v7
    - name: Install dependencies
      uses: ./.github/actions/setup-deps
      with:
        llvm-version: ${{matrix.llvm}}
        windows-abi: ${{ matrix.windows_abi || 'msvc' }}
        windows-arch: ${{ matrix.windows_arch || 'amd64' }}
    - name: Setup demo dependencies
      uses: ./.github/actions/setup-demo-deps
      with:
        windows-abi: ${{ matrix.windows_abi || 'msvc' }}
        windows-arch: ${{ matrix.windows_arch || 'amd64' }}
        install-lldb-python: 'true'
    - name: Set up Go for build
      uses: ./.github/actions/setup-go
      with:
        architecture: ${{ matrix.host_go_arch || '' }}
    - name: Build LLGo and test tools
      shell: bash
      run: 'dev/build_ci_tools.sh "$RUNNER_TEMP/llgo-bin"

        echo "$RUNNER_TEMP/llgo-bin" >> "$GITHUB_PATH"

        echo "LLGO_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

        '
    - name: Activate native Windows target
      if: runner.os == 'Windows'
      uses: ./.github/actions/activate-windows-target
      with:
        windows-abi: ${{ matrix.windows_abi }}
        windows-arch: ${{ matrix.windows_arch }}
    - name: Build concurrent temporary-file regression
      shell: bash
      run: 'cd _demo/go/createtemp-1654

        GOTOOLCHAIN=local GOWORK=off llgo build -p=1 -o "$RUNNER_TEMP/createtemp-stress.exe"
        .

        '
    - name: Repeat concurrent temporary-file regression
      shell: python {0}
      run: "import os, pathlib, subprocess, time\nexe = pathlib.Path(os.environ['RUNNER_TEMP'])\
        \ / 'createtemp-stress.exe'\nfor iteration in range(1, 11):\n    started =\
        \ time.monotonic()\n    print(f'Starting createtemp repeat {iteration}/10',\
        \ flush=True)\n    process = subprocess.Popen([str(exe)])\n    try:\n    \
        \    status = process.wait(timeout=120)\n    except subprocess.TimeoutExpired:\n\
        \        print(f'createtemp repeat {iteration} timed out; PID {process.pid}',\
        \ flush=True)\n        lldb = os.environ.get('LLGO_LLDB')\n        if lldb:\n\
        \            debug_env = os.environ.copy()\n            prefix = debug_env.get('LLGO_WINDOWS_LLDB_PYTHON_HOME')\n\
        \            if prefix:\n                debug_env['PYTHONHOME'] = prefix\n\
        \                debug_env['PATH'] = str(pathlib.Path(prefix) / 'bin') + os.pathsep\
        \ + debug_env['PATH']\n            if debug_env.get('LLGO_WINDOWS_LLDB_PYTHONPATH'):\n\
        \                debug_env['PYTHONPATH'] = debug_env['LLGO_WINDOWS_LLDB_PYTHONPATH']\n\
        \            try:\n                subprocess.run([lldb, '--batch', '-o',\
        \ f'process attach --pid {process.pid}', '-o', 'thread backtrace all', '-o',\
        \ 'process detach'], env=debug_env, timeout=45)\n            except subprocess.TimeoutExpired:\n\
        \                print('LLDB attach also timed out', flush=True)\n       \
        \ process.kill()\n        process.wait()\n        raise SystemExit(1)\n  \
        \  print(f'Finished repeat {iteration}: {time.monotonic()-started:.1f}s, exit\
        \ {status}', flush=True)\n    if status:\n        raise SystemExit(status)\n"
