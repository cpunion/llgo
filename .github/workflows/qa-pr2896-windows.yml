name: QA PR2896 Windows
'on':
  push:
    branches:
    - codex/qa-pr2896-main-20261021
permissions:
  contents: read
jobs:
  main-suite:
    permissions:
      contents: read
      id-token: write
    runs-on: windows-2022
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os:
        - windows-2022
        llvm:
        - 22
        windows_abi:
        - mingw
    steps:
    - uses: actions/checkout@v7
    - name: Install dependencies
      uses: ./.github/actions/setup-deps
      with:
        llvm-version: ${{matrix.llvm}}
        windows-abi: ${{ matrix.windows_abi || 'msvc' }}
    - name: Install embedded dependencies
      uses: ./.github/actions/setup-embed-deps
    - name: Set up Go
      uses: ./.github/actions/setup-go
    - name: Install further optional dependencies for demos
      uses: ./.github/actions/setup-demo-deps
      with:
        windows-abi: ${{ matrix.windows_abi || 'msvc' }}
    - name: Set LLGO_ROOT
      shell: bash
      run: echo "LLGO_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
    - name: Build
      shell: bash
      run: 'set -euo pipefail

        go build -v ./...

        '
    - name: Prepare the Windows host Go test runtime
      if: runner.os == 'Windows'
      id: windows_go_runtime
      shell: python {0}
      run: 'import runpy

        runpy.run_path(''dev/prepare_windows_go_test_runtime.py'', run_name=''__main__'')

        '
    - name: Run main batch with a process snapshot on timeout
      shell: python {0}
      env:
        LLGO_STDIO_NOBUF: '1'
      run: "import os, pathlib, subprocess, time\ncommand = r\"\"\"set -euo pipefail\n\
        go list ./... | grep -v '^github.com/xgo-dev/llgo/test/go$' | grep -v '^github.com/xgo-dev/llgo/cl$'\
        \ | grep -v '^github.com/xgo-dev/llgo/internal/build$' | xargs bash dev/go_test_windows.sh\
        \ python .github/scripts/run_go_tests.py main go test -json '-ldflags=-linkmode=external\
        \ -extldflags=-lsynchronization' -timeout 20m -coverprofile=coverage-main.txt\
        \ -covermode=set -coverpkg=./... -bench '^BenchmarkGo126' -benchtime=1x\n\
        printf 'Main batch returned successfully\\n'\n\"\"\"\nstarted = time.monotonic()\n\
        process = subprocess.Popen(['bash', '-c', command])\ntry:\n    status = process.wait(timeout=1500)\n\
        except subprocess.TimeoutExpired:\n    print('Main batch timeout after 25\
        \ minutes; capturing remaining processes', flush=True)\n    subprocess.run(['powershell',\
        \ '-NoProfile', '-Command', 'Get-CimInstance Win32_Process | Where-Object\
        \ {$_.Name -match \"go|python|bash|tee|clang|link|test|debug|chrome\"} | Select-Object\
        \ ProcessId,ParentProcessId,Name,CommandLine | Format-List'], timeout=30)\n\
        \    subprocess.run(['taskkill', '/F', '/T', '/PID', str(process.pid)], timeout=30)\n\
        \    raise SystemExit(1)\nprint(f'Main batch elapsed {time.monotonic()-started:.1f}s,\
        \ exit {status}', flush=True)\nraise SystemExit(status)\n"
