name: QA PR2896 Windows
'on':
  push:
    branches:
    - codex/qa-pr2896-gc-seh-20261021
permissions:
  contents: read
jobs:
  gc-seh:
    runs-on: windows-2022
    timeout-minutes: 45
    strategy:
      matrix:
        os:
        - windows-2022
        llvm:
        - 22
        windows_abi:
        - mingw
        windows_arch:
        - '386'
        host_go_arch:
        - x64
    steps:
    - uses: actions/checkout@v7
    - name: Install dependencies
      uses: ./.github/actions/setup-deps
      with:
        llvm-version: ${{matrix.llvm}}
        windows-abi: ${{ matrix.windows_abi || 'msvc' }}
        windows-arch: ${{ matrix.windows_arch || 'amd64' }}
    - name: Setup demo dependencies
      uses: ./.github/actions/setup-demo-deps
      with:
        windows-abi: ${{ matrix.windows_abi || 'msvc' }}
        windows-arch: ${{ matrix.windows_arch || 'amd64' }}
        install-lldb-python: 'true'
    - name: Set up Go for build
      uses: ./.github/actions/setup-go
      with:
        architecture: ${{ matrix.host_go_arch || '' }}
    - name: Build LLGo and test tools
      shell: bash
      run: 'dev/build_ci_tools.sh "$RUNNER_TEMP/llgo-bin"

        echo "$RUNNER_TEMP/llgo-bin" >> "$GITHUB_PATH"

        echo "LLGO_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

        '
    - name: Activate native Windows target
      if: runner.os == 'Windows'
      uses: ./.github/actions/activate-windows-target
      with:
        windows-abi: ${{ matrix.windows_abi }}
        windows-arch: ${{ matrix.windows_arch }}
    - name: Build concurrent temporary-file regression
      shell: bash
      run: 'cd _demo/go/createtemp-1654

        GOTOOLCHAIN=local GOWORK=off llgo build -p=1 -o "$RUNNER_TEMP/createtemp-stress.exe"
        .

        '
    - name: Reproduce GC collection with a locked process heap
      shell: python {0}
      run: "import os,pathlib,subprocess\nroot=pathlib.Path(os.environ['RUNNER_TEMP'])\n\
        cc=pathlib.Path(os.environ['LLGO_MINGW_TARGET_BIN'])/'i686-w64-mingw32-clang.exe'\n\
        prefix=pathlib.Path(os.environ['LLGO_MINGW_TARGET_VCPKG_ROOT'])\nexe=root/'bdwgc-heap-lock.exe'\n\
        subprocess.run([str(cc),'-O2','.github/windows/test-bdwgc-heap-lock.c','-I'+str(prefix/'include'),'-L'+str(prefix/'lib'),'-lgc','-o',str(exe)],check=True)\n\
        try:\n    result=subprocess.run([str(exe)],timeout=20)\n    print('BASELINE\
        \ HEAP PROBE RESULT',result.returncode,flush=True)\nexcept subprocess.TimeoutExpired:\n\
        \    print('BASELINE HEAP PROBE RESULT timed out as expected for signal-based\
        \ scanning',flush=True)\n"
    - name: Build and validate SEH-based BDWGC
      shell: python {0}
      run: "import hashlib,os,pathlib,shutil,subprocess,tarfile,urllib.request\nroot=pathlib.Path(os.environ['RUNNER_TEMP'])\n\
        archive=root/'bdwgc-8.2.12.tar.gz'\nwith urllib.request.urlopen('https://github.com/bdwgc/bdwgc/archive/refs/tags/v8.2.12.tar.gz',timeout=60)\
        \ as response:\n    archive.write_bytes(response.read())\nexpected='514824d4171374bb0f3211c79732dd84cb3af44f515b2fb51b7fa339a5194ba653cc93f1d56d9da202c959f2f9ee451f0d0c67da42d0b0531a9c749da91a30a0'\n\
        assert hashlib.sha512(archive.read_bytes()).hexdigest()==expected\nwith tarfile.open(archive)\
        \ as tar: tar.extractall(root,filter='data')\nsource=root/'bdwgc-8.2.12';\
        \ build=root/'bdwgc-seh-build'\npatch=pathlib.Path('.github/windows/bdwgc-clang-seh.patch').resolve()\n\
        subprocess.run(['git','apply','--check',str(patch)],cwd=source,check=True)\n\
        subprocess.run(['git','apply',str(patch)],cwd=source,check=True)\nbin=pathlib.Path(os.environ['LLGO_MINGW_TARGET_BIN'])\n\
        prefix=pathlib.Path(os.environ['LLGO_MINGW_TARGET_VCPKG_ROOT'])\nsubprocess.run(['cmake','-S',str(source),'-B',str(build),'-G','Ninja','-DCMAKE_BUILD_TYPE=Release','-DCMAKE_C_COMPILER='+str(bin/'i686-w64-mingw32-clang.exe'),'-DCMAKE_CXX_COMPILER='+str(bin/'i686-w64-mingw32-clang++.exe'),'-DCFLAGS_EXTRA=-I'+(prefix/'include').as_posix(),'-Denable_docs=OFF','-Denable_cplusplus=OFF','-Dbuild_cord=OFF','-Dbuild_tests=ON'],check=True)\n\
        subprocess.run(['cmake','--build',str(build),'--target','gc','gctest','--parallel','4'],check=True)\n\
        dlls=list(build.rglob('libgc.dll'));assert len(dlls)==1,dlls\nshutil.copy2(dlls[0],root/'libgc.dll')\n\
        subprocess.run([str(root/'bdwgc-heap-lock.exe')],timeout=20,check=True)\n\
        print('PATCHED HEAP PROBE PASSED',flush=True)\nsubprocess.run([str(build/'gctest.exe')],timeout=300,check=True)\n\
        print('BDWGC GCTEST PASSED',flush=True)\n"
    - name: Repeat concurrent temporary-file regression
      shell: python {0}
      run: "import os, pathlib, subprocess, time, runpy, shutil\nexe = pathlib.Path(os.environ['RUNNER_TEMP'])\
        \ / 'createtemp-stress.exe'\nfor iteration in range(1, 31):\n    started =\
        \ time.monotonic()\n    print(f'Starting createtemp repeat {iteration}/30',\
        \ flush=True)\n    process = subprocess.Popen([str(exe)])\n    try:\n    \
        \    status = process.wait(timeout=120)\n    except subprocess.TimeoutExpired:\n\
        \        print(f'createtemp repeat {iteration} timed out; PID {process.pid}',\
        \ flush=True)\n        directory = pathlib.Path(os.environ['RUNNER_TEMP'])\
        \ / 'createtemp-artifacts'\n        directory.mkdir(exist_ok=True)\n     \
        \   shutil.copy2(exe, directory / exe.name)\n        runpy.run_path('.github/scripts/qa_windows_stacks.py')['capture'](process.pid,\
        \ directory)\n        os.environ['QA_PID'] = str(process.pid)\n        os.environ['QA_DIRECTORY']\
        \ = str(directory)\n        subprocess.run(['powershell', '-NoProfile', '-Command',\
        \ \"Get-Process -Id $env:QA_PID | Select-Object -ExpandProperty Modules |\
        \ Select-Object ModuleName,FileName,@{Name='BaseAddress';Expression={$_.BaseAddress.ToInt64()}}\
        \ | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $env:QA_DIRECTORY\
        \ 'modules.json')\"], timeout=30)\n        with (directory / 'symbols.txt').open('w')\
        \ as symbols:\n            subprocess.run(['llvm-nm', '--numeric-sort', str(exe)],\
        \ stdout=symbols, timeout=30)\n        process.kill()\n        process.wait()\n\
        \        raise SystemExit(1)\n    print(f'Finished repeat {iteration}: {time.monotonic()-started:.1f}s,\
        \ exit {status}', flush=True)\n    if status:\n        raise SystemExit(status)\n"
    - name: Upload hung-process evidence
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: windows-386-createtemp-hang
        path: ${{ runner.temp }}/createtemp-artifacts
        if-no-files-found: ignore
        retention-days: 3
