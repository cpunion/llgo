name: QA PR2896 Windows
'on':
  push:
    branches:
    - codex/qa-pr2896-windows-20261021
permissions:
  contents: read
jobs:
  build-suite:
    permissions:
      contents: read
      id-token: write
    runs-on: windows-2022
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os:
        - windows-2022
        llvm:
        - 22
        windows_abi:
        - mingw
    steps:
    - uses: actions/checkout@v7
    - name: Install dependencies
      uses: ./.github/actions/setup-deps
      with:
        llvm-version: ${{matrix.llvm}}
        windows-abi: ${{ matrix.windows_abi || 'msvc' }}
    - name: Install embedded dependencies
      uses: ./.github/actions/setup-embed-deps
    - name: Set up Go
      uses: ./.github/actions/setup-go
    - name: Install further optional dependencies for demos
      uses: ./.github/actions/setup-demo-deps
      with:
        windows-abi: ${{ matrix.windows_abi || 'msvc' }}
    - name: Set LLGO_ROOT
      shell: bash
      run: echo "LLGO_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
    - name: Build
      shell: bash
      run: 'set -euo pipefail

        go build -v ./...

        '
    - name: Prepare the Windows host Go test runtime
      if: runner.os == 'Windows'
      id: windows_go_runtime
      shell: python {0}
      run: 'import runpy

        runpy.run_path(''dev/prepare_windows_go_test_runtime.py'', run_name=''__main__'')

        '
    - name: Probe Windows build-suite compilation
      shell: bash
      env:
        LLGO_GO_TEST_OVERLAY: ${{ steps.windows_go_runtime.outputs.overlay }}
      run: "set -euo pipefail\npython -u - <<'PYPROBE'\nimport os, subprocess, time\ncmd=['go','test','-x','-json','-ldflags=-linkmode=external\
        \ -extldflags=-lsynchronization','-run','^TestConfigCloneDoesNotAliasInput$','-timeout=2m','-coverpkg=./...','-coverprofile=qa-probe.txt','-covermode=set','./internal/build']\n\
        if os.environ.get('LLGO_GO_TEST_OVERLAY'): cmd.insert(4,'-overlay='+os.environ['LLGO_GO_TEST_OVERLAY'])\nprint('QA compile probe:',cmd,flush=True)\n\
        started=time.monotonic()\ntry:\n r=subprocess.run(cmd,timeout=900)\nexcept subprocess.TimeoutExpired:\n subprocess.run(['powershell','-NoProfile','-Command','Get-CimInstance\
        \ Win32_Process | Where-Object {$_.Name -match \"go|clang|link|build.test\"} | Select-Object ProcessId,ParentProcessId,Name,CommandLine\
        \ | Format-List'])\n raise\nprint('QA compile seconds:',time.monotonic()-started,flush=True)\nraise SystemExit(r.returncode)\nPYPROBE\n"
    - name: Run Windows build suite with live output
      shell: bash
      env:
        LLGO_GO_TEST_OVERLAY: ${{ steps.windows_go_runtime.outputs.overlay }}
      run: 'set -euo pipefail

        args=(go test -json ''-ldflags=-linkmode=external -extldflags=-lsynchronization'')

        if [[ -n "$LLGO_GO_TEST_OVERLAY" ]]; then args+=("-overlay=$LLGO_GO_TEST_OVERLAY"); fi

        python -u .github/scripts/run_go_tests.py build "${args[@]}" -count=1 -timeout=35m -coverpkg=./... -coverprofile=qa-build.txt -covermode=set
        ./internal/build

        '
  demos-x86:
    runs-on: windows-2022
    timeout-minutes: 45
    strategy:
      matrix:
        os:
        - windows-2022
        llvm:
        - 22
        windows_abi:
        - mingw
        windows_arch:
        - '386'
        host_go_arch:
        - x64
    steps:
    - uses: actions/checkout@v7
    - name: Install dependencies
      uses: ./.github/actions/setup-deps
      with:
        llvm-version: ${{matrix.llvm}}
        windows-abi: ${{ matrix.windows_abi || 'msvc' }}
        windows-arch: ${{ matrix.windows_arch || 'amd64' }}
    - name: Setup demo dependencies
      uses: ./.github/actions/setup-demo-deps
      with:
        windows-abi: ${{ matrix.windows_abi || 'msvc' }}
        windows-arch: ${{ matrix.windows_arch || 'amd64' }}
        install-lldb-python: 'true'
    - name: Set up Go for build
      uses: ./.github/actions/setup-go
      with:
        architecture: ${{ matrix.host_go_arch || '' }}
    - name: Build LLGo and test tools
      shell: bash
      run: 'dev/build_ci_tools.sh "$RUNNER_TEMP/llgo-bin"

        echo "$RUNNER_TEMP/llgo-bin" >> "$GITHUB_PATH"

        echo "LLGO_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

        '
    - name: Activate native Windows target
      if: runner.os == 'Windows'
      uses: ./.github/actions/activate-windows-target
      with:
        windows-abi: ${{ matrix.windows_abi }}
        windows-arch: ${{ matrix.windows_arch }}
    - name: Run demos with live case progress
      shell: bash
      timeout-minutes: 18
      run: bash .github/workflows/test_demo.sh
