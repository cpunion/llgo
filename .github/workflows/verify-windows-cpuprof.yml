name: Diagnose Windows ARM64 goroot

on:
  push:
    branches: [codex/verify-windows-cpuprof-20260906]

permissions:
  contents: read

jobs:
  goroot:
    runs-on: windows-11-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-deps
        with:
          llvm-version: "22"
          windows-abi: msvc
          windows-arch: arm64
      - uses: ./.github/actions/setup-demo-deps
        with:
          windows-abi: msvc
          windows-arch: arm64
      - uses: ./.github/actions/setup-go
        with:
          go-version: "1.27.0"
          architecture: x64
      - name: Build LLGo test tools
        shell: bash
        run: |
          set -euo pipefail
          dev/build_ci_tools.sh "$RUNNER_TEMP/llgo-bin"
          echo "$RUNNER_TEMP/llgo-bin" >> "$GITHUB_PATH"
          echo "LLGO_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
      - uses: ./.github/actions/activate-windows-target
        with:
          windows-abi: msvc
          windows-arch: arm64
      - name: Run goroot package with per-test output
        timeout-minutes: 22
        shell: bash
        env:
          LLGO: ${{ runner.temp }}/llgo-bin/llgo.exe
          LLGO_BUILD_CACHE: "1"
          LLGO_TEST_VERBOSE: "1"
          LLGO_TEST_JOBS: "1"
        run: dev/test_go_version.sh 1.27 ./test/goroot
