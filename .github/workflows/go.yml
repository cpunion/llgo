name: Compat 111 native replay
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows386:
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      GOMAXPROCS: '4'
      GOFLAGS: '-p=2'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-deps
        with:
          llvm-version: '22'
          windows-abi: msvc
          windows-arch: '386'
          windows-msvc-dependencies: runtime
      - uses: ./.github/actions/setup-go
      - name: Build host compiler
        shell: pwsh
        run: |
          go build -o "$env:RUNNER_TEMP/compat111-llgo.exe" ./cmd/llgo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "LLGO_TEST_LLGO=$env:RUNNER_TEMP/compat111-llgo.exe" >> $env:GITHUB_ENV
          "LLGO_ROOT=$env:GITHUB_WORKSPACE" >> $env:GITHUB_ENV
      - uses: ./.github/actions/activate-windows-target
        with:
          windows-abi: msvc
          windows-arch: '386'
      - name: Replay reported cases and measure reflect progress
        shell: bash
        run: python3 .github/scripts/compat111_repro.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: compat111-windows-msvc-386
          path: .compat111
