name: PR2651 Windows environment check

on:
  push:
    branches: [codex/pr2651-windows-ci-20261011]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pixi:
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
        working-directory: llgo dev
    steps:
      - uses: actions/checkout@v7
        with:
          path: llgo dev
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.81.0
          working-directory: llgo dev/dev
          locked: true
      - name: Record compiler flags
        run: pixi run --manifest-path dev/pixi.toml --locked pwsh -NoProfile -Command '[ordered]@{CFLAGS=$env:CFLAGS; CPPFLAGS=$env:CPPFLAGS; CGO_CPPFLAGS=$env:CGO_CPPFLAGS} | ConvertTo-Json'
      - name: Check native dependency flags
        run: |
          pixi run --manifest-path dev/pixi.toml --locked pkgconf --cflags bdw-gc libffi openssl sqlite3 libuv zlib
          pixi run --manifest-path dev/pixi.toml --locked pkgconf --libs bdw-gc libffi openssl sqlite3 libuv zlib
      - name: Run the full environment checks
        run: pixi run --manifest-path dev/pixi.toml --locked pwsh -File dev/check_devenv.ps1
  mise:
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
        working-directory: llgo dev
    steps:
      - uses: actions/checkout@v7
        with:
          path: llgo dev
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.10.7
          install_args: --locked
          working_directory: llgo dev/dev
          env: true
          export_path: true
      - name: Inspect native library prefixes
        run: |
          pkgconf --libs bdw-gc libffi
          pkgconf --dont-define-prefix --libs bdw-gc libffi
          pkgconf --dont-relocate-paths --libs bdw-gc libffi
          pkg-config --libs bdw-gc libffi
          foreach ($directory in ($env:PKG_CONFIG_PATH -split ';' | Where-Object { $_ })) {
            foreach ($name in @('bdw-gc.pc', 'libffi.pc')) {
              $file = Join-Path $directory $name
              if (Test-Path -LiteralPath $file) { Get-Content -LiteralPath $file }
            }
          }
      - name: Run the full environment checks
        run: .\dev\check_devenv.ps1
