name: "Setup LLGO Dependencies"
description: "Install all required dependencies for LLGO"
inputs:
  llvm-version:
    description: "LLVM version to install"
    required: true
    default: "19"
  install-llvm:
    description: "Whether to install LLVM"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Set up Windows LLVM environment
      if: runner.os == 'Windows'
      id: msys2
      uses: msys2/setup-msys2@v2
      with:
        msystem: CLANG64
        path-type: inherit
        update: true

    - name: Install Windows dependencies
      if: runner.os == 'Windows'
      shell: msys2 {0}
      env:
        LLVM_VERSION: "19.1.7"
        MSYS2_LLVM_PACKAGE_VERSION: "19.1.7-1"
        MSYS2_LIBUV_PACKAGE_VERSION: "1.52.1-1"
        MSYS2_GC_PACKAGE_VERSION: "8.2.12-1"
        MSYS2_LIBATOMIC_OPS_PACKAGE_VERSION: "7.10.0-1"
        MSYS2_CJSON_PACKAGE_VERSION: "1.7.19-1"
      run: |
        set -euo pipefail

        if [[ "${{ inputs.llvm-version }}" != 19 ]]; then
          echo "Windows CI currently pins LLVM 19, got ${{ inputs.llvm-version }}" >&2
          exit 1
        fi

        repo=https://repo.msys2.org/mingw/clang64
        prefix=mingw-w64-clang-x86_64
        packages=(
          "clang-$MSYS2_LLVM_PACKAGE_VERSION"
          "clang-libs-$MSYS2_LLVM_PACKAGE_VERSION"
          "compiler-rt-$MSYS2_LLVM_PACKAGE_VERSION"
          "llvm-$MSYS2_LLVM_PACKAGE_VERSION"
          "llvm-libs-$MSYS2_LLVM_PACKAGE_VERSION"
          "lld-$MSYS2_LLVM_PACKAGE_VERSION"
          "libc++-$MSYS2_LLVM_PACKAGE_VERSION"
          "libunwind-$MSYS2_LLVM_PACKAGE_VERSION"
          "gettext-runtime-0.22.5-2"
          "libffi-3.4.6-1"
          "libiconv-1.17-4"
          "libxml2-2.12.9-2"
          "xz-5.6.3-3"
          "zlib-1.3.1-1"
          "zstd-1.5.6-2"
          "libuv-$MSYS2_LIBUV_PACKAGE_VERSION"
          "gc-$MSYS2_GC_PACKAGE_VERSION"
          "libatomic_ops-$MSYS2_LIBATOMIC_OPS_PACKAGE_VERSION"
          "cjson-$MSYS2_CJSON_PACKAGE_VERSION"
        )
        urls=()
        for package in "${packages[@]}"; do
          urls+=("$repo/$prefix-$package-any.pkg.tar.zst")
        done

        # MSYS2 renamed the compiler-runtime virtual dependency from gcc-libs
        # to cc-libs after these LLVM 19 packages were archived. libc++ 19
        # still provides the required runtime, so satisfy only this metadata
        # rename instead of upgrading the pinned compiler or disabling all
        # dependency checks.
        assumed_cc_runtime="$prefix-cc-libs=$LLVM_VERSION"
        pacman --noconfirm -U \
          --assume-installed "$assumed_cc_runtime" \
          "${urls[@]}"

        for package in clang clang-libs compiler-rt llvm llvm-libs lld libc++ libunwind; do
          installed="$(pacman -Q "$prefix-$package" | awk '{print $2}')"
          if [[ "$installed" != "$MSYS2_LLVM_PACKAGE_VERSION" ]]; then
            echo "expected $package $MSYS2_LLVM_PACKAGE_VERSION, got $installed" >&2
            exit 1
          fi
        done
        for package_version in \
          "libuv:$MSYS2_LIBUV_PACKAGE_VERSION" \
          "gc:$MSYS2_GC_PACKAGE_VERSION" \
          "libatomic_ops:$MSYS2_LIBATOMIC_OPS_PACKAGE_VERSION" \
          "cjson:$MSYS2_CJSON_PACKAGE_VERSION"; do
          package="${package_version%%:*}"
          expected="${package_version#*:}"
          installed="$(pacman -Q "$prefix-$package" | awk '{print $2}')"
          if [[ "$installed" != "$expected" ]]; then
            echo "expected $package $expected, got $installed" >&2
            exit 1
          fi
        done

        # Hosted runtime timers use libuv. pkgconf supplies the installation
        # path while the resulting COFF archive is linked with the MSVC ABI.
        pacman --noconfirm -S --needed \
          --assume-installed "$assumed_cc_runtime" \
          "$prefix-pkgconf" \
          "$prefix-ninja" \
          "$prefix-sqlite3" \
          make

    - name: Configure Windows compiler environment
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
      run: |
        $ErrorActionPreference = "Stop"

        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        $installPath = & $vswhere -latest -products * `
          -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
          -property installationPath
        if (-not $installPath) {
          throw "Visual Studio C++ tools were not found"
        }
        Import-Module "$installPath\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
        Enter-VsDevShell -VsInstallPath $installPath `
          -SkipAutomaticLocation `
          -DevCmdArguments "-arch=x64 -host_arch=x64"

        # Clang targets the MSVC ABI, but it relies on Visual Studio's SDK and
        # CRT search variables. Persist only the toolchain variables required
        # by later matrix steps instead of exporting the whole mutable shell.
        foreach ($name in @(
          "INCLUDE",
          "LIB",
          "LIBPATH",
          "UCRTVersion",
          "UniversalCRTSdkDir",
          "VCINSTALLDIR",
          "VCToolsInstallDir",
          "WindowsSdkDir",
          "WindowsSDKVersion"
        )) {
          $value = [Environment]::GetEnvironmentVariable($name)
          if ($value) {
            Add-Content -Encoding utf8 $env:GITHUB_ENV "$name=$value"
          }
        }

        $clangBin = Join-Path $env:MSYS2_LOCATION "clang64\bin"
        $clangExe = Join-Path $clangBin "clang.exe"
        if (-not (Test-Path $clangExe)) {
          throw "LLVM 19 clang was not found at $clangExe"
        }
        Add-Content -Encoding utf8 $env:GITHUB_PATH $clangBin
        # WAMR's host-side Windows test runner is built with MSVC. LLGo itself
        # remains pinned to LLVM 19 by CC and CXX below.
        Add-Content -Encoding utf8 $env:GITHUB_PATH (Split-Path (Get-Command cl.exe).Source)
        Add-Content -Encoding utf8 $env:GITHUB_ENV "CC=$clangExe"
        Add-Content -Encoding utf8 $env:GITHUB_ENV "CXX=$(Join-Path $clangBin 'clang++.exe')"
        Add-Content -Encoding utf8 $env:GITHUB_ENV "CGO_ENABLED=1"
        Add-Content -Encoding utf8 $env:GITHUB_ENV "LLGO_LLVM_VERSION=19.1.7"
        Add-Content -Encoding utf8 $env:GITHUB_ENV "LLGO_MSYS2_LOCATION=$env:MSYS2_LOCATION"

        # MSYS2 packages compiler-rt as a GNU-named COFF archive, whereas
        # Clang's MSVC driver searches the target-specific MSVC layout. Both
        # names refer to the same archive; provide the expected layout without
        # changing the selected ABI or linker.
        $resourceDir = (& $clangExe -print-resource-dir).Trim()
        $gnuBuiltins = Join-Path $resourceDir "lib\windows\libclang_rt.builtins-x86_64.a"
        if (-not (Test-Path $gnuBuiltins)) {
          throw "LLVM 19 compiler-rt archive was not found at $gnuBuiltins"
        }
        $msvcRuntimeDir = Join-Path $resourceDir "lib\x86_64-pc-windows-msvc"
        New-Item -ItemType Directory -Force $msvcRuntimeDir | Out-Null
        Copy-Item -Force $gnuBuiltins (Join-Path $msvcRuntimeDir "clang_rt.builtins.lib")

    - name: Configure Windows CGO flags
      if: runner.os == 'Windows'
      shell: msys2 {0}
      run: |
        set -euo pipefail

        llvm_version="$(llvm-config --version)"
        if [[ "$llvm_version" != 19.1.7 ]]; then
          echo "expected LLVM 19.1.7, got $llvm_version" >&2
          exit 1
        fi
        cflags="$(llvm-config --cflags)"
        ldflags="$(llvm-config --ldflags --libs all --system-libs)"
        # llvm-config.exe already returns native absolute paths even when it
        # is invoked from the MSYS2 shell. Rewriting the /clang64 substring
        # would duplicate the drive prefix (for example D:/...D:/...).
        # llvm-config emits the library search path and library names on
        # separate lines. GITHUB_ENV treats a continuation line as a new file
        # command, so flatten whitespace before exporting the CGO flag lists.
        cflags="${cflags//$'\r'/}"
        cflags="${cflags//$'\n'/ }"
        ldflags="${ldflags//$'\r'/}"
        ldflags="${ldflags//$'\n'/ }"

        # Keep LLVM's host-only flags scoped to github.com/xgo-dev/llvm via
        # its Windows pkg-config directive. Global CGO_* flags also affect
        # unrelated packages and leak into programs compiled by LLGo.
        # Keep generated pkg-config metadata in one LLGo-owned directory.
        # actions/setup-python may replace PKG_CONFIG_PATH later; the demo
        # setup action re-adds this same directory after Python is installed.
        pc_dir="$(cygpath -u "$RUNNER_TEMP")/llgo-pkgconfig"
        mkdir -p "$pc_dir"
        printf '%s\n' \
          'Name: LLVM 19' \
          'Description: LLVM 19 host compiler and linker flags' \
          "Version: $llvm_version" \
          "Cflags: $cflags" \
          "Libs: $ldflags" \
          > "$pc_dir/llvm-19.pc"
        pc_dir_native="$(cygpath -m "$pc_dir")"
        echo "PKG_CONFIG_PATH=$pc_dir_native${PKG_CONFIG_PATH:+;$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
        clang --version

    - name: Install macOS dependencies
      if: runner.os == 'macOS'
      shell: bash
      env:
        HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1
      run: |
        brew update
        
        # Install LLVM if requested
        if [[ "${{ inputs.install-llvm }}" == "true" ]]; then
          llvm_formula="llvm@${{inputs.llvm-version}}"
          lld_formula="lld@${{inputs.llvm-version}}"

          # GitHub macOS runners may pre-link another LLVM/LLD version (for example llvm@18),
          # which makes lld@<target> fail during Homebrew's automatic link step.
          while IFS= read -r formula; do
            case "${formula}" in
              llvm|llvm@*|lld|lld@*)
                if [[ "${formula}" != "${llvm_formula}" && "${formula}" != "${lld_formula}" ]]; then
                  brew unlink "${formula}" || true
                fi
                ;;
            esac
          done < <(brew list --formula)

          brew install "${llvm_formula}" "${lld_formula}"
          brew link --force --overwrite "${llvm_formula}" "${lld_formula}"
          llvm_bin="$(brew --prefix "${llvm_formula}")/bin"
          lld_bin="$(brew --prefix "${lld_formula}")/bin"
          echo "${llvm_bin}" >> "$GITHUB_PATH"

          # Print resolved toolchain versions for CI diagnostics.
          echo "LLVM/LLD versions:"
          brew list --versions "${llvm_formula}" "${lld_formula}"
          clang_version="$("${llvm_bin}/clang" --version | head -n 1)"
          lld_version="$("${lld_bin}/ld.lld" --version | head -n 1)"
          echo "clang: ${clang_version}"
          echo "ld.lld: ${lld_version}"
          echo "linked ld.lld path: $(command -v ld.lld || true)"
        fi
        
        # Install common dependencies
        brew install bdw-gc openssl libffi libuv
        brew link --overwrite libffi

        # Install optional deps for demos.
        #
        # NOTE: Keep this list updated as new deps are introduced.
        opt_deps=(
          cjson       # for github.com/goplus/lib/c/cjson
          sqlite      # for github.com/goplus/lib/c/sqlite
        )
        brew install "${opt_deps[@]}"
        
        brew install python@3.12 || true # for github.com/goplus/lib/py
        brew link --overwrite python@3.12

    - name: Install Ubuntu dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        # Install LLVM if requested
        if [[ "${{ inputs.install-llvm }}" == "true" ]]; then
          echo "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-${{inputs.llvm-version}} main" | sudo tee /etc/apt/sources.list.d/llvm.list
          wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          sudo apt-get update
          sudo apt-get install -y llvm-${{inputs.llvm-version}}-dev clang-${{inputs.llvm-version}} libclang-${{inputs.llvm-version}}-dev lld-${{inputs.llvm-version}} libunwind-${{inputs.llvm-version}}-dev libc++-${{inputs.llvm-version}}-dev
          echo "PATH=/usr/lib/llvm-${{inputs.llvm-version}}/bin:$PATH" >> $GITHUB_ENV
        else
          sudo apt-get update
        fi
        
        # Install common dependencies
        sudo apt-get install -y pkg-config libgc-dev libssl-dev zlib1g-dev libffi-dev libcjson-dev libuv1-dev

        # Install optional deps for demos.
        #
        # NOTE: Keep this list updated as new deps are introduced.
        opt_deps=(
          libcjson-dev   # for github.com/goplus/lib/c/cjson
          libsqlite3-dev # for github.com/goplus/lib/c/sqlite
          python3.12-dev # for github.com/goplus/lib/py
        )
        sudo apt-get install -y "${opt_deps[@]}"
